nWhat should you recommend?","opts":["Software as a Service (SaaS)","Platform as a Service (PaaS)","Infrastructure as a Service (laaS)"],"cor":[2],"exp":"Infrastructure as a service (IaaS) is an instant computing infrastructure, provisioned and managed over the internet. The IaaS service provider manages the infrastructure, while you purchase, install, configure, and manage your own software\n\nIncorrect Answers:\nA: Software as a service (SaaS) allows users to connect to and use cloud-based apps over the Internet. Common examples are email, calendaring, and office tools. In this scenario, you need to run your own apps, and therefore require an infrastructure.\n\nB:\nPlatform as a service (PaaS) is a complete development and deployment environment in the cloud. PaaS includes infrastructure—servers, storage, and networking—but also middleware, development tools, business intelligence (BI) services, database management systems, and more. PaaS is designed to support the complete web application lifecycle: building, testing, deploying, managing, and updating.","ref":"https://azure.microsoft.com/en-us/overview/what-is-iaas/\nhttps://azure.microsoft.com/en-us/overview/what-is-saas/\nhttps://azure.microsoft.com/en-us/overview/what-is-paas/","imgs":[],"eimgs":[],"t":"mc"},{"q":"For each of the following statements, select Yes if the statement is true. Otherwise, select No.\nNOTE: Each correct selection is worth one point.\n\nHot Area:","opts":[],"cor":[],"exp":"Box 1: No\nBuilding a data center infrastructure is capital expenditure, not operation expenditure.\n\nBox 2: Yes\nOpEx is ongoing costs (costs of operations) such as staff salaries.\n\nBox 2: Yes\nOpEx is ongoing costs (costs of operations) such as leasing software. If you purchased software as a one-off purchase, that would be CapEx, but leasing software is ongoing so it’s OpEx.","ref":"","imgs":["https://free-braindumps.com/images/exam-prep/AZ-900/a406cc65-2b2d-4195-b534-ca3c8c5dfa71.jpg"],"eimgs":["https://free-braindumps.com/images/exam-prep/AZ-900/9ed28cad-8092-4597-9709-906177ecd1de.jpg"],"t":"img"},{"q":"To complete the sentence, select the appropriate option in the answer area. \nHot Area:","opts":[],"cor":[],"exp":"Azure Cosmos DB is an example of a platform as a service (PaaS) cloud database provider.","ref":"https://docs.microsoft.com/en-us/azure/cosmos-db/database-security","imgs":["https://free-braindumps.com/images/exam-prep/AZ-900/d4cb167c-ea34-4c4c-bd2e-071a328ec07e.jpg"],"eimgs":["https://free-braindumps.com/images/exam-prep/AZ-900/a6c6081d-cdcb-49d9-b25b-5ef83a85718e.jpg"],"t":"img"},{"q":"For each of the following statements, select Yes if the statement is true. Otherwise, select No.\nNOTE: Each correct selection is worth one point.\nHot Area:","opts":[],"cor":[],"exp":"","ref":"https://azure.microsoft.com/en-us/overview/what-is-saas/ \nhttps://azure.microsoft.com/en-us/overview/what-is-iaas/ \nhttps://azure.microsoft.com/en-us/overview/what-is-paas/","imgs":["https://free-braindumps.com/images/exam-prep/AZ-900/571f1a3f-d925-4ec7-a98f-b8d2cdac12e6.jpg"],"eimgs":["https://free-braindumps.com/images/exam-prep/AZ-900/43ca6996-1f96-4180-8bee-ad2c20953567.jpg"],"t":"img"},{"q":"For each of the following statements, select Yes if the statement is true. Otherwise, select No.\nNOTE: Each correct selection is worth one point.\nHot Area:","opts":[],"cor":[],"exp":"Box 1: No\n\nBox 2: No\nEach resource can exist in only one resource group.\n\nBox 3: Yes\nResources from multiple different regions can be placed in a resource group. The resource group only contains metadata about the resources it contains.","ref":"https://docs.microsoft.com/en-us/azure/azure-resource-manager/resource-group-overview https://www.codeisahighway.com/effective-ways-to-delete-resources-in-a-resource-group-on-azure/","imgs":["https://free-braindumps.com/images/exam-prep/AZ-900/0d8202bf-6d04-4961-9dc6-8899bafdcff4.jpg"],"eimgs":["https://free-braindumps.com/images/exam-prep/AZ-900/bda02b0f-48cf-41c0-8eec-df66e511236c.jpg"],"t":"img"},{"q":"For each of the following statements, select Yes if the statement is true. Otherwise, select No.\nNOTE: Each correct selection is worth one point.\nHot Area:","opts":[],"cor":[],"exp":"","ref":"https://docs.microsoft.com/en-us/azure/azure-sql/azure-sql-iaas-vs-paas-what-is-overview https://www.red-gate.com/simple-talk/cloud/azure/overview-of-azure-cosmos-db","imgs":["https://free-braindumps.com/images/exam-prep/AZ-900/301ead1f-6a4d-4125-b96c-5e9c50b5439c.jpg"],"eimgs":["https://free-braindumps.com/images/exam-prep/AZ-900/02de1f91-1b9c-46c3-aa12-a25b12eee47b.jpg"],"t":"img"},{"q":"Your company plans to migrate all its data and resources to Azure.\nThe company’s migration plan states that only Platform as a Service (PaaS) solutions must be used in Azure. You need to deploy an Azure environment that meets the company’s migration plan.\nWhat should you create?","opts":["Azure virtual machines, Azure SQL databases, and Azure Storage accounts.","an Azure App Service and Azure virtual machines that have Microsoft SQL Server installed.","an Azure App Service and Azure SQL databases.","Azure storage account and web server in Azure virtual machines."],"cor":[2],"exp":"Azure App Service and Azure SQL databases are examples of Azure PaaS solutions. Therefore, this solution does meet the goal.","ref":"","imgs":[],"eimgs":[],"t":"mc"},{"q":"What does a customer provide in a software as a service (SaaS) model?","opts":["application data","data storage","compute resources","application software"],"cor":[0],"exp":"SaaS provides a complete software solution which you purchase on a pay-as-you-go basis from a cloud service provider. You rent the use of an app for your organization and your users connect to it over the Internet, usually with a web browser. All of the underlying infrastructure, middleware, app software and app data are located in the service provider’s data center. The service provider manages the hardware and software and with the appropriate service agreement, will ensure the availability and the security of the app and your data as well.","ref":"https://azure.microsoft.com/en-in/overview/what-is-saas/","imgs":[],"eimgs":[],"t":"mc"},{"q":"For each of the following statements, select Yes if the statement is true. Otherwise, select No.\nNOTE: Each correct selection is worth one point.","opts":[],"cor":[],"exp":"","ref":"https://azure.microsoft.com/en-gb/overview/what-is-iaas/\nhttps://azure.microsoft.com/en-gb/overview/what-is-paas/\nhttps://azure.microsoft.com/en-gb/overview/what-is-saas/","imgs":["https://free-braindumps.com/images/exam-prep/AZ-900/79ab7d19-4281-4c4f-a580-36ddf12246f5.jpg"],"eimgs":["https://free-braindumps.com/images/exam-prep/AZ-900/51fa4bc0-6dc3-4804-a6a0-c698fc6759ba.jpg"],"t":"img"},{"q":"For each of the following statements, select Yes if the statement is true. Otherwise, select No.\nNOTE: Each correct selection is worth one point.","opts":[],"cor":[],"exp":"","ref":"","imgs":["https://free-braindumps.com/images/exam-prep/AZ-900/9e1ef15a-6fb5-4867-bf88-7fc5b3a749ca.jpg"],"eimgs":["https://free-braindumps.com/images/exam-prep/AZ-900/e049ce93-658c-4599-93c7-6d58dc7bcc98.jpg"],"t":"img"},{"q":"What is the first stage in the Microsoft Cloud Adoption Framework for Azure?","opts":["Adopt the cloud.","Make a plan.","Ready your organization.","Define your strategy."],"cor":[3],"exp":"","ref":"https://docs.microsoft.com/en-us/azure/cloud-adoption-framework/overview","imgs":[],"eimgs":["https://free-braindumps.com/images/exam-prep/AZ-900/04d45c92-6543-46ec-8a42-39cba7735cdf.jpg"],"t":"mc"},{"q":"For each of the following statements, select Yes if the statement is true. Otherwise, select No.\nNOTE: Each correct selection is worth one point.","opts":[],"cor":[],"exp":"Box 1: No\nYou cannot add physical servers to the public cloud. You can only deploy virtual servers in the public cloud. You can extend a private cloud by deploying virtual servers in a public cloud. This would create a hybrid cloud.\n\nBox 2: No\nA private cloud exists in cyberspace and is accessed via the internet.\n\nBox 3: Yes.","ref":"https://azure.microsoft.com/en-gb/overview/what-are-private-public-hybrid-clouds/","imgs":["https://free-braindumps.com/images/exam-prep/AZ-900/4181b464-29ec-4d77-8682-5790c317cdc1.jpg"],"eimgs":["https://free-braindumps.com/images/exam-prep/AZ-900/ac9cd35b-f97b-4798-83ce-8fd8f32a5a5d.jpg"],"t":"img"},{"q":"For each of the following statements, select Yes if the statement is true. Otherwise, select No.\nNOTE: Each correct selection is worth one point.","opts":[],"cor":[],"exp":"Box 1: No\nVirtual Machines works.\n\nBox 2: Yes\nSimply put, cloud computing is the delivery of computing services—including servers, storage, databases, networking, software, analytics, and intelligence—over the Internet (“the cloud”) to offer faster innovation, flexible resources, and economies of scale.\n\nBox 3: Yes","ref":"https://azure.microsoft.com/en-us/overview/what-is-cloud-computing/","imgs":["https://free-braindumps.com/images/exam-prep/AZ-900/2546d0eb-f143-42c6-b3b7-76dffcedcb34.jpg"],"eimgs":["https://free-braindumps.com/images/exam-prep/AZ-900/4594772c-6ede-4114-94c6-d862aac945bc.jpg"],"t":"img"},{"q":"Match the cloud computing benefits to the correct descriptions.\n\nTo answer, drag the appropriate benefit from the column on the left to its description on the right. Each benefit may be used once, more than once, or not at all.\n\nNOTE: Each correct match is worth one point.","opts":[],"cor":[],"exp":"","ref":"","imgs":["https://free-braindumps.com/images/exam-prep/AZ-900/40da4776-e339-4f6f-b206-eea97e1efe64.jpg"],"eimgs":["https://free-braindumps.com/images/exam-prep/AZ-900/8932352e-eb30-40aa-9c74-1d255d277adb.jpg"],"t":"img"},{"q":"Select the answer that correctly completes the sentence.","opts":[],"cor":[],"exp":"You set up disaster recovery for Azure VMs using Azure Site Recovery.","ref":"https://docs.microsoft.com/en-us/azure/site-recovery/azure-to-azure-tutorial-enable-replication","imgs":["https://free-braindumps.com/images/exam-prep/AZ-900/c240e0c2-9b0d-484e-82b5-a16b0c9ae3b7.jpg"],"eimgs":["https://free-braindumps.com/images/exam-prep/AZ-900/0c1388ca-64c1-43e2-bf67-b46930a6602a.jpg"],"t":"img"},{"q":"You plan to use Azure to host two apps named App1 and App2. The apps must meet the following requirements:\n\n-You must be able to modify the code of App1.\n-Administrative effort to manage the operating system of App1 must be minimized.\n-App2 must run interactively with the operating system of the server.\n\nWhich type of cloud service should you use for each app? To answer, select the appropriate options in the answer area.\n\nNOTE: Each correct selection is worth one point.","opts":[],"cor":[],"exp":"Box 1: Azure Platform as a service (PaaS)\nOrganizations typically use PaaS for these scenarios:\n\nDevelopment framework. PaaS provides a framework that developers can build upon to develop or customize cloud-based applications. Similar to the way you create an Excel macro, PaaS lets developers create applications using built-in software components. Cloud features such as scalability, high-availability, and multi-tenant capability are included, reducing the amount of coding that developers must do.\n\nBox 2: \nSoftware as a service (SaaS) allows users to connect to and use cloud-based apps over the Internet. Common examples are email, calendaring, and office tools (such as Microsoft Office 365).\n\nSaaS provides a complete software solution that you purchase on a pay-as-you-go basis from a cloud service provider. You rent the use of an app for your organization, and your users connect to it over the Internet, usually with a web browser. All of the underlying infrastructure, middleware, app software, and app data are located in the service provider’s data center. The service provider manages the hardware and software, and with the appropriate service agreement, will ensure the availability and the security of the app and your data as well. SaaS allows your organization to get quickly up and running with an app at minimal upfront cost.","ref":"https://azure.microsoft.com/en-us/overview/what-is-paas/","imgs":["https://free-braindumps.com/images/exam-prep/AZ-900/dcd7cf72-3359-4ecd-8bad-9469ab84cf7e.jpg"],"eimgs":["https://free-braindumps.com/images/exam-prep/AZ-900/eea06293-5068-4833-b4c4-c5b2a87d9faa.jpg","https://free-braindumps.com/images/exam-prep/AZ-900/0213a3d2-f05c-433b-96ba-fa4e5ba805a5.jpg"],"t":"img"},{"q":"You have an accounting application named App1 that uses a legacy database.\nYou plan to move App1 to the cloud.\nWhich service model should you use?","opts":["platform as a service (PaaS)","infrastructure as a service (IaaS)","software as a service (SaaS)"],"cor":[1],"exp":"Cloud Infrastructure-based Applications – It moves your existing on-premises apps to the Infrastructure as a Service (IaaS) platform or re-hosts them. “Lift & Shift” is a common term for this type of relocation. The programs will be nearly identical to what they were before, but they will now be able to run on cloud VMs.","ref":"https://techtaalk.com/microsoft-azure-for-legacy-application-modernization/","imgs":[],"eimgs":[],"t":"mc"},{"q":"Select the answer that correctly completes the sentence.","opts":[],"cor":[],"exp":"Box: hybrid\nYou can deploy hybrid app with on-premises data that scales cross-cloud.","ref":"https://docs.microsoft.com/en-us/azure/architecture/hybrid/deployments/solution-deployment-guide-cross-cloud-scaling-onprem-data","imgs":["https://free-braindumps.com/images/exam-prep/AZ-900/756c4c26-fcf2-4024-9441-26d64151d6e1.jpg"],"eimgs":["https://free-braindumps.com/images/exam-prep/AZ-900/6cb9fe87-35c2-4fe3-a4a3-489230fb8118.jpg"],"t":"img"},{"q":"Select the answer that correctly completes the sentence.","opts":[],"cor":[],"exp":"Box: Platform as a service (PaaS)\nPlatform as a service (PaaS) is a complete development and deployment environment in the cloud, with resources that enable you to deliver everything from simple cloud-based apps to sophisticated, cloud-enabled enterprise applications. You purchase the resources you need from a cloud service provider on a pay-as-you-go basis and access them over a secure Internet connection.\n\nLike IaaS, PaaS includes infrastructure—servers, storage, and networking—but also middleware, development tools, business intelligence (BI) services, database management systems, and more.","ref":"https://azure.microsoft.com/en-us/overview/what-is-paas/","imgs":["https://free-braindumps.com/images/exam-prep/AZ-900/563357d8-f728-4a33-93b8-85064005bf01.jpg"],"eimgs":["https://free-braindumps.com/images/exam-prep/AZ-900/8d935168-dd68-4370-8416-b5a15543eee7.jpg"],"t":"img"},{"q":"Which cloud computing model includes on-premises and cloud-based resources?","opts":["hybrid","public","private"],"cor":[0],"exp":"A hybrid cloud — sometimes called a cloud hybrid — is a computing environment that combines an on-premises datacenter (also called a private cloud) with a public cloud, allowing data and applications to be shared between them. Some people define hybrid cloud to include “multicloud” configurations where an organization uses more than one public cloud in addition to their on-premises datacenter.","ref":"https://azure.microsoft.com/en-us/overview/what-is-hybrid-cloud-computing/","imgs":[],"eimgs":[],"t":"mc"},{"q":"Select the answer that correctly completes the sentence.","opts":[],"cor":[],"exp":"An Azure virtual machine scale set can automatically increase or decrease the number of VM instances that run your application. This automated and elastic behavior reduces the management overhead to monitor and optimize the performance of your application.\n\nAlso: Azure elasticity as a service is referred to a cloud service that enables in automatically scaling Azure hosted resources in par with the demand and configured parameters. It provides Azure Administrators with the ability to auto scale Azure infrastructure and resources as and when needed.","ref":"https://docs.microsoft.com/en-us/azure/virtual-machine-scale-sets/virtual-machine-scale-sets-autoscale-overview\nhttps://www.netreo.com/cloud-automation/what-is-azure-elasticity-as-a-service/","imgs":["https://free-braindumps.com/images/exam-prep/AZ-900/40bcb3ae-a880-411f-af37-7eead201b885.jpg"],"eimgs":["https://free-braindumps.com/images/exam-prep/AZ-900/08308d8d-9534-4ee7-85ad-0858e2d234e6.jpg"],"t":"img"},{"q":"Which term represents the ability to increase the computing capacity of a virtual machine by adding memory or CPUs?","opts":["agility","vertical scaling","horizontal scaling","elasticity"],"cor":[1],"exp":"Vertical scaling, also known as scale up and scale down, means increasing or decreasing virtual machine (VM) sizes in response to a workload. Compare this behavior with horizontal scaling, also referred to as scale out and scale in, where the number of VMs is altered depending on the workload.","ref":"https://docs.microsoft.com/en-us/azure/virtual-machine-scale-sets/virtual-machine-scale-sets-vertical-scale-reprovision","imgs":[],"eimgs":[],"t":"mc"},{"q":"What are two benefits of cloud computing? Each correct answer presents a complete solution.\nNOTE: Each correct selection is worth one point.","opts":["enables the rapid provisioning of resources","has increased administrative complexity","has the same configuration options as on-premises","shifts capital expenditures (CapEx) to operating expenditures (OpEx)"],"cor":[0,3],"exp":"Azure allows you to build, deploy, and manage apps more quickly and easily without having to buy and/or maintain the underlying infrastructure.\n\nAzure provides flexibility between CapEx and OpEx\nCapital expenditures generate benefits over a long period. These expenditures are generally nonrecurring and result in the acquisition of permanent assets. Building an application could qualify as a capital expenditure. Example, Azure Reserved Instances (Azure RI) help Azure’s most active customers save on long-term VM usage reserving VMs in advance at a discounted price by committing to a one or three-year benefits.\n\nOperating expenditures are ongoing costs of doing business. Consuming cloud services in a pay-as-you-go model could qualify as an operating expenditure. Example, you pay for a service or product as you use it i.e. pay-as-you-go pricing.","ref":"https://www.protechtraining.com/blog/post/top-5-benefits-of-microsoft-azure-for-business-934\nhttps://www.azureguru.org/capex-vs-opex/#","imgs":[],"eimgs":[],"t":"mc"},{"q":"What is a feature of an Azure virtual network?","opts":["resource cost analysis","packet inspection","geo-redundancy","isolation and segmentation"],"cor":[3],"exp":"Implement network segmentation patterns on Azure.\nA unified enterprise segmentation strategy guides technical teams to consistently segment access using networking, applications, identity, and any other access controls. Create segmentation in your network footprint by defining perimeters. \nThe main reasons for segmentation are:\n\nThe ability to group related assets that are a part of (or support) workload operations.\nIsolation of resources.\nGovernance policies set by the organization.","ref":"https://docs.microsoft.com/en-us/azure/architecture/framework/security/design-network-segmentation","imgs":[],"eimgs":[],"t":"mc"},{"q":"Select the answer that correctly completes the sentence.","opts":[],"cor":[],"exp":"Because of geo-distribution you can deploy apps and data to regional datacenters around the globe, thereby ensuring that your customers always have the best performance in their region.","ref":"https://docs.microsoft.com/learn/modules/fundamental-azure-concepts/benefits-of-cloud-computing","imgs":["https://free-braindumps.com/images/exam-prep/AZ-900/ebf9ebc8-b4d5-4e8d-81fb-d3de2414826a.jpg"],"eimgs":["https://free-braindumps.com/images/exam-prep/AZ-900/7ffd0096-c7bb-4949-a2e4-70960454b387.jpg"],"t":"img"},{"q":"Match the cloud computing benefits to the appropriate descriptions.\n\nTo answer, drag the appropriate benefit from the column on the left to its description on the right. Each benefit may be used once, more than once, or not at all.\n\nNOTE: Each correct match is worth one point.","opts":[],"cor":[],"exp":"","ref":"https://docs.microsoft.com/learn/modules/fundamental-azure-concepts/benefits-of-cloud-computing","imgs":["https://free-braindumps.com/images/exam-prep/AZ-900/7e11efe3-a422-426c-8119-28cda3bd998a.jpg"],"eimgs":["https://free-braindumps.com/images/exam-prep/AZ-900/097b823c-cdf7-4df7-8521-5517c2abf907.jpg"],"t":"img"},{"q":"Which cloud computing benefit provides continuous user access to a cloud-based application with minimal downtime?","opts":["agility","scalability","elasticity","high availability"],"cor":[3],"exp":"","ref":"","imgs":[],"eimgs":[],"t":"mc"},{"q":"What enables a cloud service to adapt quickly to changing requirements?","opts":["high availability","predictability","manageability","agility"],"cor":[3],"exp":"Agility is the ability to react quickly.\n\nIn the cloud, it takes a minute or two to create a Virtual Machine that is up and running. On the other hand, it takes days or weeks when we submit a request to purchase a physical server and by when it gets delivered.\n\nAgility enables users to be able to allocate and deallocate resources very quickly, and that is a huge benefit of the cloud.","ref":"https://coderjony.com/blogs/cloud-computing-concepts-high-availability-scalability-elasticity-agility-fault-tolerance-and-disaster-recovery","imgs":[],"eimgs":[],"t":"mc"},{"q":"What is an example of vertical scaling in a cloud environment?","opts":["adding an additional CPU to an existing Azure virtual machine","adding an additional Azure virtual machine","adding an additional Azure Virtual Desktop session host","adding an additional Azure App Service instance automatically"],"cor":[0],"exp":"Scaling up and down, which is also referred to as vertical scaling, is the process of upgrading an existing virtual machine to a more powerful virtual machine, or downgrading to a smaller, less powerful virtual machine. In Azure, this means resizing the existing VM to a larger size with more RAM and more CPU, or to a smaller size with less RAM and less CPU. Because vertical scaling involves the re-size of virtual machines, this kind of scaling results in VM restarts.","ref":"https://cloudacademy.com/course/advanced-vm-management-in-azure-1020/vertical-scaling-vs-horizontal-scaling/","imgs":[],"eimgs":[],"t":"mc"},{"q":"For each of the following statements, select Yes if the statement is true. Otherwise, select No.\nNOTE: Each correct selection is worth one point.","opts":[],"cor":[],"exp":"Box 1: Yes\nCapEx (Capital Expenditures): Purchasing an asset (factory, computer system, company car) is considered a capital expenditure. It requires payment for the entire asset, and the cost becomes an entry on the company’s balance sheet, depreciated over some period of time. This asset strategy also includes other costs such as upkeep, insurance, and personnel tied to the assets use.","ref":"https://www.archive360.com/blog/capex-or-opex-on-premise-versus-the-cloud-which-saves-more-money","imgs":["https://free-braindumps.com/images/exam-prep/AZ-900/eb644bcf-ee83-4413-91fe-5872acfe0e43.jpg"],"eimgs":["https://free-braindumps.com/images/exam-prep/AZ-900/36f5d0c0-bd31-4080-b968-bfff1c4f525a.jpg"],"t":"img"},{"q":"For each of the following statements, select Yes if the statement is true. Otherwise, select No.\nNOTE: Each correct selection is worth one point.","opts":[],"cor":[],"exp":"Box 1: No\nAzure Functions integrates with Azure software as a service (SaaS) offerings, including Azure Cosmos DB, Azure Mobile Apps and Azure Service Bus.\n\nPlatform as a service. Platform as a service (PaaS) is a complete development and deployment environment in the cloud, with resources that enable you to deliver everything from simple cloud-based apps to sophisticated, cloud-enabled enterprise applications.\n\nBox 2: Yes\nSoftware as a service (SaaS) allows users to connect to and use cloud-based apps over the Internet. Common examples are email, calendaring, and office tools (such as Microsoft Office 365).\n\nBox 3: Yes\nAzure Virtual Machines are image service instances Azure IaaS uses to deploy persistent VMs with nearly any server workload that you want.","ref":"https://azure.microsoft.com/en-us/resources/cloud-computing-dictionary/what-is-paas/\nhttps://azure.microsoft.com/en-us/resources/cloud-computing-dictionary/what-is-saas\nhttps://azure.microsoft.com/en-us/resources/cloud-computing-dictionary/what-is-azure/azure-iaas","imgs":["https://free-braindumps.com/images/exam-prep/AZ-900/bf9063dc-71af-4803-8328-38d6ba9e165c.jpg"],"eimgs":["https://free-braindumps.com/images/exam-prep/AZ-900/14da669a-609e-4c7b-8e68-6ddffa86f84a.jpg"],"t":"img"},{"q":"Match the cloud computing benefits to the appropriate requirements.\n\nTo answer, drag the appropriate benefit from the column on the left to its requirement on the right. Each benefit may be used once, more than once, or not at all.\n\nNOTE: Each correct match is worth one point.","opts":[],"cor":[],"exp":"Box 1: High availability\n\nBox 2: Geo-distribution\nYou can direct traffic with a geo-distributed app using Azure and Azure Stack Hub.\n\nUse the geo-distributed apps pattern\nWith the geo-distributed pattern, your app spans regions. You can default to the public cloud, but some of your users may require that their data remain in their region. You can direct users to the most suitable cloud based on their requirements.\n\nBox 3: Scalability","ref":"https://docs.microsoft.com/en-us/azure/architecture/hybrid/deployments/solution-deployment-guide-geo-distributed","imgs":["https://free-braindumps.com/images/exam-prep/AZ-900/40307c7c-b524-4680-9cbe-729b563e01af.jpg"],"eimgs":["https://free-braindumps.com/images/exam-prep/AZ-900/62472dfc-914b-4879-b5a2-270c27b40786.jpg"],"t":"img"},{"q":"Match the Azure services to the appropriate descriptions.\n\nTo answer, drag the appropriate service from the column on the left to its description on the right. Each service may be used once, more than once, or not at all.\n\nNOTE: Each correct match is worth one point.","opts":[],"cor":[],"exp":"Box 1: ExpressRoute\nExpressRoute lets you extend your on-premises networks into the Microsoft cloud over a private connection with the help of a connectivity provider. With ExpressRoute, you can establish connections to Microsoft cloud services, such as Microsoft Azure and Microsoft 365.\n\nBox 2: Virtual network peering\nVirtual network peering enables you to seamlessly connect two or more Virtual Networks in Azure. The virtual networks appear as one for connectivity purposes. The traffic between virtual machines in peered virtual networks uses the Microsoft backbone infrastructure.\n\nBox 3: VPN gateway\nVPN gateways provide secure connectivity between multiple sites, such as on-premises data centers, Google Cloud Virtual Private Cloud (VPC) networks, and Google Cloud VMware Engine private clouds. Traffic is encrypted because the VPN connections traverse the internet.","ref":"https://docs.microsoft.com/en-us/azure/expressroute/expressroute-introduction\nhttps://docs.microsoft.com/en-us/azure/virtual-network/virtual-network-peering-overview\nhttps://cloud.google.com/vmware-engine/docs/concepts-vpn-gateways","imgs":["https://free-braindumps.com/images/exam-prep/AZ-900/8e09ce43-8790-4133-bdff-4e451ea127ed.jpg"],"eimgs":["https://free-braindumps.com/images/exam-prep/AZ-900/d5e90e29-9570-4ade-b1ba-34286eac6fa2.jpg"],"t":"img"},{"q":"Select the answer that correctly completes the sentence.","opts":[],"cor":[],"exp":"","ref":"","imgs":["https://free-braindumps.com/images/exam-prep/AZ-900/46b3f76e-9c8a-4125-8c21-f553b977368c.jpg"],"eimgs":["https://free-braindumps.com/images/exam-prep/AZ-900/8b086dd6-3d02-4aa7-9565-f184f5d8984c.jpg"],"t":"img"},{"q":"Which cloud service model minimizes the management responsibility of a customer?","opts":["infrastructure as a service (IaaS)","platform as a service (PaaS)","software as a service (SaaS)"],"cor":[2],"exp":"Software as a service (SaaS) allows users to connect to and use cloud-based apps over the Internet. Common examples are email, calendaring, and office tools (such as Microsoft Office 365).\nSaaS provides a complete software solution that you purchase on a pay-as-you-go basis from a cloud service provider. You rent the use of an app for your organization, and your users connect to it over the Internet, usually with a web browser. All of the underlying infrastructure, middleware, app software, and app data are located in the service provider’s data center. The service provider manages the hardware and software, and with the appropriate service agreement, will ensure the availability and the security of the app and your data as well. SaaS allows your organization to get quickly up and running with an app at minimal upfront cost.","ref":"https://azure.microsoft.com/en-us/resources/cloud-computing-dictionary/what-is-saas/","imgs":[],"eimgs":["https://free-braindumps.com/images/exam-prep/AZ-900/670c832d-6cff-40ae-8fb5-96f289078f27.jpg"],"t":"mc"},{"q":"Select the answer that correctly completes the sentence.","opts":[],"cor":[],"exp":"Box 1: elasticity\nElastic computing is the ability to quickly expand or decrease computer processing, memory, and storage resources to meet changing demands without worrying about capacity planning and engineering for peak usage. Typically controlled by system monitoring tools, elastic computing matches the amount of resources allocated to the amount of resources actually needed without disrupting operations. With cloud elasticity, a company avoids paying for unused capacity or idle resources and doesn’t have to worry about investing in the purchase or maintenance of additional resources and equipment.\n\nIncorrect:\n* governance\nApp governance integration with Azure AD and Defender for Cloud Apps\nApp governance, Azure AD, and Defender for Cloud Apps collect and provide different data sets:\n\nApp governance provides detailed information about an app’s activity at the API level.\nAzure AD provides foundational app metadata and detailed information on sign-ins to apps.\nDefender for Cloud Apps provides app risk information.","ref":"https://azure.microsoft.com/en-us/resources/cloud-computing-dictionary/what-is-elastic-computing/","imgs":["https://free-braindumps.com/images/exam-prep/AZ-900/c93a3ea6-7a46-4980-b797-8b399d899891.jpg"],"eimgs":["https://free-braindumps.com/images/exam-prep/AZ-900/8a4b5e90-8341-49f7-a3bb-52ad65d84357.jpg"],"t":"img"},{"q":"Select the answer that correctly completes the sentence.","opts":[],"cor":[],"exp":"Box: platform as a service (PaaS)\nAzure Cosmos DB is a fully managed platform-as-a-service (PaaS).","ref":"https://learn.microsoft.com/en-us/azure/cosmos-db/resource-model","imgs":["https://free-braindumps.com/images/exam-prep/AZ-900/ec225e37-b748-4f15-a99c-7cbddeaa5414.jpg"],"eimgs":["https://free-braindumps.com/images/exam-prep/AZ-900/08081ece-cd62-434b-8c2a-4264444fa1c6.jpg"],"t":"img"},{"q":"Select the answer that correctly completes the sentence.","opts":[],"cor":[],"exp":"Box: High availability \nHigh availability is a quality of computing infrastructure that is important for mission-critical systems. High availability permits the computing infrastructure to continue functioning, even when certain components fail.","ref":"https://bluexp.netapp.com/blog/azure-high-availability-basic-concepts-and-a-checklist","imgs":["https://free-braindumps.com/images/exam-prep/AZ-900/86166766-65bd-4d49-ae03-3da0971286d4.jpg"],"eimgs":["https://free-braindumps.com/images/exam-prep/AZ-900/23d31695-274c-4982-a03a-cd8da051d151.jpg"],"t":"img"},{"q":"What should a desktop application use to interact with Azure and manage resources?","opts":["APIs","Azure Resource Manager (ARM) templates","Azure Command-Line Interface (CLI)","Azure Cloud Shell"],"cor":[0],"exp":"Infrastructure as Code: manage configuration using code. To make APIs calls based on what is written on the code instead of using graphical interfaces.\n\nThe word configuration was purposeful. When we talk about Infrastructure as Code we are not referring to just virtualized hardware anymore. But to any kind of configuration that can be managed through API.\n\nAPIs were the Infrastructure as Code movement enabler.\nNowadays, it is common to manage SaaS configuration and other tools using code. Even for internal platforms, this had become possible.\n\nSo, when someone talks to you about Infrastructure as Code remember: are the APIs that make all this possible!\n\nNote: Infrastructure as Code is the process of managing and provisioning resources through declarative configuration files. Infrastructure as code tools use a declarative end state specification to guarantee a set of resources are created and configured the same way each time. Further, most infrastructure as code tools monitor resources to make sure they remain configured in the desired state.","ref":"https://blog.devgenius.io/infrastructure-as-code-and-apis-b3e4f0c6eb1b\nhttps://learn.microsoft.com/en-us/azure/developer/intro/azure-developer-create-resources","imgs":[],"eimgs":[],"t":"mc"},{"q":"Match the cloud computing benefits to the appropriate descriptions.\n\nTo answer, drag the appropriate benefit from the column on the left to its requirement on the right. Each benefit may be used once, more than once, or not at all.\n\nNOTE: Each correct match is worth one point.","opts":[],"cor":[],"exp":"Box 1: Elasticity\nElasticity: The ability to automatically or dynamically increase or decrease resources as needed.\n\nElasticity focuses on the ability to automatically scale resources based on demand. This helps you to optimize your resources and reduce costs, while still ensuring that your applications have the resources they need to run smoothly.\n\nBox 2: Disaster recovery \n\nBox 3: Agility \nAgility: Cloud services can allocate and deallocate resources quickly. They are provided on-demand via self-service, so vast amounts of computing resources can be provisioned in minutes.\n\nAgility focuses on the speed and ease of allocating and deallocating resources. This allows for vast amounts of computing resources to be provisioned in a matter of minutes, making it easier for you to respond to changing business needs.","ref":"https://learn.microsoft.com/en-us/answers/questions/1184630/difference-between-agility-and-elasticity","imgs":["https://free-braindumps.com/images/exam-prep/AZ-900/a5b727c2-b23f-4561-b7a0-6f19ce079204.jpg"],"eimgs":["https://free-braindumps.com/images/exam-prep/AZ-900/6c0e78d3-e933-4506-a76a-50a17aea8d26.jpg"],"t":"img"},{"q":"Match the security components to the appropriate defense in depth layers.\n\nTo answer, drag the appropriate security component from the column on the left to its defense in depth layer on the right Each security component may be used once, more than once, or not at all.\n\nNOTE: Each correct match is worth one point.","opts":[],"cor":[],"exp":"","ref":"","imgs":["https://free-braindumps.com/images/exam-prep/AZ-900/7dde8a90-89bd-48c8-9aea-b46640c347a5.jpg"],"eimgs":["https://free-braindumps.com/images/exam-prep/AZ-900/fd45515c-5806-4170-bbe4-63d59fa44f1b.jpg"],"t":"img"},{"q":"In the infrastructure as a service (IaaS) cloud service model, which two components are the responsibility of the cloud service provider? Each correct answer presents a complete solution.\n\nNOTE: Each correct selection is worth one point.","opts":["the configuration and maintenance of storage","the installation and configuration of the operating system","maintaining the hardware","the network configuration","physical security of the datacenter infrastructure"],"cor":[2,4],"exp":"Infrastructure as a service (IaaS) is a type of cloud computing service that offers essential compute, storage, and networking resources on demand, on a pay-as-you-go basis. IaaS is one of the four types of cloud services, along with software as a service (SaaS), platform as a service (PaaS), and serverless.\n\nMigrating your organization's infrastructure to an IaaS solution helps you reduce maintenance of on-premises data centers, save money on hardware costs, and gain real-time business insights. IaaS solutions give you the flexibility to scale your IT resources up and down with demand. They also help you quickly provision new applications and increase the reliability of your underlying infrastructure.\n\nIaaS lets you bypass the cost and complexity of buying and managing physical servers and datacenter infrastructure. Each resource is offered as a separate service component, and you only pay for a particular resource for as long as you need it. A cloud computing service provider like Azure manages the infrastructure, while you purchase, install, configure, and manage your own software — including operating systems, middleware, and applications.","ref":"https://azure.microsoft.com/en-us/resources/cloud-computing-dictionary/what-is-iaas","imgs":[],"eimgs":["https://free-braindumps.com/images/exam-prep/AZ-900/4069ffba-d7ae-4f73-96ac-6f89687eebb2.jpg"],"t":"mc"},{"q":"You need to identify a customer’s level of shared responsibility based on the cloud service model.\n\nIn which order should you list each model from most customer responsibility to least customer responsibility? To answer, move all models from the list of models to the answer area and arrange them in the correct order.","opts":[],"cor":[],"exp":"Step 1: Infrastructure as a service (IaaS)\nInfrastructure as a service (IaaS) is a type of cloud computing service that offers essential compute, storage, and networking resources on demand, on a pay-as-you-go basis.\n\nStep 2: Platform as a service (PaaS)\nPlatform as a service (PaaS) is a complete development and deployment environment in the cloud, with resources that enable you to deliver everything from simple cloud-based apps to sophisticated, cloud-enabled enterprise applications. You purchase the resources you need from a cloud service provider on a pay-as-you-go basis and access them over a secure Internet connection.\n\nLike IaaS, PaaS includes infrastructure—servers, storage, and networking—but also middleware, development tools, business intelligence (BI) services, database management systems, and more. PaaS is designed to support the complete web application lifecycle: building, testing, deploying, managing, and updating.\n\nStep 3: Software as a service (SaaS)\nSoftware as a service (SaaS) allows users to connect to and use cloud-based apps over the Internet. Common examples are email, calendaring, and office tools (such as Microsoft Office 365).\n\nSaaS provides a complete software solution that you purchase on a pay-as-you-go basis from a cloud service provider. You rent the use of an app for your organization, and your users connect to it over the Internet, usually with a web browser. All of the underlying infrastructure, middleware, app software, and app data are located in the service provider’s data center. The service provider manages the hardware and software, and with the appropriate service agreement, will ensure the availability and the security of the app and your data as well. SaaS allows your organization to get quickly up and running with an app at minimal upfront cost.","ref":"https://azure.microsoft.com/en-us/resources/cloud-computing-dictionary/what-is-iaas\nhttps://azure.microsoft.com/en-us/resources/cloud-computing-dictionary/what-is-paas/\nhttps://azure.microsoft.com/en-us/resources/cloud-computing-dictionary/what-is-saas/","imgs":["https://free-braindumps.com/images/exam-prep/AZ-900/64ff6f04-ac49-488c-aa72-a1441234d1fc.jpg"],"eimgs":["https://free-braindumps.com/images/exam-prep/AZ-900/3218b83b-cd18-4923-8855-bcd49a3c4ba2.jpg","https://free-braindumps.com/images/exam-prep/AZ-900/29378872-c3a7-44bb-a892-cde1166e6e6e.jpg"],"t":"img"},{"q":"Select the answer that correctly completes the sentence.","opts":[],"cor":[],"exp":"Box: scalable\nScalability in cloud computing is the ability to quickly and easily increase or decrease the size or power of an IT solution or resource.","ref":"https://azure.microsoft.com/en-us/resources/cloud-computing-dictionary/scaling-out-vs-scaling-up","imgs":["https://free-braindumps.com/images/exam-prep/AZ-900/05a064d8-3aca-4b0a-a035-107a2ecac5dc.jpg"],"eimgs":["https://free-braindumps.com/images/exam-prep/AZ-900/d6e901fd-3fdf-4df8-b351-15375295a3e8.jpg"],"t":"img"},{"q":"For each of the following statements, select Yes if the statement is true. Otherwise, select No.\n\nNOTE: Each correct selection is worth one point.","opts":[],"cor":[],"exp":"Box 1: No\nHorizontal scaling refers to adding more instances, or removing instances, of resources used by a workload. For example, extending an application from one compute instance to five compute instances. The Microsoft Azure cloud supports automatic horizontal scaling for compute instances, called virtual machines (VMs).\n\nHorizontal scaling is flexible in a cloud situation because you can use it to run a large number of VMs to handle load. In contrast, scaling up and down, or vertical scaling, keeps the same number of resource instances constant but gives them more capacity in terms of memory, CPU speed, disk space, and network.\n\nBox 2: No\n\nBox 3: Yes\nAutoscale scales in and out, or horizontally. Scaling horizontally is an increase or decrease of the number of resource instances.","ref":"https://learn.microsoft.com/en-us/azure/azure-monitor/autoscale/autoscale-overview","imgs":["https://free-braindumps.com/images/exam-prep/AZ-900/859f4c42-64cc-4c11-a2c9-ab0f24713f96.jpg"],"eimgs":["https://free-braindumps.com/images/exam-prep/AZ-900/4a9920ee-652e-4ec7-acce-cc58d62c9dcb.jpg"],"t":"img"},{"q":"For each of the following statements, select Yes if the statement is true. Otherwise, select No.\n\nNOTE: Each correct selection is worth one point.","opts":[],"cor":[],"exp":"Box 1: No\nNo - Creating and configuring a virtual network is part of the platform as a service (PaaS)\n\nThe ISP configures the virtual network.\n\nPaaS includes:\nDevelopment tools, database management, business analytics\nOperating systems\n\nPaaS includes IaaS, which includes:\nServers and storage\n*-> Networking firewalls/security\nData center physical plant/building\n\nNote: \nPlatform as a service (PaaS) is a complete development and deployment environment in the cloud, with resources that enable you to deliver everything from simple cloud-based apps to sophisticated, cloud-enabled enterprise applications. You purchase the resources you need from a cloud service provider on a pay-as-you-go basis and access them over a secure Internet connection.\n\nLike IaaS, PaaS includes infrastructure—servers, storage, and networking—but also middleware, development tools, business intelligence (BI) services, database management systems, and more. PaaS is designed to support the complete web application lifecycle: building, testing, deploying, managing, and updating.\n\nBox 2: No\nUpdating code for an Azure web app is at AaaS tier.\n\nAdvantages of PaaS over IaaS\nWhen it's possible, use PaaS instead of IaaS. IaaS is like having a box of parts. You can build anything, but you have to assemble it yourself. PaaS options are easier to configure and administer. You don't need to set up virtual machines (VMs) or virtual networks. You also don't have to handle maintenance tasks, such as installing patches and updates.\n\nBox 3: Yes\nThe PaaS customer is responsible for securing its applications, data, and user access.","ref":"https://azure.microsoft.com/en-us/resources/cloud-computing-dictionary/what-is-paas\nhttps://learn.microsoft.com/en-us/azure/architecture/guide/design-principles/managed-services\nhttps://www.skyhighsecurity.com/cybersecurity-defined/what-is-paas.html","imgs":["https://free-braindumps.com/images/exam-prep/AZ-900/ebdcf469-a6b8-42ea-ad44-9b3f90f1c022.jpg"],"eimgs":["https://free-braindumps.com/images/exam-prep/AZ-900/3e47aad7-f069-44dd-8218-3247477cb786.jpg","https://free-braindumps.com/images/exam-prep/AZ-900/d366827f-ee1b-4411-96be-755e6095bb03.jpg"],"t":"img"},{"q":"You need to migrate an on-premises server by using a lift-and-shift migration.\n\nTo which type of cloud service should you migrate?","opts":["infrastructure as a service (IaaS)","software as a service (SaaS)","platform as a service (PaaS)"],"cor":[0],"exp":"A \"lift and shift\" migration is best suited for Infrastructure as a Service (IaaS) providers such as Amazon Web Services, Microsoft Azure, and Google Cloud Platform.\n\nA \"lift and shift\" migration is best suited for Infrastructure as a Service (IaaS) providers such as Amazon Web Services, Microsoft Azure, and Google Cloud Platform. These providers offer virtual machines that can be configured to match on-premises servers, making it easy to move the application to the cloud without any significant changes. Other services such as storage, load balancers, and backups can also be used to support the migration. While lift and shift migration is a good option, it may not be the most cost-effective or efficient way to move to the cloud. Consider consulting with a cloud solution architect to see if re-architecture or another migration strategy is more appropriate.","ref":"https://brainly.in/question/54792199","imgs":[],"eimgs":[],"t":"mc"},{"q":"For each of the following statements, select Yes if the statement is true. Otherwise, select No.\n\nNOTE: Each correct selection is worth one point.","opts":[],"cor":[],"exp":"Box 1: Yes\nYes - Horizontal scaling can automatically increase the number of virtual machines.\n\nHorizontal scaling refers to increasing or decreasing the number of resource instances, such as virtual machines or containers. In the context of a VM scaling set, horizontal scaling involves adding more VMs when more capacity is needed or removing VMs when there are excess resources. Horizontal scaling is especially useful in cloud environments, as it allows a large number of instances to be run to handle varying workloads. This approach is flexible and can easily adapt to fluctuations in demand.\n\nBox 2: Yes\nVertical scaling refers to increasing or decreasing the resource capacity of existing instances while keeping the number of instances constant. This is achieved by providing more capacity in terms of memory, CPU speed, disk space and network to existing instances.\n\nBox 3: Yes\nYes - Scaling can be used to manage costs based on the demand of a service.\n\nRecommendations for optimizing scaling costs\nThe goal of cost optimizing scaling is to scale up and out at the last responsible moment and to scale down and in as soon as it’s practical. To optimize scaling for your workload, you can evaluate alternative scaling options within the scale units and align them with the cost model. A scale unit represents a specific grouping of resources that can be scaled independently or together. You should design scale units to handle a specific amount of load, and they can comprise multiple instances, servers, or other resources. You need to evaluate the cost effectiveness of your workload scale units and model alternates.","ref":"https://intelequia.com/en/blog/post/autoscale-in-azure-what-is-it-how-to-implement-it-and-benefits-it-offers\nhttps://learn.microsoft.com/en-us/azure/well-architected/cost-optimization/optimize-scaling-costs","imgs":["https://free-braindumps.com/images/exam-prep/AZ-900/4cca9487-4e78-4e5a-bb0f-68330334fa31.jpg"],"eimgs":["https://free-braindumps.com/images/exam-prep/AZ-900/5392c07e-583f-4ec1-9f2f-1b9c8fc93a3a.jpg"],"t":"img"},{"q":"Select the answer that correctly completes the sentence.","opts":[],"cor":[],"exp":"Box: availability\nA service that has an uptime of 99.999% has more ________ than a service that has an uptime of 99.9%.","ref":"","imgs":["https://free-braindumps.com/images/exam-prep/AZ-900/11b61828-f497-4a45-8eb7-9cf094b991b3.jpg"],"eimgs":["https://free-braindumps.com/images/exam-prep/AZ-900/348b73f6-1d48-486d-8bdc-65152844d663.jpg"],"t":"img"},{"q":"To which type of cloud service can you install an operating system?","opts":["infrastructure as a service (IaaS) only","platform as a service (PaaS) only","software as a service (SaaS) only","infrastructure as a service (IaaS) and platform as a service (PaaS) only","platform as a service (PaaS) and software as a service (SaaS) only"],"cor":[0],"exp":"Infrastructure as a Service (IaaS), Platform as a Service (PaaS), and Software as a Service (SaaS) all deliver varying levels of control and management.\n\nKnow the Difference Between IaaS, PaaS, and SaaS:\n\n*-> Infrastructure as a Service (IaaS) delivers the hardware for cloud services, including servers, networking, and storage.\n\n-Platform as a Service (PaaS) gives you everything available with IaaS, plus the operating system and databases.\n\n-Software as a Service (SaaS) offers the most support, providing your end users with everything except for their data.\n-","ref":"","imgs":[],"eimgs":[],"t":"mc"},{"q":"Match the cloud service to the appropriate description.\n\nTo answer, drag the appropriate cloud service from the column on the left to its description on the right. Each service may be used once, more than once, or not at all.\n\nNOTE: Each correct match is worth one point.","opts":[],"cor":[],"exp":"Infrastructure as a service (IaaS):\nProvides the most control of a cloud environment.\nUsed to host Azure virtual machines.\nIaaS gives users the most control over the cloud environment, as they manage virtual machines, storage, and networking. Azure Virtual Machines are an example of IaaS.\n\nPlatform as a service (PaaS):\nProvides the most control of a database design without having to maintain the operating system.\nPaaS provides an environment where users can manage applications and databases, but the cloud provider handles the underlying infrastructure, including the operating system.\n\nSoftware as a service (SaaS):\nNot used in this scenario. SaaS refers to cloud-based applications that are fully managed by the provider and are typically accessed over the internet (e.g., Microsoft 365).","ref":"","imgs":["https://free-braindumps.com/images/exam-prep/AZ-900/29d66cec-1c5e-403a-b025-e30ba8bb091a.jpg"],"eimgs":["https://free-braindumps.com/images/exam-prep/AZ-900/9c856510-4930-4e35-b7b0-3820f17f2612.jpg"],"t":"img"},{"q":"You have an Azure environment that contains multiple Azure virtual machines.\n\nYou plan to implement a solution that enables the client computers on your on-premises network to communicate to the Azure virtual machines.\n\nYou need to recommend which Azure resources must be created for the planned solution.\nWhich two Azure resources should you include in the recommendation? Each correct answer presents part of the solution.\n\nNOTE: Each correct selection is worth one point.","opts":["a virtual network gateway","a load balancer","an application gateway","a virtual network","a gateway subnet"],"cor":[0,3],"exp":"","ref":"","imgs":[],"eimgs":[],"t":"mc"},{"q":"You attempt to create several managed Microsoft SQL Server instances in an Azure environment and receive a message that you must increase your Azure subscription limits.\nWhat should you do to increase the limits?","opts":["Create a service health alert","Upgrade your support plan","Modify an Azure policy","Create a new support request"],"cor":[3],"exp":"Many Azure resource have quote limits. The purpose of the quota limits is to help you control your Azure costs. However, it is common to require an increase to the default quota.\n\nYou can request a quota limit increase by opening a support request. In the support request, select ‘Service and subscription limits (quotas)’ for the Issue type, select your subscription and the service you want to increase the quota for. For this question, you would select ‘SQL Database Managed Instance’ as the quote type.","ref":"https://docs.microsoft.com/en-us/azure/sql-database/sql-database-managed-instance-resource-limits#obtaining-a-larger-quota-for-sql-managed-instance","imgs":[],"eimgs":[],"t":"mc"},{"q":"For each of the following statements, select Yes if the statement is true. Otherwise, select No.\nNOTE: Each correct selection is worth one point. \nHot Area:","opts":[],"cor":[],"exp":"Box 1: No\nYou can assign service administrators and co-administrators in the Azure Portal but there can only be one account administrator.\n\nBox 2: No\nYou need an Azure Active Directory account to manage a subscription, not a Microsoft account.\nAn account is created in the Azure Active Directory when you create the subscription. Further accounts can be created in the Azure Active Directory to manage the subscription.\n\nBox 3: No\nResource groups are logical containers for Azure resources. However, resource groups do not contain subscriptions. Subscriptions contain resource groups.","ref":"https://docs.microsoft.com/en-us/office365/enterprise/subscriptions-licenses-accounts-and-tenants-for-microsoft-cloud-offerings","imgs":["https://free-braindumps.com/images/exam-prep/AZ-900/770fd913-2131-4359-90cd-c93f3c2b05b2.jpg"],"eimgs":["https://free-braindumps.com/images/exam-prep/AZ-900/492e7400-5393-4a1b-b6bd-c893d375586a.jpg"],"t":"img"},{"q":"For each of the following statements, select Yes if the statement is true. Otherwise, select No.\nNOTE: Each correct selection is worth one point.\nHot Area:","opts":[],"cor":[],"exp":"Box 1: No\nNot all Azure regions support availability zones.\n\nBox 2: No\nAvailability zones can be used with many Azure services, not just VMs.\n\nBox 3: No\nAvailability Zones are unique physical locations within a single Azure region.","ref":"https://docs.microsoft.com/en-us/azure/availability-zones/az-region#azure-regions-with-availability-zones","imgs":["https://free-braindumps.com/images/exam-prep/AZ-900/57eda687-ee99-42e6-a722-2ab0b5cf1bf7.jpg"],"eimgs":["https://free-braindumps.com/images/exam-prep/AZ-900/dd0218fd-def9-496c-97fb-7f0ddc05063c.jpg"],"t":"img"},{"q":"You plan to create an Azure virtual machine.\n\nYou need to identify which storage service must be used to store the unmanaged data disks of the virtual machine.\n\nWhat should you identify? To answer, select the appropriate service in the answer area.\nHot Area:","opts":[],"cor":[],"exp":"Azure containers are the backbone of the virtual disks platform for Azure IaaS. Both Azure OS and data disks are implemented as virtual disks where data is durably persisted in the Azure Storage platform and then delivered to the virtual machines for maximum performance. Azure Disks are persisted in Hyper-V VHD format and stored as a page blob in Azure Storage.","ref":"https://docs.microsoft.com/en-us/azure/storage/blobs/storage-blob-pageblob-overview","imgs":["https://free-braindumps.com/images/exam-prep/AZ-900/f43693b9-5cc8-41a2-b33e-4444cde1a99f.jpg"],"eimgs":["https://free-braindumps.com/images/exam-prep/AZ-900/4293c233-bb55-4fdb-821a-e93576fe0f5e.jpg"],"t":"img"},{"q":"Your company plans to move several servers to Azure.\nThe company’s compliance policy states that a server named FinServer must be on a separate network segment.\n\nYou are evaluating which Azure services can be used to meet the compliance policy requirements.\nWhich Azure solution should you recommend?","opts":["a resource group for FinServer and another resource group for all the other servers","a virtual network for FinServer and another virtual network for all the other servers","a VPN for FinServer and a virtual network gateway for each other server","one resource group for all the servers and a resource lock for FinServer"],"cor":[1],"exp":"Networks in Azure are known as virtual networks. A virtual network can have multiple IP address spaces and multiple subnets. Azure automatically routes traffic between different subnets within a virtual network.\n\nThe question states that FinServer must be on a separate network segment. The only way to separate FinServer from the other servers in networking terms is to place the server in a different virtual network to the other servers.","ref":"https://docs.microsoft.com/en-us/azure/virtual-network/virtual-network-vnet-plan-design-arm","imgs":[],"eimgs":[],"t":"mc"},{"q":"You plan to map a network drive from several computers that run Windows 10 to Azure Storage.\nYou need to create a storage solution in Azure for the planned mapped drive.\nWhat should you create?","opts":["an Azure SQL database","a virtual machine data disk","a Files service in a storage account","a Blobs service in a storage account"],"cor":[2],"exp":"Azure Files is Microsoft's easy-to-use cloud file system. Azure file shares can be seamlessly used in Windows and Windows Server.\n\nTo use an Azure file share with Windows, you must either mount it, which means assigning it a drive letter or mount point path, or access it via its UNC path.\n\nUnlike other SMB shares you may have interacted with, such as those hosted on a Windows Server, Linux Samba server, or NAS device, Azure file shares do not currently support Kerberos authentication with your Active Directory (AD) or Azure Active Directory (AAD) identity, although this is a feature we are working on.\n\nInstead, you must access your Azure file share with the storage account key for the storage account containing your Azure file share. A storage account key is an administrator key for a storage account, including administrator permissions to all files and folders within the file share you're accessing, and for all file shares and other storage resources (blobs, queues, tables, etc) contained within your storage account.","ref":"https://docs.microsoft.com/en-us/azure/storage/files/storage-how-to-use-files-windows","imgs":[],"eimgs":[],"t":"mc"},{"q":"You plan to implement an Azure database solution.\nYou need to implement a database solution that meets the following requirements:\n\n-Can add data concurrently from multiple regions\n-Can store JSON documents\n\nWhich database service should you deploy? To answer, select the appropriate service in the answer area. Hot Area:","opts":[],"cor":[],"exp":"Azure Cosmos DB is Microsoft's globally distributed, multi-model database service. With a click of a button, Cosmos DB enables you to elastically and independently scale throughput and storage across any number of Azure regions worldwide.\n\nAzure Cosmos DB is a great way to store unstructured and JSON data. Combined with Azure Functions, Cosmos DB makes storing data quick and easy with much less code than required for storing data in a relational database.","ref":"https://docs.microsoft.com/en-us/azure/cosmos-db/introduction\nhttps://docs.microsoft.com/en-us/azure/azure-functions/functions-integrate-store-unstructured-data-cosmosdb?tabs=csharp","imgs":["https://free-braindumps.com/images/exam-prep/AZ-900/49c64e49-065d-49f0-bfbf-b25a9f4cae0f.jpg"],"eimgs":["https://free-braindumps.com/images/exam-prep/AZ-900/e3c642d1-2d83-484d-a478-11416b873a91.jpg"],"t":"img"},{"q":"Your company plans to migrate all its network resources to Azure.\nYou need to start the planning process by exploring Azure.\nWhat should you create first?","opts":["a subscription","a resource group","a virtual network","a management group"],"cor":[0],"exp":"The first thing you create in Azure is a subscription. You can think of an Azure subscription as an ‘Azure account’. You get billed per subscription.\n\nA subscription is an agreement with Microsoft to use one or more Microsoft cloud platforms or services, for which charges accrue based on either a per-user license fee or on cloud-based resource consumption.\n\n-Microsoft's Software as a Service (SaaS)-based cloud offerings (Office 365, Intune/EMS, and Dynamics 365) charge per-user license fees.\n\n-Microsoft's Platform as a Service (PaaS) and Infrastructure as a Service (IaaS) cloud offerings (Azure) charge based on cloud resource consumption.\n\nYou can also use a trial subscription, but the subscription expires after a specific amount of time or consumption charges. You can convert a trial subscription to a paid subscription. Organizations can have multiple subscriptions for Microsoft's cloud offerings.","ref":"https://docs.microsoft.com/en-us/office365/enterprise/subscriptions-licenses-accounts-and-tenants-for-microsoft-cloud-offerings","imgs":[],"eimgs":[],"t":"mc"},{"q":"For each of the following statements, select Yes if the statement is true. Otherwise, select No.\nNOTE: Each correct selection is worth one point.\nHot Area:","opts":[],"cor":[],"exp":"Box 1: No\nAzure resources deployed to a single resource group can be located in different regions. The resource group only contains metadata about the resources it contains.\nWhen creating a resource group, you need to provide a location for that resource group. You may be wondering, \"Why does a resource group need a location? And, if the resources can have different locations than the resource group, why does the resource group location matter at all?\" The resource group stores metadata about the resources. When you specify a location for the resource group, you're specifying where that metadata is stored. For compliance reasons, you may need to ensure that your data is stored in a particular region.\n\nBox 2: No\nTags for Resources are not inherited by default from their Resource Group\n\nBox 3: Yes\nA resource group can be used to scope access control for administrative actions. By default, permissions set at the resource level are inherited by the resources in the resource group.","ref":"https://docs.microsoft.com/en-us/azure/azure-resource-manager/resource-group-overview","imgs":["https://free-braindumps.com/images/exam-prep/AZ-900/08b508b7-1465-48ea-baf7-31a0dec6fe8e.jpg"],"eimgs":["https://free-braindumps.com/images/exam-prep/AZ-900/27407e87-c50b-4bd5-936e-38be36d5dae8.jpg"],"t":"img"},{"q":"To complete the sentence, select the appropriate option in the answer area.\nHot Area:","opts":[],"cor":[],"exp":"Azure storage offers different access tiers: hot, cool and archive.\n\nThe archive access tier has the lowest storage cost. But it has higher data retrieval costs compared to the hot and cool tiers. Data in the archive tier can take several hours to retrieve.\n\nWhile a blob is in archive storage, the blob data is offline and can't be read, overwritten, or modified. To read or download a blob in archive, you must first rehydrate it to an online tier.\nExample usage scenarios for the archive access tier include: \n-Long-term backup, secondary backup, and archival datasets \n-Original (raw) data that must be preserved, even after it has been processed into final usable form. \n-Compliance and archival data that needs to be stored for a long time and is hardly ever accessed.","ref":"https://docs.microsoft.com/en-us/azure/storage/blobs/storage-blob-storage-tiers?tabs=azure-portal#archive-access-tier","imgs":["https://free-braindumps.com/images/exam-prep/AZ-900/cdd46ae4-80f4-4656-8e60-c32b0ff95e67.jpg"],"eimgs":["https://free-braindumps.com/images/exam-prep/AZ-900/90c2f616-3740-471a-b728-96c5c273261b.jpg"],"t":"img"},{"q":"You plan to deploy a critical line-of-business application to Azure.\nThe application will run on an Azure virtual machine.\n\nYou need to recommend a deployment solution for the application. The solution must provide a guaranteed availability of 99.99 percent.\n\nWhat is the minimum number of virtual machines and the minimum number of availability zones you should recommend for the deployment? To answer, select the appropriate options in the answer area.\n\nNOTE: Each correct selection is worth one point.\nHot Area:","opts":[],"cor":[],"exp":"You need a minimum of two virtual machines with each one located in a different availability zone.\n\nAvailability Zones is a high-availability offering that protects your applications and data from datacenter failures. Availability Zones are unique physical locations within an Azure region. Each zone is made up of one or more datacenters equipped with independent power, cooling, and networking. To ensure resiliency, there’s a minimum of three separate zones in all enabled regions. The physical separation of Availability Zones within a region protects applications and data from datacenter failures. Zone-redundant services replicate your applications and data across Availability Zones to protect from single-points-of-failure. With Availability Zones, Azure offers industry best 99.99% VM uptime SLA.","ref":"https://docs.microsoft.com/en-us/azure/availability-zones/az-overview","imgs":["https://free-braindumps.com/images/exam-prep/AZ-900/9e314129-286c-44f5-9a3e-c59f6b6f3b11.jpg"],"eimgs":["https://free-braindumps.com/images/exam-prep/AZ-900/7d493a7f-bfc2-4265-bd69-895fc8e51b6e.jpg"],"t":"img"},{"q":"Which Azure service should you use to collect events from multiple resources into a centralized repository?","opts":["Azure Event Hubs","Azure Analysis Services","Azure Monitor","Azure Stream Analytics"],"cor":[0],"exp":"Azure Event Hubs is a big data streaming platform and event ingestion service. It can receive and process millions of events per second. Data sent to an event hub can be transformed and stored by using any real-time analytics provider or batching/storage adapters.\n\nAzure Event Hubs can be used to ingest, buffer, store, and process your stream in real time to get actionable insights. Event Hubs uses a partitioned consumer model, enabling multiple applications to process the stream concurrently and letting you control the speed of processing.\n\nAzure Event Hubs can be used to capture your data in near-real time in an Azure Blob storage or Azure Data Lake Storage for long-term retention or micro-batch processing.","ref":"https://docs.microsoft.com/en-us/azure/event-hubs/event-hubs-about","imgs":[],"eimgs":[],"t":"mc"},{"q":"For each of the following statements, select Yes if the statement is true. Otherwise, select No. \n\nNOTE: Each correct selection is worth one point.","opts":[],"cor":[],"exp":"Box 1: Yes\nThere are different replication options available with a storage account. The ‘minimum’ replication option is Locally Redundant Storage (LRS). With LRS, data is replicated synchronously three times within the primary region.\n\nBox 2: No\nData is not backed up automatically to another Azure Data Center although it can be depending on the replication option configured for the account. Locally Redundant Storage (LRS) is the default which maintains three copies of the data in the data center.\nGeo-redundant storage (GRS) has cross-regional replication to protect against regional outages. Data is replicated synchronously three times in the primary region, then replicated asynchronously to the secondary region.\n\nBox 3: No\nThe limits are much higher than that. The current storage limit is 2 PB for US and Europe, and 500 TB for all other regions (including the UK) with no limit on the number of files.","ref":"https://docs.microsoft.com/en-us/azure/storage/common/storage-account-overview","imgs":["https://free-braindumps.com/images/exam-prep/AZ-900/70bfc13a-f525-4ed9-a244-ce0939a2c0f6.jpg"],"eimgs":["https://free-braindumps.com/images/exam-prep/AZ-900/cee71ff2-89dd-4398-bdd2-3b9af43f4056.jpg"],"t":"img"},{"q":"For each of the following statements, select Yes if the statement is true. Otherwise, select No. \n\nNOTE: Each correct selection is worth one point.","opts":[],"cor":[],"exp":"Box 1: No\nNot all Azure regions support availability zones.\n\nBox 2: No\nRegions that support availability zones support Linux virtual machines.\n\nBox 3: Yes\nAvailability Zones is a high-availability offering that protects your applications and data from datacenter failures. Availability Zones are unique physical locations within an Azure region. Each zone is made up of one or more datacenters equipped with independent power, cooling, and networking. To ensure resiliency, there’s a minimum of three separate zones in all enabled regions. The physical separation of Availability Zones within a region protects applications and data from datacenter failures. Zone-redundant services replicate your applications and data across Availability Zones to protect from single-points-of-failure. With Availability Zones, Azure offers industry best 99.99% VM uptime SLA.","ref":"https://docs.microsoft.com/en-gb/azure/availability-zones/az-overview","imgs":["https://free-braindumps.com/images/exam-prep/AZ-900/e5b3e8f6-aab4-4d03-90ec-a6b338d4f6dd.jpg"],"eimgs":["https://free-braindumps.com/images/exam-prep/AZ-900/3c7f5c3a-0f20-4f0c-b6aa-cd6a7cdb9246.jpg"],"t":"img"},{"q":"For each of the following statements, select Yes if the statement is true. Otherwise, select No. \n\nNOTE: Each correct selection is worth one point.","opts":[],"cor":[],"exp":"Box 1: No\nNorth America has several Azure regions, including West US, Central US, South Central US, East Us, and Canada East.\n\nBox 2: Yes\nA region is a set of datacenters deployed within a latency-defined perimeter and connected through a dedicated regional low-latency network.\n\nBox 3: No\nOutbound data transfer is charged at the normal rate and inbound data transfer is free.","ref":"https://azure.microsoft.com/en-us/global-infrastructure/regions/\n\nhttps://azure.microsoft.com/en-us/pricing/details/bandwidth/","imgs":["https://free-braindumps.com/images/exam-prep/AZ-900/4cc1fb71-c116-4e0f-8bd1-c9ce08be9486.jpg"],"eimgs":["https://free-braindumps.com/images/exam-prep/AZ-900/ba96c1ac-bc30-4480-918f-e60770c07828.jpg"],"t":"img"},{"q":"You need to be notified when Microsoft plans to perform maintenance that can affect the resources deployed to an Azure subscription. What should you use?","opts":["Azure Monitor","Azure Service Health","Azure Advisor","Microsoft Trust Center"],"cor":[1],"exp":"Azure Service Health provides a personalized view of the health of the Azure services and regions you're using. This is the best place to look for service impacting communications about outages, planned maintenance activities, and other health advisories because the authenticated Service Health experience knows which services and resources you currently use.","ref":"https://docs.microsoft.com/en-us/azure/service-health/overview","imgs":[],"eimgs":[],"t":"mc"},{"q":"Match the Azure Services service to the correct description.\n\nInstructions: To answer, drag the appropriate service from the column on the left to its description on the right. Each service may be used once, more than once, or not at all.\nNOTE: Each correct selection is worth one point.\nSelect and Place:","opts":[],"cor":[],"exp":"","ref":"https://docs.microsoft.com/en-us/azure-sphere/product-overview/what-is-azure-sphere https://docs.microsoft.com/en-us/azure/iot-central/core/overview-iot-central https://docs.microsoft.com/en-us/azure/iot-hub/about-iot-hub","imgs":["https://free-braindumps.com/images/exam-prep/AZ-900/17544dc0-68c8-498f-aea3-a450dabb1d9a.jpg"],"eimgs":["https://free-braindumps.com/images/exam-prep/AZ-900/8b7fa4de-ecac-4030-bd35-3dcc3f33423c.jpg"],"t":"img"},{"q":"For each of the following statements, select Yes if the statement is true. Otherwise, select No. \nNOTE: Each correct selection is worth one point.\nHot Area:","opts":[],"cor":[],"exp":"","ref":"https://docs.microsoft.com/en-us/azure/virtual-desktop/overview","imgs":["https://free-braindumps.com/images/exam-prep/AZ-900/cbfcf141-6c28-4046-a093-1c2fa2d50413.jpg"],"eimgs":["https://free-braindumps.com/images/exam-prep/AZ-900/09204e3e-4156-4023-87cd-a03078aaa0ac.jpg"],"t":"img"},{"q":"To complete the sentence, select the appropriate option in the answer area.\nHot Area:","opts":[],"cor":[],"exp":"","ref":"https://blog.abouttmc.com/azure-cloud-total-cost-of-ownership","imgs":["https://free-braindumps.com/images/exam-prep/AZ-900/49ccc08d-faba-42ee-8c17-85f40e6aec13.jpg"],"eimgs":["https://free-braindumps.com/images/exam-prep/AZ-900/f647e56a-a91b-4dfe-abeb-22512cfd4e4c.jpg"],"t":"img"},{"q":"For each of the following statements, select Yes if the statement is true. Otherwise, select No.\nNOTE: Each correct selection is worth one point.\nHot Area:","opts":[],"cor":[],"exp":"Availability zones expand the level of control you have to maintain the availability of the applications and data on your VMs. Availability Zones are unique physical locations within an Azure region. Each zone is made up of one or more datacenters equipped with independent power, cooling, and networking. To ensure resiliency, there are a minimum of three separate zones in all enabled regions. The physical separation of Availability Zones within a region protects applications and data from datacenter failures.\nWith Availability Zones, Azure offers industry best 99.99% VM uptime SLA. By architecting your solutions to use replicated VMs in zones, you can protect your applications and data from the loss of a datacenter. If one zone is compromised, then replicated apps and data are instantly available in another zone.","ref":"https://docs.microsoft.com/en-us/azure/virtual-machines/windows/manage-availability","imgs":["https://free-braindumps.com/images/exam-prep/AZ-900/e43ccf18-bfc8-4be4-842b-ae49652db681.jpg"],"eimgs":["https://free-braindumps.com/images/exam-prep/AZ-900/129bd78e-2500-493d-99f2-3e031a88f3e2.jpg"],"t":"img"},{"q":"For each of the following statements, select Yes if the statement is true. Otherwise, select No.\n\nNOTE: Each correct selection is worth one point.","opts":[],"cor":[],"exp":"","ref":"https://docs.microsoft.com/en-us/azure/active-directory/enterprise-users/groups-dynamic-membership\nhttps://petri.com/understanding-hybrid-azure-active-directory-join","imgs":["https://free-braindumps.com/images/exam-prep/AZ-900/7cec3e94-a030-4097-b565-2951677a8137.jpg"],"eimgs":["https://free-braindumps.com/images/exam-prep/AZ-900/1e5d15ab-210e-4719-ba1d-f55c70e0491b.jpg"],"t":"img"},{"q":"You plan to deploy several Azure virtual machines.\nYou need to ensure that the services running on the virtual machines remain available if a single data center fails.\n\nWhat are two possible solutions? Each correct answer presents a complete solution.","opts":["Deploy the virtual machines to two or more availability zones.","Deploy the virtual machines to two or more resource groups.","Deploy the virtual machines to a scale set.","Deploy the virtual machines to two or more regions."],"cor":[0,3],"exp":"","ref":"https://docs.microsoft.com/en-us/azure/virtual-machine-scale-sets/availability https://docs.microsoft.com/en-us/azure/virtual-machines/windows/regions","imgs":[],"eimgs":[],"t":"mc"},{"q":"To complete the sentence, select the appropriate option in the answer area.\nHot Area:","opts":[],"cor":[],"exp":"Azure automatically routes traffic between subnets in a virtual network. Therefore, all virtual machines in a virtual network can connect to the other virtual machines in the same virtual network. Even if the virtual machines are on separate subnets within the virtual network, they can still communicate with each other.\n\nTo ensure that a virtual machine cannot connect to the other virtual machines, the virtual machine must be deployed to a separate virtual network.","ref":"https://docs.microsoft.com/en-us/azure/virtual-network/virtual-networks-udr-overview","imgs":["https://free-braindumps.com/images/exam-prep/AZ-900/53640397-4118-44ab-b472-929061f5b193.jpg"],"eimgs":["https://free-braindumps.com/images/exam-prep/AZ-900/0f93a216-a06c-4a91-8842-dc45dc74ee83.jpg"],"t":"img"},{"q":"Match the Azure service to the appropriate description. \n\nTo answer, drag the appropriate service from the column on the left to its description on the right. Each service may be used once, more than once, or not at all. \n\nNOTE: Each correct match is worth one point.","opts":[],"cor":[],"exp":"","ref":"","imgs":["https://free-braindumps.com/images/exam-prep/AZ-900/3e8474d6-3f88-47b8-8a71-572a2d4c1492.jpg"],"eimgs":["https://free-braindumps.com/images/exam-prep/AZ-900/14e0defc-cd7a-4078-b3bd-4ad8979a15b4.jpg"],"t":"img"},{"q":"For each of the following statements, select Yes if the statement is true. Otherwise, select No.\nNOTE: Each correct selection is worth one point.","opts":[],"cor":[],"exp":"Box 2: Yes\nUsage scenarios for the hot access tier include:\n-Data that is in active use or is expected to be read from and written to frequently\n-Data that is staged for processing and eventual migration to the cool access tier\n\nBox 3: No\nUsage scenarios for the cool access tier include:\n-Short-term backup and disaster recovery\n-Older data not used frequently but expected to be available immediately when accessed\n-Large data sets that need to be stored cost effectively, while more data is being gathered for future processing","ref":"https://docs.microsoft.com/en-us/azure/storage/blobs/storage-blob-storage-tiers","imgs":["https://free-braindumps.com/images/exam-prep/AZ-900/a7d1b07e-ccd3-4e23-953b-85c8d400b6d2.jpg"],"eimgs":["https://free-braindumps.com/images/exam-prep/AZ-900/3834ff5d-4c35-436f-afab-a07bd339e9c9.jpg"],"t":"img"},{"q":"What is the most severe failure from which an Azure Availability Zone can be used to protect access to Azure service?","opts":["a physical server failure","an Azure region failure","a storage failure","an Azure data center failure"],"cor":[3],"exp":"Availability zones expand the level of control you have to maintain the availability of the applications and data on your VMs. An Availability Zone is a physically separate zone, within an Azure region. There are three Availability Zones per supported Azure region.\n\nEach Availability Zone has a distinct power source, network, and cooling. By architecting your solutions to use replicated VMs in zones, you can protect your apps and data from the loss of a datacenter. If one zone is compromised, then replicated apps and data are instantly available in another zone.","ref":"https://docs.microsoft.com/en-us/azure/virtual-machines/availability","imgs":[],"eimgs":[],"t":"mc"},{"q":"You need to purchase a third-party virtual security appliance that you will deploy to an Azure subscription. What should you use?","opts":["Azure subscriptions","Azure Security Center","Azure Marketplace","Microsoft Store"],"cor":[2],"exp":"","ref":"https://docs.microsoft.com/en-us/azure/cost-management-billing/manage/ea-azure-marketplace","imgs":[],"eimgs":[],"t":"mc"},{"q":"Match the serverless solution to the correct characteristic.\n\nTo answer, drag the appropriate serverless solution from the column on the left to its characteristic on the right. Each serverless solution may be used once, more than once, or not at all.\n\nNOTE: Each correct match is worth one point.","opts":[],"cor":[],"exp":"Box 1: Azure Functions\nAzure Functions allows you to implement your system's logic into readily available blocks of code called \"functions\". Different functions can run anytime you need to respond to critical events.\n\nBox 2: Azure Functions\nAzure Logic Apps can have multiple stateful and stateless workflows.\n\nBox 3: Azure Logic Apps\nAzure Logic Apps is a cloud-based platform for creating and running automated workflows that integrate your apps, data, services, and systems.","ref":"https://docs.microsoft.com/en-us/azure/logic-apps/logic-apps-overview\nhttps://docs.microsoft.com/en-us/azure/azure-functions/functions-overview","imgs":["https://free-braindumps.com/images/exam-prep/AZ-900/c171e277-9122-4369-bc66-86140d5e1da5.jpg"],"eimgs":["https://free-braindumps.com/images/exam-prep/AZ-900/cbf78c7f-9d3c-440b-8aad-a492c5403893.jpg"],"t":"img"},{"q":"Match the Azure governance feature to the correct description.\n\nInstructions: To answer, drag the appropriate feature from the column on the left to its description on the right. Each feature may be used once, more than once, or not at all.\n\nNOTE: Each correct match is worth one point.","opts":[],"cor":[],"exp":"",

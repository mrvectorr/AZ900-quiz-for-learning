"ref":"https://docs.microsoft.com/en-us/azure/governance/blueprints/overview\nhttps://docs.microsoft.com/en-us/azure/governance/policy/overview\nhttps://docs.microsoft.com/en-us/azure/azure-resource-manager/management/tag-resources?tabs=json\nhttps://docs.microsoft.com/en-us/azure/azure-resource-manager/management/lock-resources?tabs=json","imgs":["https://free-braindumps.com/images/exam-prep/AZ-900/4070e957-9452-4935-8e18-dbc53661f979.jpg"],"eimgs":["https://free-braindumps.com/images/exam-prep/AZ-900/9a8a6227-56d4-43c0-8194-76b54129b6c6.jpg"],"t":"img"},{"q":"Select the answer that correctly completes the sentence.","opts":[],"cor":[],"exp":"Box: within a single Azure region\nAzure availability zones are physically separate locations within each Azure region that are tolerant to local failures.","ref":"https://docs.microsoft.com/en-us/azure/availability-zones/az-overview","imgs":["https://free-braindumps.com/images/exam-prep/AZ-900/38112179-91b7-4618-adb0-08465e880516.jpg"],"eimgs":["https://free-braindumps.com/images/exam-prep/AZ-900/d076e38a-87d2-461d-8995-947d34948d7a.jpg","https://free-braindumps.com/images/exam-prep/AZ-900/442aca97-2874-4561-ae7b-edc5797dccbf.jpg"],"t":"img"},{"q":"Match the Azure services to the correct descriptions.\n\nInstructions: To answer, drag the appropriate Azure service from the column on the left to its description on the right. Each service may be used once, more than once, or not at all.\n\nNOTE: Each correct match is worth one point.","opts":[],"cor":[],"exp":"Box 1: Azure virtual machines\n\nBox 2: Azure Container instances\nAzure Container Instances (ACI) is a managed service that allows you to run containers directly on the Microsoft Azure public cloud, without requiring the use of virtual machines (VMs).\nDevelop apps fast without managing virtual machines or having to learn new tools—it's just your application, in a container, running in the cloud.\n\nBox 3: Azure App Service\nAzure App Service is a fully managed platform for building web applications.\nApplications run and scale with ease on both Windows and Linux-based environments.\n\nBox 4: Azure Functions\nAzure Functions (from Microsoft Azure) is a cloud-based serverless service that allows running event-triggered code in a scalable way without providing or managing infrastructure.","ref":"https://docs.microsoft.com/en-us/azure/container-instances\nhttps://azure.microsoft.com/en-us/services/app-service/\nhttps://revdebug.com/blog/what-are-azure-functions","imgs":["https://free-braindumps.com/images/exam-prep/AZ-900/a6239b80-829c-42b4-b284-243283165cbb.jpg"],"eimgs":["https://free-braindumps.com/images/exam-prep/AZ-900/eb7356ed-4acf-4797-aaa6-2eca781e3681.jpg"],"t":"img"},{"q":"To answer, select the appropriate option in the answer area.","opts":[],"cor":[],"exp":"Box: The virtual machines can be moved to the new subscription.\nYou can move a VM and its associated resources to a different subscription by using the Azure portal.\n\nNote: Repeat the process below for each Resource Group containing the VMs.\n1. Go to the Azure portal to manage the resource group containing the VM to move. Search for and select Resource groups.\n2. Choose the resource group containing the VM that you would like to move.\n3. At the top of the page for the resource group, select Move and then select Move to another subscription. The Move resources page opens.\n4. Select each of the resources to move. In most cases, you should move all of the related resources that are listed.\n5. Select the Subscription where you want the VM to be moved.\n6. Select an existing Resource group, or enter a name to have a new resource group created.\n7. When you are done, select that you understand that new resource IDs will be created and that the new IDs will need to be used with the VM after it is moved, and then select OK.","ref":"https://docs.microsoft.com/en-us/azure/virtual-machines/windows/move-vm","imgs":["https://free-braindumps.com/images/exam-prep/AZ-900/f448678f-acc8-4be7-b901-7999c885fa36.jpg"],"eimgs":["https://free-braindumps.com/images/exam-prep/AZ-900/85793a02-9dc5-45e4-8609-45d13736ed34.jpg"],"t":"img"},{"q":"Select the answer that correctly completes the sentence.","opts":[],"cor":[],"exp":"Microsoft's Azure Sphere hardware and service designed to better secure Internet of Things (IoT) devices.\nAzure Sphere consists of Microsoft-certified microcontrollers – single-chip computers with processors, storage, memory and IoT capabilities – plus the Azure Sphere Linux-based OS and the Azure Sphere cloud security service.","ref":"https://www.zdnet.com/article/microsofts-azure-sphere-its-linux-based-microcontroller-plus-cloud-service-hits-general-availability/","imgs":["https://free-braindumps.com/images/exam-prep/AZ-900/93a15866-0dd1-4af0-948e-c9026ededf21.jpg"],"eimgs":["https://free-braindumps.com/images/exam-prep/AZ-900/15746e44-b011-4b19-8d00-79982a10fda2.jpg"],"t":"img"},{"q":"You plan to deploy a service to Azure virtual machines.\nYou need to ensure that the service will be available if a datacenter fails.\nWhat should you use as part of the virtual machine deployment?","opts":["availability sets","proximity placement groups","host groups","availability zones"],"cor":[3],"exp":"Azure availability zones are physically separate locations within each Azure region that are tolerant to local failures. Failures can range from software and hardware failures to events such as earthquakes, floods, and fires. Tolerance to failures is achieved because of redundancy and logical isolation of Azure services. To ensure resiliency, a minimum of three separate availability zones are present in all availability zone-enabled regions.","ref":"https://docs.microsoft.com/en-us/azure/availability-zones/az-overview","imgs":[],"eimgs":[],"t":"mc"},{"q":"Your company has an Azure subscription that contains resources in several regions. You need to ensure that administrators can only create resources in those regions. What should you use?","opts":["a read-only lock","an Azure policy","a management group","a reservation"],"cor":[1],"exp":"","ref":"https://docs.microsoft.com/en-us/azure/governance/policy/overview","imgs":[],"eimgs":[],"t":"mc"},{"q":"Select the answer that correctly completes the sentence.","opts":[],"cor":[],"exp":"Box: contains one or more data centers that are connected by using a low-latency network.\nEach Azure region features datacenters deployed within a latency-defined perimeter. They're connected through a dedicated regional low-latency network. This design ensures that Azure services within any region offer the best possible performance and security.","ref":"https://docs.microsoft.com/en-us/azure/availability-zones/az-overview","imgs":["https://free-braindumps.com/images/exam-prep/AZ-900/daf230bf-b456-4e73-b7a2-3c48f171ddc6.jpg"],"eimgs":["https://free-braindumps.com/images/exam-prep/AZ-900/e69d1e9c-d749-404a-b5a8-058b04db014c.jpg"],"t":"img"},{"q":"Select the answer that correctly completes the sentence.","opts":[],"cor":[],"exp":"The Azure File Sync agent enables data on a Windows Server to be synchronized with an Azure File share.","ref":"https://www.microsoft.com/en-us/download/details.aspx?id=57159","imgs":["https://free-braindumps.com/images/exam-prep/AZ-900/ee99b7ea-d8ad-49b5-9103-f2a3bcf1f687.jpg"],"eimgs":["https://free-braindumps.com/images/exam-prep/AZ-900/a143f0a6-84c0-4775-82d6-e4c99259c0f9.jpg"],"t":"img"},{"q":"What is the function of a Site-to-Site VPN?","opts":["provides a secure connection between a computer on a public network and the corporate network","provides a dedicated private connection to Azure that does NOT travel over the internet","provides a connection from an on-premises VPN device to an Azure VPN gateway"],"cor":[2],"exp":"A Site-to-Site VPN gateway connection is used to connect your on-premises network to an Azure virtual network over an IPsec/IKE (IKEv1 or IKEv2) VPN tunnel. This type of connection requires a VPN device located on-premises that has an externally facing public IP address assigned to it.\n\nExample:","ref":"https://docs.microsoft.com/en-us/azure/vpn-gateway/vpn-gateway-howto-site-to-site-classic-portal","imgs":[],"eimgs":["https://free-braindumps.com/images/exam-prep/AZ-900/afaa9a08-8240-48c2-bc2a-1185b433e4df.jpg"],"t":"mc"},{"q":"Match the cloud service models to the appropriate offerings.\n\nTo answer, drag the appropriate model from the column on the left to its offering on the right. Each model may be used once, more than once, or not at all.\n\nNOTE: Each correct match is worth one point.","opts":[],"cor":[],"exp":"Box 1: Platform as a service (PaaS)\nAzure App Service is a fully managed platform for building web applications.\nPlatform as a service (PaaS) is a complete development and deployment environment in the cloud, with resources that enable you to deliver everything from simple cloud-based apps to sophisticated, cloud-enabled enterprise applications.\n\nBox 2: Infrastructure as a service (IaaS)\nWindows Azure Virtual Machines, an Infrastructure-as-a-Service (IaaS) offering in Windows Azure, was released back in 2012.\n\nBox 3: Software as a service (SaaS)\nDynamics 365 is a set of interconnected, modular Software-as-a-Service (SaaS) applications and services designed to both transform and enable your core customers, employees, and business activities.","ref":"https://azure.microsoft.com/en-us/overview/what-is-paas/\nhttps://azure.microsoft.com/en-us/blog/infrastructure-as-a-service-series-virtual-machines-and-windows/\nhttps://pipol.com/what-is-microsoft-dynamics-365","imgs":["https://free-braindumps.com/images/exam-prep/AZ-900/3b87286d-5988-4a6a-8bcb-e6fd91afa59d.jpg"],"eimgs":["https://free-braindumps.com/images/exam-prep/AZ-900/99ea926b-0eb9-494b-a392-611df017f6ce.jpg"],"t":"img"},{"q":"Match the cloud service models to the appropriate solutions.\n\nTo answer, drag the appropriate cloud service model from the column on the left to its solution on the right Each cloud service model may be used once, more than once, or not at all.\n\nNOTE: Each correct match is worth one point.","opts":[],"cor":[],"exp":"Box 1: Infrastructure as a service (IaaS)\nAzure Files is a simple, secure, and serverless enterprise-grade cloud file shares.\n\nInfrastructure as a service (IaaS) is a type of cloud computing service that offers essential compute, storage, and networking resources on demand, on a pay-as-you-go basis.\n\nBox 2: Software as a service (SaaS)\nDynamics 365 is a set of interconnected, modular Software-as-a-Service (SaaS) applications and services designed to both transform and enable your core customers, employees, and business activities. It includes Dynamics 365 Finance: use the guided, rules-based chart of accounts and no-code configuration service to simplify regulatory reporting, electronic invoicing, and global payments.\n\nBox 3: Platform as a service (PaaS)\nPlatform as a service (PaaS) is a complete development and deployment environment in the cloud, with resources that enable you to deliver everything from simple cloud-based apps to sophisticated, cloud-enabled enterprise applications.","ref":"https://azure.microsoft.com/en-us/overview/what-is-iaas\nhttps://azure.microsoft.com/en-us/overview/what-is-paas/","imgs":["https://free-braindumps.com/images/exam-prep/AZ-900/ebb1dba8-6066-437c-91a2-be6449b0cb80.jpg"],"eimgs":["https://free-braindumps.com/images/exam-prep/AZ-900/c0d881f1-24a6-4317-a80c-66f5632efdce.jpg"],"t":"img"},{"q":"You need to manage containers.\nWhich two services can you use? Each correct answer presents a complete solution.\nNOTE: Each correct selection is worth one point.","opts":["Azure Virtual Desktop","Azure virtual machines","Azure Functions","Azure Container Instances","Azure Kubernetes Service (AKS)"],"cor":[3,4],"exp":"Run Docker containers on-demand in a managed, serverless Azure environment. Azure Container Instances is a solution for any scenario that can operate in isolated containers, without orchestration. Run event-driven applications, quickly deploy from your container development pipelines, and run data processing and build jobs.\n\nYou can manage containers at scale with a fully managed Kubernetes container management and orchestration service that integrates with Azure Active Directory.\nAzure Kubernetes Service is a robust and cost-effective container orchestration service that helps you to deploy and manage containerized applications in seconds where additional resources are assigned automatically without the headache of managing additional servers.","ref":"https://docs.microsoft.com/en-us/azure/container-instances/\nhttps://cloudacademy.com/blog/azure-kubernetes-service-aks-what-is-it-and-why-do-we-use-it","imgs":[],"eimgs":[],"t":"mc"},{"q":"To complete the sentence, select the appropriate option in the answer area.\nHot Area:","opts":[],"cor":[],"exp":"A resource group is a logical container for Azure resources. Resource groups make the management of Azure resources easier.\n\nWith a resource group, you can allow a user to manage all resources in the resource group, such as virtual machines, websites, and subnets. The permissions you apply to the resource group apply to all resources contained in the resource group.","ref":"https://docs.microsoft.com/en-us/azure/azure-resource-manager/management/overview#resource-groups https://docs.microsoft.com/en-us/azure/role-based-access-control/overview","imgs":["https://free-braindumps.com/images/exam-prep/AZ-900/dfaf7cb1-5fa8-4933-8931-59512de8f87c.jpg"],"eimgs":["https://free-braindumps.com/images/exam-prep/AZ-900/c70a7130-64b4-45e8-83a2-f0fee4a3a3c9.jpg"],"t":"img"},{"q":"This question requires that you evaluate the underlined text to determine if it is correct.\nOne of the benefits of Azure SQL Data Warehouse is that high availability is built into the platform.\n\nInstructions: Review the underlined text. If it makes the statement correct, select “No change is needed”. If the statement is incorrect, select the answer choice that makes the statement correct.","opts":["No change is needed","automatic scaling","data compression","versioning"],"cor":[0],"exp":"Azure Data Warehouse (now known as Azure Synapse Analytics) is a PaaS offering from Microsoft. As with all PaaS services from Microsoft, SQL Data Warehouse offers an availability SLA of 99.9%. Microsoft can offer 99.9% availability because it has high availability features built into the platform.","ref":"https://docs.microsoft.com/en-us/azure/sql-data-warehouse/sql-data-warehouse-overview-faq","imgs":[],"eimgs":[],"t":"mc"},{"q":"Select the answer that correctly completes the sentence.","opts":[],"cor":[],"exp":"The term compute refers to the hosting model for the computing resources that your application runs on. For Azure this include:\nAzure Container Instances. The fastest and simplest way to run a container in Azure, without having to provision any virtual machines and without having to adopt a higher-level service.\n\nNote, and also the following:\nAzure App Service. A managed service for hosting web apps, mobile app back ends, RESTful APIs, or automated business processes.\nAzure Spring Cloud. A managed service designed and optimized for hosting Spring Boot apps.\nAzure Kubernetes Service (AKS). A managed Kubernetes service for running containerized applications.\nAzure Batch. A managed service for running large-scale parallel and high-performance computing (HPC) applications\nAzure Functions. A managed FaaS service.\nAzure Service Fabric. A distributed systems platform that can run in many environments, including Azure or on premises.\nAzure Virtual machines. Deploy and manage VMs inside an Azure virtual network.\nAzure Container Apps. Deploy and manage VMs inside an Azure virtual network.","ref":"https://docs.microsoft.com/en-us/azure/architecture/guide/technology-choices/compute-decision-tree","imgs":["https://free-braindumps.com/images/exam-prep/AZ-900/fb2c981d-39a9-460f-a333-7d70ab31cf2f.jpg"],"eimgs":["https://free-braindumps.com/images/exam-prep/AZ-900/7941d9dd-c13b-4320-9daf-3ed620bdec4f.jpg"],"t":"img"},{"q":"At which OSI layer does ExpressRoute operate?","opts":["Layer 2","Layer 3","Layer 5","Layer 7"],"cor":[1],"exp":"","ref":"","imgs":[],"eimgs":[],"t":"mc"},{"q":"Select the answer that correctly completes the sentence.","opts":[],"cor":[],"exp":"Application Insights is a feature of Azure Monitor that provides extensible application performance management (APM) and monitoring for live web apps.","ref":"https://docs.microsoft.com/en-us/azure/azure-monitor/app/app-insights-overview","imgs":["https://free-braindumps.com/images/exam-prep/AZ-900/379158f2-eaa1-4f81-a5de-1843dabadad6.jpg"],"eimgs":["https://free-braindumps.com/images/exam-prep/AZ-900/898a992f-9cde-416a-9684-dab65c8874fd.jpg"],"t":"img"},{"q":"For each of the following statements, select Yes if the statement is true. Otherwise, select No.\nNOTE: Each correct selection is worth one point.\nHot Area:","opts":[],"cor":[],"exp":"Box 1: No\nA resource can interact with resources in other resource groups.\n\nBox 2: Yes\nDeleting the resource group will remove the resource group as well as all the resources in that resource group. This can be useful for the management of resources. For example, a virtual machine has several components (the VM itself, virtual disks, network adapter etc.). By placing the VM in its own resource group, you can delete the VM along with all its associated components by deleting the resource group. \nAnother example is when creating a test environment. You could place the entire test environment (Network components, virtual machines etc.) in one resource group. You can then delete the entire test environment by deleting the resource group.\n\nBox 3: Yes\nResources from multiple different regions can be placed in a resource group. The resource group only contains metadata about the resources it contains.","ref":"https://docs.microsoft.com/en-us/azure/azure-resource-manager/resource-group-overview\nhttps://www.codeisahighway.com/effective-ways-to-delete-resources-in-a-resource-group-on-azure/","imgs":["https://free-braindumps.com/images/exam-prep/AZ-900/b0abe4d1-8522-48ed-b8cb-d289056fcbd9.jpg"],"eimgs":["https://free-braindumps.com/images/exam-prep/AZ-900/2de85c2c-445a-4922-affe-2a688591e44e.jpg"],"t":"img"},{"q":"You plan to store 20 TB of data in Azure. The data will be accessed infrequently and visualized by using Microsoft Power BI.\n\nYou need to recommend a storage solution for the data. \nWhich two solutions should you recommend? Each correct answer presents a complete solution.\nNOTE: Each correct selection is worth one point.","opts":["Azure Data Lake","Azure Cosmos DB","Azure SQL Data Warehouse","Azure SQL Database","Azure Database for PostgreSQL"],"cor":[0,2],"exp":"You can use Power BI to analyze and visualize data stored in Azure Data Lake and Azure SQL Data Warehouse.\n\nAzure Data Lake includes all of the capabilities required to make it easy for developers, data scientists and analysts to store data of any size and shape and at any speed, and do all types of processing and analytics across platforms and languages. It removes the complexities of ingesting and storing all your data while making it faster to get up and running with batch, streaming and interactive analytics. It also integrates seamlessly with operational stores and data warehouses so that you can extend current data applications.","ref":"https://docs.microsoft.com/en-us/azure/data-lake-store/data-lake-store-power-bi\nhttps://azure.microsoft.com/en-gb/solutions/data-lake/\nhttps://docs.microsoft.com/en-us/azure/data-lake-store/data-lake-store-power-bi","imgs":[],"eimgs":[],"t":"mc"},{"q":"You have an Azure environment that contains 10 web apps. To which URL should you connect to manage all the Azure resources? To answer, select the appropriate options in the answer area.\nNOTE: Each correct selection is worth one point.\nHot Area:","opts":[],"cor":[],"exp":"The Azure portal is a web-based management interface where you can view and manage all your Azure resources in one unified hub, including web apps, databases, virtual machines, virtual networks, storage and Visual Studio team projects.\nThe URL of the Azure portal is https://portal.azure.com.","ref":"https://azure.microsoft.com/en-gb/features/azure-portal/","imgs":["https://free-braindumps.com/images/exam-prep/AZ-900/73fb3ea7-ca9d-47ca-9bee-3f4b069054ed.jpg"],"eimgs":["https://free-braindumps.com/images/exam-prep/AZ-900/1fc48d3b-a8e7-479d-a61e-d068367fe029.jpg"],"t":"img"},{"q":"Arrange the storage account redundancy options from the least redundant to the most redundant. To answer, move all options from the list of options to the answer area and arrange them in the correct order.","opts":[],"cor":[],"exp":"","ref":"","imgs":["https://free-braindumps.com/images/exam-prep/AZ-900/595042bc-a299-4354-bd69-b476c94fb880.jpg"],"eimgs":["https://free-braindumps.com/images/exam-prep/AZ-900/f9cb0c62-48eb-4869-a269-effa33e91083.jpg"],"t":"img"},{"q":"Select the answer that correctly completes the sentence.","opts":[],"cor":[],"exp":"","ref":"","imgs":["https://free-braindumps.com/images/exam-prep/AZ-900/b2877ff8-8090-4972-8240-d8ed04890d1f.jpg"],"eimgs":["https://free-braindumps.com/images/exam-prep/AZ-900/6b5b7377-0dd1-40ca-806e-eedeaf81800d.jpg"],"t":"img"},{"q":"You need to identify the type of failure for which an Azure Availability Zone can be used to protect access to Azure services. What should you identify?","opts":["a physical server failure","an Azure region failure","a storage failure","an Azure data center failure"],"cor":[3],"exp":"Availability zones expand the level of control you have to maintain the availability of the applications and data on your VMs. An Availability Zone is a physically separate zone, within an Azure region. There are three Availability Zones per supported Azure region.\n\nEach Availability Zone has a distinct power source, network, and cooling. By architecting your solutions to use replicated VMs in zones, you can protect your apps and data from the loss of a datacenter. If one zone is compromised, then replicated apps and data are instantly available in another zone.","ref":"https://docs.microsoft.com/en-us/azure/virtual-machines/availability","imgs":[],"eimgs":[],"t":"mc"},{"q":"You plan to extend your company’s network to Azure. \nThe network contains a VPN appliance that uses an IP address of 131.107.200.1.\n\nYou need to create an Azure resource that defines the VPN appliance in Azure.\nWhich Azure resource should you create? To answer, select the appropriate resource in the answer area. Hot Area:","opts":[],"cor":[],"exp":"A Local Network Gateway is an object in Azure that represents your on-premise VPN device. A Virtual Network Gateway is the VPN object at the Azure end of the VPN. A ‘connection’ is what connects the Local Network Gateway an the Virtual Network Gateway to bring up the VPN.\n\nThe local network gateway typically refers to your on-premises location. You give the site a name by which Azure can refer to it, then specify the IP address of the on-premises VPN device to which you will create a connection. You also specify the IP address prefixes that will be routed through the VPN gateway to the VPN device. The address prefixes you specify are the prefixes located on your on-premises network. If your on-premises network changes or you need to change the public IP address for the VPN device, you can easily update the values later.","ref":"https://docs.microsoft.com/en-us/azure/vpn-gateway/vpn-gateway-howto-site-to-site-resource-manager-portal","imgs":["https://free-braindumps.com/images/exam-prep/AZ-900/b8c0eb83-0091-48bc-a17d-bcfb9d980c96.jpg"],"eimgs":["https://free-braindumps.com/images/exam-prep/AZ-900/39df0d87-98e2-4aa0-95cd-215e82dc2e37.jpg"],"t":"img"},{"q":"For each of the following statements, select Yes if the statement is true. Otherwise, select No.\nNOTE: Each correct selection is worth one point.\nHot Area:","opts":[],"cor":[],"exp":"Box 1: No\nAn Azure AD tenant can have multiple subscriptions but an Azure subscription can only be associated with one Azure AD tenant.\nBox 2: Yes\nBox 3: No\n\nIf your subscription expires, you lose access to all the other resources associated with the subscription. However, the Azure AD directory remains in Azure. You can associate and manage the directory using a different Azure subscription.","ref":"https://docs.microsoft.com/en-us/azure/active-directory/fundamentals/active-directory-how-subscriptions-associated-directory","imgs":["https://free-braindumps.com/images/exam-prep/AZ-900/abcaf659-ba91-41e8-a41d-a0b4bd93e64a.jpg"],"eimgs":["https://free-braindumps.com/images/exam-prep/AZ-900/7ab2820f-c562-4ae2-9a1f-4af0d9c62a0e.jpg"],"t":"img"},{"q":"This question requires that you evaluate the underlined text to determine if it is correct.\nResource groups provide organizations with the ability to manage the compliance of Azure resources across multiple subscriptions.\n\nInstructions: Review the underlined text. If it makes the statement correct, select “No change is needed”. If the statement is incorrect, select the answer choice that makes the statement correct.","opts":["No change is needed","Management groups","Azure policies","Azure App Service plans"],"cor":[1],"exp":"","ref":"","imgs":[],"eimgs":[],"t":"mc"},{"q":"Your company plans to migrate to Azure. The company has several departments. All the Azure resources used by each department will be managed by a department administrator.\n\nWhat are two possible techniques to segment Azure for the departments? Each correct answer presents a complete solution.\n\nNOTE: Each correct selection is worth one point.","opts":["multiple subscriptions","multiple Azure Active Directory (Azure AD) directories","multiple regions","multiple resource groups"],"cor":[0,3],"exp":"An Azure subscription is a container for Azure resources. It is also a boundary for permissions to resources and for billing. You are charged monthly for all resources in a subscription. A single Azure tenant (Azure Active Directory) can contain multiple Azure subscriptions.\n\nA resource group is a container that holds related resources for an Azure solution. The resource group can include all the resources for the solution, or only those resources that you want to manage as a group.\n\nTo enable each department administrator to manage the Azure resources used by that department, you will need to create a separate subscription per department. You can then assign each department administrator as an administrator for the subscription to enable them to manage all resources in that subscription.","ref":"https://docs.microsoft.com/en-us/azure/cost-management-billing/manage/create-subscription\nhttps://docs.microsoft.com/en-us/azure/cost-management-billing/manage/add-change-subscription- administrator","imgs":[],"eimgs":[],"t":"mc"},{"q":"For each of the following statements, select Yes if the statement is true. Otherwise, select No.\nNOTE: Each correct selection is worth one point.\nHot Area:","opts":[],"cor":[],"exp":"Box 1: Yes\nYou can use the same account to manage multiple subscriptions. You can create an additional subscription for your account in the Azure portal. You may want an additional subscription to avoid hitting subscription limits, to create separate environments for security, or to isolate data for compliance reasons.\n\nBox 2: No\nYou cannot merge two subscriptions into a single subscription. However, you can move some Azure resources from one subscription to another. You can also transfer ownership of a subscription and change the billing type for a subscription.\n\nBox 3: Yes\nA company can have multiple subscriptions and store resources in the different subscriptions. However, a resource instance can exist in only one subscription.","ref":"https://docs.microsoft.com/en-us/azure/cost-management-billing/manage/create-subscription","imgs":["https://free-braindumps.com/images/exam-prep/AZ-900/a953b3fb-5ad3-4915-8901-1e7c75c55fa8.jpg"],"eimgs":["https://free-braindumps.com/images/exam-prep/AZ-900/faad3741-d5e3-4f9e-9614-6aa3cf5ee1e0.jpg"],"t":"img"},{"q":"How many copies of data are maintained by an Azure Storage account that uses locally-redundant storage (LRS)?","opts":["3","4","6","9"],"cor":[0],"exp":"A write request to a storage account that is using LRS happens synchronously. The write operation returns successfully only after the data is written to all three replicas.","ref":"https://docs.microsoft.com/en-us/azure/storage/common/storage-redundancy","imgs":[],"eimgs":[],"t":"mc"},{"q":"For each of the following statements, select Yes if the statement is true. Otherwise, select No.\nNOTE: Each correct selection is worth one point.","opts":[],"cor":[],"exp":"Box 1: Yes\nMicrosoft Defender for Cloud is a solution for cloud security posture management (CSPM) and cloud workload protection (CWP) that finds weak spots across your cloud configuration, helps strengthen the overall security posture of your environment, and can protect workloads across multicloud and hybrid environments from evolving threats.\n\nYou can enable threat protection for workloads running in Azure, AWS, Google Cloud Platform, and on premises.\n\nBox 2: No\nDefender for Cloud offers a number of enhanced security features that can help protect your organization against threats and attacks.\n\n* Basic security features (Free) - When you open Defender for Cloud in the Azure portal for the first time or if you enable it through the API, Defender for Cloud is enabled for free on all your Azure subscriptions.\n\n* Enhanced security features (Paid) - When you enable the enhanced security features, Defender for Cloud can provide unified security management and threat protection across your hybrid cloud workloads, including:\n\nMicrosoft Defender for Endpoint.\nEtc.\n\nBox 3: Yes\nFrom Azure Security Center, you can download a Regulatory Compliance report.","ref":"https://azure.microsoft.com/en-us/products/defender-for-cloud/#overview","imgs":["https://free-braindumps.com/images/exam-prep/AZ-900/72ae1107-aa67-482e-8a96-48bc7b3ce676.jpg"],"eimgs":["https://free-braindumps.com/images/exam-prep/AZ-900/f922a70b-cb4c-473d-8008-e29886ff173d.jpg"],"t":"img"},{"q":"What additional resource is required by an Azure virtual machine?","opts":["a virtual network","a service endpoint","Azure Firewall","a public IP address"],"cor":[0],"exp":"A VNet is used to provide the VM with DHCP and Security Group services. A VM would be unable to obtain an IP address without it\nWhen you create a virtual machine (VM), you create a virtual network or use an existing one.\n\nIncorrect:\nNot D: A VM can use a private IP.","ref":"https://docs.microsoft.com/en-us/azure/virtual-network/network-overview\nhttps://docs.microsoft.com/en-us/azure/defender-for-cloud/enhanced-security-features-overview","imgs":[],"eimgs":[],"t":"mc"},{"q":"How many copies of data are maintained by an Azure Storage account that uses geo-redundant storage (GRS)?","opts":["3","4","6","9"],"cor":[2],"exp":"","ref":"","imgs":[],"eimgs":[],"t":"mc"},{"q":"Select the answer that correctly completes the sentence.","opts":[],"cor":[],"exp":"Azure Functions is a serverless solution that allows you to write less code, maintain less infrastructure, and save on costs. Instead of worrying about deploying and maintaining servers, the cloud infrastructure provides all the up-to-date resources needed to keep your applications running.","ref":"https://docs.microsoft.com/en-us/azure/azure-functions/functions-overview","imgs":["https://free-braindumps.com/images/exam-prep/AZ-900/48090813-26d6-4e65-ab6a-012a5ba8d092.jpg"],"eimgs":["https://free-braindumps.com/images/exam-prep/AZ-900/4a680502-539e-476f-bb98-d070aebc608e.jpg"],"t":"img"},{"q":"For each of the following statements, select Yes if the statement is true. Otherwise, select No.\nNOTE: Each correct selection is worth one point.","opts":[],"cor":[],"exp":"Box 1: Yes\nYou can set a blob's access tier in any of the following ways:\n\nBy setting the default online access tier (Hot or Cool) for the storage account. Blobs in the account inherit this access tier unless you explicitly override the setting for an individual blob.\n\nEtc.\n\nBox 2: No\nArchive Tier is lower cost.\nThe Cool tier has lower storage costs and higher access costs compared to the Hot tier.\n\nThe Archive access tier has the lowest storage cost, but higher data retrieval costs and latency compared to the Hot and Cool tiers.\n\nArchive tier - An offline tier optimized for storing data that is rarely accessed, and that has flexible latency requirements, on the order of hours. Data in the Archive tier should be stored for a minimum of 180 days.\n\nBox 3: Yes\nYou can set a blob's access tier in any of the following ways:\n\n* By changing an existing blob's tier with a Set Blob Tier operation, typically to move from a hotter tier to a cooler one.\n* By explicitly setting a blob's tier on upload. You can create a blob in the Hot, Cool, or Archive tier.\n* Etc.","ref":"https://docs.microsoft.com/en-us/azure/storage/blobs/access-tiers-online-manage?tabs=azure-portal\nhttps://docs.microsoft.com/en-us/azure/storage/blobs/access-tiers-overview","imgs":["https://free-braindumps.com/images/exam-prep/AZ-900/c8d8680b-c53b-4621-a250-52d2170ba177.jpg"],"eimgs":["https://free-braindumps.com/images/exam-prep/AZ-900/be5fd918-e550-4821-8b1f-45340e8ad852.jpg"],"t":"img"},{"q":"Match the Azure storage services to the appropriate descriptions.\n\nTo answer, drag the appropriate storage service from the column on the left to its description on the right. Each service may be used once, more than once, or not at all.\n\nNOTE: Each correct match is worth one point.","opts":[],"cor":[],"exp":"Box 1: Azure Queue Storage\nQueue Storage\nDurable queues for large-volume cloud services\n\nSimple, cost-effective, durable message queueing for large workloads\nRich client libraries for .NET, Java, Android, C++, Node.js, PHP, Ruby, and Python\nData accessible via the REST API\n\nBox 2: Azure Files\nYou can map a Network File Share to an Azure Windows VM.\n\nBox 3: Azure Blob Storage\nAzure Archive Storage is yet another storage tier available for blob storage. Hot, cool, and archive objects can all exist side by side in the same account. And with the introduction of blob-level tiering, you can change an object’s tier with a single click in the Azure portal, or you can use the REST API (or .NET, Java, Python, and a number of other SDKs) to programmatically change as many objects as needed.","ref":"https://azure.microsoft.com/en-us/products/storage/queues/#overview\nhttps://azure.microsoft.com/en-us/products/storage/#overview\nhttps://www.geeksforgeeks.org/microsoft-azure-map-a-network-file-share-to-azure-windows-vm/","imgs":["https://free-braindumps.com/images/exam-prep/AZ-900/0fd18c66-eae3-49ca-8a61-86f13d4b0dd7.jpg"],"eimgs":["https://free-braindumps.com/images/exam-prep/AZ-900/96ba0976-76e6-4133-a519-712e321408cc.jpg"],"t":"img"},{"q":"Select the answer that correctly completes the sentence.","opts":[],"cor":[],"exp":"You can move a VM and its associated resources to a different subscription by using the Azure portal.\nMoving between subscriptions can be handy if you originally created a VM in a personal subscription and now want to move it to your company's subscription to continue your work. You do not need to start the VM in order to move it and it should continue to run during the move.","ref":"https://docs.microsoft.com/en-us/azure/virtual-machines/windows/move-vm","imgs":["https://free-braindumps.com/images/exam-prep/AZ-900/968793ee-d438-46dc-998e-aea6e6679b2e.jpg"],"eimgs":["https://free-braindumps.com/images/exam-prep/AZ-900/854895d2-dd12-40f6-9a43-e4a9ce03d315.jpg"],"t":"img"},{"q":"Select the answer that correctly completes the sentence.","opts":[],"cor":[],"exp":"Box: must be rehydrated before the data can be3 accessed\nBlob rehydration from the Archive tier\nWhile a blob is in the Archive access tier, it's considered to be offline, and can't be read or modified. In order to read or modify data in an archived blob, you must first rehydrate the blob to an online tier, either the Hot or Cool tier.","ref":"https://learn.microsoft.com/en-us/azure/storage/blobs/access-tiers-overview","imgs":["https://free-braindumps.com/images/exam-prep/AZ-900/9af08437-ff25-427c-b80c-afa380be90b5.jpg"],"eimgs":["https://free-braindumps.com/images/exam-prep/AZ-900/54424992-be38-48bd-80b4-a1c796d093d7.jpg"],"t":"img"},{"q":"For each of the following statements, select Yes if the statement is true. Otherwise, select No.\nNOTE: Each correct selection is worth one point.","opts":[],"cor":[],"exp":"Box 1: No\nPrerequisites for Azure Virtual Desktop\nOperating systems and licenses\nYou have a choice of operating systems that you can use for session hosts to provide virtual desktops and remote apps. You can use different operating systems with different host pools to provide flexibility to your users.\n\nBox 2: No\nMicrosoft does not have current limits on users per host pool or number of sessions per host pool.\n\nBox 3: Yes\nAzure Virtual Desktop is a desktop and app virtualization service that runs on the cloud and lets you access your remote desktop anytime, anywhere.","ref":"https://learn.microsoft.com/en-us/azure/virtual-desktop/prerequisites\nhttps://github.com/MicrosoftDocs/azure-docs/issues/52158\nhttps://learn.microsoft.com/en-us/azure/virtual-desktop/remote-app-streaming/overview","imgs":["https://free-braindumps.com/images/exam-prep/AZ-900/c1b3f92f-56eb-4a3c-9b59-7ae00b7fc970.jpg"],"eimgs":["https://free-braindumps.com/images/exam-prep/AZ-900/68735a26-a795-4406-ba05-c8f1b09db3a4.jpg","https://free-braindumps.com/images/exam-prep/AZ-900/917aacc7-e008-4e29-95a6-95436ce33d66.jpg"],"t":"img"},{"q":"For each of the following statements, select Yes if the statement is true. Otherwise, select No.\nNOTE: Each correct selection is worth one point.","opts":[],"cor":[],"exp":"Box 1: Yes\nWith scale sets, all VM instances are created from the same base OS image and configuration. This approach lets you easily manage hundreds of VMs without extra configuration tasks or network management.\n\nBox 2: Yes\nThe number of VM instances can automatically increase or decrease in response to demand or a defined schedule. S\n\nBox 3: Yes","ref":"https://learn.microsoft.com/en-us/azure/virtual-machine-scale-sets/overview","imgs":["https://free-braindumps.com/images/exam-prep/AZ-900/13f4aee9-beb7-4136-b375-8ea2a8944f8a.jpg"],"eimgs":["https://free-braindumps.com/images/exam-prep/AZ-900/fffdbfcb-5aff-49f7-9980-309e7a8de4fa.jpg"],"t":"img"},{"q":"For each of the following statements, select Yes if the statement is true. Otherwise, select No.\nNOTE: Each correct selection is worth one point.","opts":[],"cor":[],"exp":"Box 1: Yes\nAzure storage offers different access tiers so that you can store your blob data in the most cost-effective manner based on how it's being used. Azure Storage access tiers include:\n\nHot tier\nCool tier\nCold tier\nArchive tier\n\nBox 2: No\n\nBox 3: Yes\nSet the default access tier for a storage account\nThe default access tier setting for a general-purpose v2 storage account determines in which online tier a new blob is created by default. You can set the default access tier for a general-purpose v2 storage account at the time that you create the account or by updating an existing account's configuration.","ref":"https://learn.microsoft.com/en-us/azure/storage/blobs/access-tiers-overview\nhttps://learn.microsoft.com/en-us/azure/storage/blobs/access-tiers-online-manage","imgs":["https://free-braindumps.com/images/exam-prep/AZ-900/75b5b3d4-5613-43ce-aa0f-6bcbe124e6ea.jpg"],"eimgs":["https://free-braindumps.com/images/exam-prep/AZ-900/1ce73d8b-f0ff-4af5-8984-17a62319f3a4.jpg"],"t":"img"},{"q":"Which two features or services can be integrated with Azure Monitor? Each correct answer presents part of the solution.\n\nNOTE: Each correct answer is worth one point.","opts":["Azure status","Application Insights","Azure Advisor","Log Analytics","Azure Service Health"],"cor":[1,3],"exp":"B: Application Insights is an extension of Azure Monitor and provides application performance monitoring (APM) features.\n\nD: Log Analytics is a tool in the Azure portal that's used to edit and run log queries against data in the Azure Monitor Logs store. You might write a simple query that returns a set of records and then use features of Log Analytics to sort, filter, and analyze them.","ref":"https://learn.microsoft.com/en-us/azure/azure-monitor/app/app-insights-overview \nhttps://learn.microsoft.com/en-us/azure/azure-monitor/logs/log-analytics-overview '","imgs":[],"eimgs":[],"t":"mc"},{"q":"What provides a unified way to project and manage non-Azure resources in Azure Resource Manager (ARM)?","opts":["Azure Migrate","Azure AD Connect","Azure Arc","Azure Front Door"],"cor":[2],"exp":"Azure Arc, a central hub on Azure for non-Azure infrastructure\n\nNow that Microsoft introduces Azure Arc, it is much easier to manage, analyse and monitor all your environments from a single pane of glass. While Azure Lighthouse enables you to manage all your multi-customer Azure resources in one portal, Azure Arc also connects all your non-Azure Windows and Linux servers and Kubernetes clusters to Azure. Like what? Any infrastructure, including on-premise hardware, non-Azure clouds such as Google, AWS, and also edge devices, e.g. IoT connected machines. All non-Azure machines connected to Azure with Azure Arc become connected machines and are treated as a resource in Azure. Therefore, the combination of Azure Lighthouse and Azure Arc results in a very powerful tool, providing you with centralized management capability for all your customer.","ref":"https://www.linkedin.com/pulse/how-you-can-manage-all-azure-non-azure-resources-one-hub-garavaglia","imgs":[],"eimgs":[],"t":"mc"},{"q":"For each of the following statements, select Yes if the statement is true. Otherwise, select No.\nNOTE: Each correct selection is worth one point.","opts":[],"cor":[],"exp":"Box 1: Yes\nAzCopy is a command-line utility that you can use to copy blobs or files to or from a storage account.\n\nBox 2: No\nAzure Storage Explorer allows you to quickly view all the storage services under your account. You can browse through, read, and edit data stored in those services through a user-friendly graphical interface.\n\nBox 3: Yes\nUse Azure File Sync to centralize your organization's file shares in Azure Files, while keeping the flexibility, performance, and compatibility of an on-premises file server. Azure File Sync transforms Windows Server into a quick cache of your Azure file share. You can use any protocol that's available on Windows Server to access your data locally, including SMB, NFS, and FTPS. You can have as many caches as you need across the world.","ref":"https://learn.microsoft.com/en-us/azure/storage/common/storage-use-azcopy-v10\nhttps://learn.microsoft.com/en-us/azure/vs-azure-tools-storage-manage-with-storage-explorer \nhttps://learn.microsoft.com/en-us/azure/storage/file-sync/file-sync-deployment-guide","imgs":["https://free-braindumps.com/images/exam-prep/AZ-900/653aebe7-b67b-48f1-b6ff-6aeaade9984f.jpg"],"eimgs":["https://free-braindumps.com/images/exam-prep/AZ-900/49d429ad-79f5-4a42-8f14-8ff04f4afb02.jpg"],"t":"img"},{"q":"Select the answer that correctly completes the sentence.","opts":[],"cor":[],"exp":"Box: Azure Data Box\nMicrosoft Azure Data Box is a hardware appliance designed to allow customers to import or export large amounts of data — more than 40TB — into and out of Azure offline.","ref":"https://www.komprise.com/glossary_terms/azure-data-box","imgs":["https://free-braindumps.com/images/exam-prep/AZ-900/6923abd7-7a25-47d2-8619-fc7deec26fae.jpg"],"eimgs":["https://free-braindumps.com/images/exam-prep/AZ-900/4da1b5f6-033c-4f79-8217-e13ec70b9c4d.jpg"],"t":"img"},{"q":"An Azure administrator plans to run a PowerShell script that creates Azure resources.\nYou need to recommend which computer configuration to use to run the script.\n\nWhich three computers can run the script? Each correct answer presents a complete solution.\nNOTE: Each correct selection is worth one point.","opts":["a computer that runs Windows 11 and has the Azure CLI tools installed","a computer that runs Linux and has the Azure CLI tools installed","a computer that runs macOS and has PowerShell Core 6.0 installed","a computer that runs Chrome OS and uses Azure Cloud Shell","a computer that runs Windows 10 and has the Azure PowerShell module installed"],"cor":[0,3,4],"exp":"","ref":"","imgs":[],"eimgs":[],"t":"mc"},{"q":"For each of the following statements, select Yes if the statement is true. Otherwise, select No.\nNOTE: Each correct selection is worth one point.","opts":[],"cor":[],"exp":"Box 1: No\nAzure Active Directory (Azure AD) is a cloud-based service. It does not require domain controllers on virtual machines.\n\nBox 2: Yes\nAzure Active Directory (Azure AD) is a centralized identity provider in the cloud. This is the primary built-in authentication and authorization service to provide secure access to Azure resources and Microsoft 365.\n\nBox 3: No\nUser accounts in Azure Active Directory can be assigned multiple licenses for different Azure or Microsoft 365 services.","ref":"https://azure.microsoft.com/en-us/products/active-directory/ds","imgs":["https://free-braindumps.com/images/exam-prep/AZ-900/acb539bf-a07c-453e-92a4-337a4245b102.jpg"],"eimgs":["https://free-braindumps.com/images/exam-prep/AZ-900/b78c8aa8-2d7f-48f0-bf8d-fe17cbce5de0.jpg"],"t":"img"},{"q":"You have an Azure subscription.\nYou plan to create a virtual machine.\nWhere will the virtual machine be placed in Azure?","opts":["In a storage account","In a resource group","In an administrative unit","In an application group"],"cor":[1],"exp":"Create virtual machine\n1. Enter virtual machines in the search.\n2. Under Services, select Virtual machines.\n3. In the Virtual machines page, select Create and then Virtual machine. The Create a virtual machine page opens.\n4. In the Basics tab, under Project details, make sure the correct subscription is selected and then choose to Create new resource group. Enter myResourceGroup for the name.","ref":"https://learn.microsoft.com/en-us/azure/virtual-machines/linux/quick-create-portal","imgs":[],"eimgs":["https://free-braindumps.com/images/exam-prep/AZ-900/eec86329-88e6-4222-ac63-d7dc942b900d.jpg"],"t":"mc"},{"q":"Select the answer that correctly completes the sentence.","opts":[],"cor":[],"exp":"Box: Azure Files\nIf you want to reduce your dependency on physical servers and hardware, avoid costly maintenance and upgrades, and improve performance, you can use Azure File Sync to sync your on-premises servers to the Cloud. Azure File Sync allows you to centralize your on-premises file shares in the Azure Files while keeping your Windows file server’s compatibility, flexibility, and performance.","ref":"https://www.360visibility.com/how-to-use-azure-file-sync-to-sync-your-on-premises-servers-to-the-cloud","imgs":["https://free-braindumps.com/images/exam-prep/AZ-900/eab67e0a-4250-4867-97d8-03494a0e90bd.jpg"],"eimgs":["https://free-braindumps.com/images/exam-prep/AZ-900/3ef12c2a-10c6-4be6-b14e-b9537bd6f2db.jpg"],"t":"img"},{"q":"Select the answer that correctly completes the sentence.","opts":[],"cor":[],"exp":"Box: lock\nAs an administrator, you can lock an Azure subscription, resource group, or resource to protect them from accidental user deletions and modifications. The lock overrides any user permissions.\n\nIncorrect:\n* policy\nYou can't assign a policy at resource level scope. However, you can assign the policy at management group, subscription and resource group level and use exclusions feature to exclude the resource you don't want to include in the policy assignment.","ref":"https://learn.microsoft.com/en-us/azure/azure-resource-manager/management/lock-resources\nhttps://learn.microsoft.com/en-us/azure/governance/policy/concepts/assignment-structure","imgs":["https://free-braindumps.com/images/exam-prep/AZ-900/24fe7e74-dbb3-4583-9860-678da4c3c1cb.jpg"],"eimgs":["https://free-braindumps.com/images/exam-prep/AZ-900/c7b12417-a0ba-4838-9e11-06202c298818.jpg"],"t":"img"},{"q":"Select the answer that correctly completes the sentence.","opts":[],"cor":[],"exp":"Box: Azure Virtual Desktop\nAzure Virtual Desktop is a desktop and app virtualization service that runs on the cloud.\n\nHere's what you can do when you run Azure Virtual Desktop on Azure:\n\n*-> Set up a multi-session Windows 11 or Windows 10 deployment that delivers a full Windows experience with scalability\n\nPresent Microsoft 365 Apps for enterprise and optimize it to run in multi-user virtual scenarios\nBring your existing Remote Desktop Services (RDS) and Windows Server desktops and apps to any computer\nVirtualize both desktops and apps\nManage desktops and apps from different Windows and Windows Server operating systems with a unified management experience\n\nIncorrect:\n* Azure Spot Virtual Machines\nUsing Azure Spot Virtual Machines allows you to take advantage of our unused capacity at a significant cost savings. At any point in time when Azure needs the capacity back, the Azure infrastructure will evict Azure Spot Virtual Machines.","ref":"https://learn.microsoft.com/en-us/azure/virtual-desktop/overview","imgs":["https://free-braindumps.com/images/exam-prep/AZ-900/49970c86-0b9e-4dd2-a95d-bb63a5dde0b0.jpg"],"eimgs":["https://free-braindumps.com/images/exam-prep/AZ-900/166353df-e344-47e2-bd93-0a2fd20d4c4d.jpg"],"t":"img"},{"q":"Select the answer that correctly completes the sentence.","opts":[],"cor":[],"exp":"Box: for data that is accessed infrequently and stored for at least 30 days\nCool tier - An online tier optimized for storing data that is infrequently accessed or modified. Data in the cool tier should be stored for a minimum of 30 days. The cool tier has lower storage costs and higher access costs compared to the hot tier.\n\nIncorrect:\n* for data that is accessed rarely, is stored for at least 180 days, ..","ref":"https://learn.microsoft.com/en-us/azure/storage/blobs/access-tiers-overview","imgs":["https://free-braindumps.com/images/exam-prep/AZ-900/495726e9-cbcd-4570-9ee5-2179c16340eb.jpg"],"eimgs":["https://free-braindumps.com/images/exam-prep/AZ-900/bfd033bd-2dfd-4857-9497-62078359fdc8.jpg"],"t":"img"},{"q":"Select the answer that correctly completes the sentence.","opts":[],"cor":[],"exp":"Box: Azure status\nThe Azure status page is a global view of the health of all Azure services in all regions. It's a quick reference for incidents with widespread impact. Service Health keeps you informed about the health of your environment.\n\nIncorrect:\n* Azure Service Health\nAzure Service Health is a suite of experiences that provide personalized guidance and support when issues in Azure services are or may affect you in the future. Azure Service Health is composed of Azure status, the service health service, and Resource Health.","ref":"https://azure.microsoft.com/en-us/get-started/azure-portal/service-health","imgs":["https://free-braindumps.com/images/exam-prep/AZ-900/5f50dc08-d8de-4546-bb97-f6688132c830.jpg"],"eimgs":["https://free-braindumps.com/images/exam-prep/AZ-900/892e936d-d8e0-4162-ab5b-5be4f7bc4a0a.jpg"],"t":"img"},{"q":"For each of the following statements, select Yes if the statement is true. Otherwise, select No.\n\nNOTE: Each correct selection is worth one point.","opts":[],"cor":[],"exp":"Box 1: No\nPlatform as a service (PaaS) is a complete development and deployment environment in the cloud, with resources that enable you to deliver everything from simple cloud-based apps to sophisticated, cloud-enabled enterprise applications. You purchase the resources you need from a cloud service provider on a pay-as-you-go basis and access them over a secure Internet connection.\n\nLike IaaS, PaaS includes infrastructure—servers, storage, and networking—but also middleware, development tools, business intelligence (BI) services, database management systems, and more. PaaS is designed to support the complete web application lifecycle: building, testing, deploying, managing, and updating.\n\nPaaS allows you to avoid the expense and complexity of buying and managing software licenses, the underlying application infrastructure and middleware, container orchestrators such as Kubernetes, or the development tools and other resources. You manage the applications and services you develop, and the cloud service provider typically manages everything else.\n\nBox 2: Yes\nInfrastructure as a service (IaaS) is a type of cloud computing service that offers essential compute, storage, and networking resources on demand, on a pay-as-you-go basis. IaaS is one of the four types of cloud services, along with software as a service (SaaS), platform as a service (PaaS), and serverless.\n\nMigrating your organization's infrastructure to an IaaS solution helps you reduce maintenance of on-premises data centers, save money on hardware costs, and gain real-time business insights. IaaS solutions give you the flexibility to scale your IT resources up and down with demand. They also help you quickly provision new applications and increase the reliability of your underlying infrastructure.\n\nIaaS lets you bypass the cost and complexity of buying and managing physical servers and datacenter infrastructure. Each resource is offered as a separate service component, and you only pay for a particular resource for as long as you need it. A cloud computing service provider like Azure manages the infrastructure, while you purchase, install, configure, and manage your own software—including operating systems, middleware, and applications.\n\nBox 3: Yes\nShared responsibility in the cloud\n\nDivision of responsibility\nIn an on-premises datacenter, you own the whole stack. As you move to the cloud some responsibilities transfer to Microsoft. The following diagram illustrates the areas of responsibility between you and Microsoft, according to the type of deployment of your stack.\n\nNote: As you consider and evaluate public cloud services, it's critical to understand the shared responsibility model and which security tasks the cloud provider handles and which tasks you handle. The workload responsibilities vary depending on whether the workload is hosted on Software as a Service (SaaS), Platform as a Service (PaaS), Infrastructure as a Service (IaaS), or in an on-premises datacenter","ref":"https://azure.microsoft.com/en-us/resources/cloud-computing-dictionary/what-is-paas\nhttps://azure.microsoft.com/en-us/resources/cloud-computing-dictionary/what-is-iaas/\nhttps://learn.microsoft.com/en-us/azure/security/fundamentals/shared-responsibility","imgs":["https://free-braindumps.com/images/exam-prep/AZ-900/176fed79-6d96-44ac-8cf0-85a7ee8ca9ab.jpg"],"eimgs":["https://free-braindumps.com/images/exam-prep/AZ-900/27884da2-0135-4157-9788-e8eb7fb5d2cd.jpg","https://free-braindumps.com/images/exam-prep/AZ-900/a423d6f1-da39-41f1-9cd4-6c8e87babcd7.jpg"],"t":"img"},{"q":"Select the answer that correctly completes the sentence.","opts":[],"cor":[],"exp":"Box: availability sets\nAvailability sets are logical groupings of VMs that reduce the chance of correlated failures bringing down related VMs at the same time. Availability sets place VMs in different fault domains for better reliability, especially beneficial if a region doesn't support availability zones.\n\nNote: How do availability sets work?\nEach virtual machine in your availability set is assigned an update domain and a fault domain by the underlying Azure platform. Each availability set can be configured with up to 3 fault domains and 20 update domains. These configurations can't be changed once the availability set has been created. Update domains indicate groups of virtual machines and underlying physical hardware that can be rebooted at the same time. When more than five virtual machines are configured within a single availability set with five update domains, the sixth virtual machine is placed into the same update domain as the first virtual machine, the seventh in the same update domain as the second virtual machine, and so on. The order of update domains being rebooted may not proceed sequentially during planned maintenance, but only one update domain is rebooted at a time. A rebooted update domain is given 30 minutes to recover before maintenance is initiated on a different update domain.","ref":"https://learn.microsoft.com/en-us/azure/virtual-machines/availability-set-overview","imgs":["https://free-braindumps.com/images/exam-prep/AZ-900/53959e97-eb31-40be-8de0-1e0b374d1ceb.jpg"],"eimgs":["https://free-braindumps.com/images/exam-prep/AZ-900/fd4c1bd6-f058-44fc-bd72-79f5482e52bf.jpg"],"t":"img"},{"q":"In the software as a service (SaaS) cloud service, which responsibility is shared between Microsoft and the customer?","opts":["identity and directory infrastructure management","application management","information and data management","operating system updates"],"cor":[0],"exp":"Shared responsibility in the cloud\n\nDivision of responsibility\nIn an on-premises datacenter, you own the whole stack. As you move to the cloud some responsibilities transfer to Microsoft. The following diagram illustrates the areas of responsibility between you and Microsoft, according to the type of deployment of your stack.\n\n \n\nNote: As you consider and evaluate public cloud services, it's critical to understand the shared responsibility model and which security tasks the cloud provider handles and which tasks you handle. The workload responsibilities vary depending on whether the workload is hosted on Software as a Service (SaaS), Platform as a Service (PaaS), Infrastructure as a Service (IaaS), or in an on-premises datacenter.","ref":"https://learn.microsoft.com/en-us/azure/security/fundamentals/shared-responsibility","imgs":[],"eimgs":["https://free-braindumps.com/images/exam-prep/AZ-900/870e85fb-3e0a-4702-92bf-edf63c84bd7b.jpg"],"t":"mc"},{"q":"Select the answer that correctly completes the sentence.","opts":[],"cor":[],"exp":"Box: Azure Service Health\nAzure Service Health is a suite of experiences that provide personalized guidance and support when issues in Azure services are or may affect you in the future. Azure Service Health is composed of Azure status, the service health service, and Resource Health.\n\nNote: The Azure status page is a global view of the health of all Azure services in all regions. It's a quick reference for incidents with widespread impact. Service Health keeps you informed about the health of your environment.\n\nIncorrect:\n* Azure Advisor\nDo more with less. Reduce costs and increase the efficiency of your cloud investments. Azure Advisor offers actionable recommendations to help you optimize your Azure resources for reliability, security, operational excellence, performance, and cost.","ref":"https://azure.microsoft.com/en-us/products/advisor","imgs":["https://free-braindumps.com/images/exam-prep/AZ-900/9c140109-224a-4d4e-98ed-c371648b29c7.jpg"],"eimgs":["https://free-braindumps.com/images/exam-prep/AZ-900/9573a512-69d1-4115-9b26-ea7e1b89d7cc.jpg"],"t":"img"},{"q":"Select the answer that correctly completes the sentence.","opts":[],"cor":[],"exp":"Box: Conditional Access\n_____ evaluates signals to allow or deny sign-ins to Microsoft Entra.\n\nWhat is Conditional Access?\nThe modern security perimeter extends beyond an organization's network perimeter to include user and device identity. Organizations now use identity-driven signals as part of their access control decisions. Microsoft Entra (and Azure AD) Conditional Access brings signals together, to make decisions, and enforce organizational policies. Conditional Access is Microsoft's Zero Trust policy engine taking signals from various sources into account when enforcing policy decisions.","ref":"https://learn.microsoft.com/en-us/entra/identity/conditional-access/overview","imgs":["https://free-braindumps.com/images/exam-prep/AZ-900/f4306612-ec8e-4c3e-b51e-3699dce167e6.jpg"],"eimgs":["https://free-braindumps.com/images/exam-prep/AZ-900/d5c431fe-8b58-48f7-b985-2912e23e519e.jpg","https://free-braindumps.com/images/exam-prep/AZ-900/6af20809-ad3d-40c8-a3c4-83081b2340c3.jpg"],"t":"img"},{"q":"Match the Azure compute services to the appropriate descriptions.\n\nTo answer, drag the appropriate compute service from the column on the left to its description on the right. Each service may be used once, more than once, or not at all.\n\nNOTE: Each correct match is worth one point.","opts":[],"cor":[],"exp":"Box 1: Azure Container Instances\nProvides software emulation of a physical computer.\n\nAzure Container Instances (ACI) is a service that enables a developer to deploy containers on the Microsoft Azure public cloud without having to provision or manage any underlying infrastructure. The service supports both Linux containers and Windows containers.\n\nBox 2: Azure Virtual Machine Scale Sets\nProvides operating system virtualization.\n\nAzure Virtual Machine Scale Sets\nAzure Virtual Machine Scale Sets let you create and manage a group of load balanced VMs. The number of VM instances can automatically increase or decrease in response to demand or a defined schedule. Scale sets provide the following key benefits:\n\nEasy to create and manage multiple VMs\nProvides high availability and application resiliency by distributing VMs across availability zones or fault domains\nAllows your application to automatically scale as resource demand changes\nWorks at large-scale\n\nIncorrect:\n* Azure App Service\nAzure App Service enables you to build and host web apps, mobile back ends, and RESTful APIs in the programming language of your choice without managing infrastructure. It offers auto-scaling and high availability, supports both Windows and Linux, and enables automated deployments from GitHub, Azure DevOps, or any Git repo.","ref":"https://www.techtarget.com/searchcloudcomputing/definition/Azure-Container-Instances","imgs":["https://free-braindumps.com/images/exam-prep/AZ-900/9cd1f552-47aa-4511-86a5-c7847695bd7c.jpg"],"eimgs":["https://free-braindumps.com/images/exam-prep/AZ-900/52109ee2-6c5c-445c-9794-01c57008a661.jpg"],"t":"img"},{"q":"For each of the following statements, select Yes if the statement is true. Otherwise, select No.\n\nNOTE: Each correct selection is worth one point.","opts":[],"cor":[],"exp":"Box 1: No\nNo - You must install Azure Cloud Shell on your computer before you can use it.\n\nYou must register it, not install it.\n\nBefore you can use Azure Cloud Shell, you must register the Microsoft.CloudShell resource provider. Access to resources is enabled through provider namespaces that must be registered in your subscription. You only need to register the namespace once per subscription.\n\nTo see all resource providers, and the registration status for your subscription:\n\n1. Sign in to the Azure portal.\n\n2. On the Azure portal menu, search for Subscriptions. Select it from the available options.\n\n3. Select the subscription you want to view.\n\n4. On the left menu, under Settings, select Resource providers.\n\n5. In the search box, enter cloudshell to search for the resource provider.\n\n6. Select the Microsoft.CloudShell resource provider register from the provider list.\n\n7. Select Register to change the status from unregistered to Registered.\n\nStart Cloud Shell\n1. Launch Cloud Shell from the top navigation of the Azure portal.\n\nBox 2: No\nNo - The Azure Command-Line Interface (CLI) is installed by default in Windows 11\n\nYou must install Azure CLI on Windows\nThe Azure Command-Line Interface (CLI) is a cross-platform command-line tool that can be installed locally on Windows computers. You can use the Azure CLI for Windows to connect to Azure and execute administrative commands on Azure resources. The Azure CLI for Windows can also be used from a browser through the Azure Cloud Shell or run from inside a Docker container.\n\nBox 3: Yes\nYes - Azure PowerShell can be used on computers than run Windows, Linux, or macOS.\n\nAzure CLI and Azure PowerShell are command-line tools that enable you to create and manage Azure resources. Both are cross-platform, installable on Windows, macOS, and Linux.","ref":"https://learn.microsoft.com/en-us/azure/cloud-shell/get-started/classic\nhttps://learn.microsoft.com/en-us/cli/azure/install-azure-cli-windows\nhttps://learn.microsoft.com/en-us/cli/azure/choose-the-right-azure-command-line-tool","imgs":["https://free-braindumps.com/images/exam-prep/AZ-900/f7f23421-412b-4e79-b243-ced2cf03408d.jpg"],"eimgs":["https://free-braindumps.com/images/exam-prep/AZ-900/8c248bb2-7c13-4c62-93f4-7c44832e7b09.jpg"],"t":"img"},{"q":"For each of the following statements, select Yes if the statement is true. Otherwise, select No.\n\nNOTE: Each correct selection is worth one point.","opts":[],"cor":[],"exp":"Box 1: Yes\nYes - Network security groups (NSGs) can contain multiple inbound and outbound security rules.\n\nNetwork security groups: Network security groups and application security groups can contain multiple inbound and outbound security rules. These rules enable you to filter traffic to and from resources by source and destination IP address, port, and protocol.\n\nBox 2: Yes\nYes - A VM that performs a particular function such as running a firewall is also called a Network virtual appliance.\n\nNetwork virtual appliances: A network virtual appliance is a VM that performs a network function, such as a firewall or WAN optimization.\n\nBox 3: No\nA user-defined route (UDR) can only control network traffic between subnets of a single network.\n\nYou can create custom, or user-defined(static), routes in Azure to override Azure's default system routes, or to add more routes to a subnet's route table.\n\n* Virtual network gateway: Specify when you want traffic destined for specific address prefixes routed to a virtual network gateway.\n\n* Virtual appliance: A virtual appliance is a virtual machine that typically runs a network application, such as a firewall.\n\n* Internet: Specify the Internet option when you want to explicitly route traffic destined to an address prefix to the Internet, or if you want traffic destined for Azure services with public IP addresses kept within the Azure backbone network.\n\n* Etc.","ref":"https://learn.microsoft.com/en-us/azure/virtual-network/virtual-networks-overview","imgs":["https://free-braindumps.com/images/exam-prep/AZ-900/2bb87ad6-8d2e-45ae-ab2c-18e6d22bf74c.jpg"],"eimgs":["https://free-braindumps.com/images/exam-prep/AZ-900/fef63006-018f-4adb-973b-dd957a0b9730.jpg"],"t":"img"},{"q":"Microsoft 365 is an example of which cloud service model?","opts":["infrastructure as a service (IaaS)","platform as a service (PaaS)","software as a service (SaaS)"],"cor":[2],"exp":"Microsoft 365 is a SaaS (Software as a Service) product. Means it's a software service you pay to use, as you would for any other subscription-based service.","ref":"https://learn.microsoft.com/en-us/answers/questions/1287347/what-are-the-key-differences-between-microsoft-azu","imgs":[],"eimgs":[],"t":"mc"},{"q":"Select the answer that correctly completes the sentence.","opts":[],"cor":[],"exp":"Box: resource group\nYou can assign an Azure Policy definition to a ___________.\n\nOnce your business rules have been formed, the policy definition or initiative is assigned to any scope of resources that Azure supports, such as management groups, subscriptions, resource groups, or individual resources. The assignment applies to all resources within the Resource Manager scope of that assignment.","ref":"https://learn.microsoft.com/en-us/azure/governance/policy/overview","imgs":["https://free-braindumps.com/images/exam-prep/AZ-900/f0e034cd-4fc1-4238-a881-802e02878122.jpg"],"eimgs":["https://free-braindumps.com/images/exam-prep/AZ-900/ad05c944-2967-4c3d-b5b2-9054b3f16c0a.jpg"],"t":"img"},{"q":"You have an Azure environment.\n\nYou need to create a new Azure virtual machine from a tablet that runs the Android operating system.\n\nWhat are three possible solutions? Each correct answer presents a complete solution.\n\nNOTE: Each correct selection is worth one point.","opts":["Use the Settings app.","Use the Azure portal.","Use Bash in Azure Cloud Shell.","Use the PowerApps portal.","Use PowerShell in Azure Cloud Shell."],"cor":[1,3,4],"exp":"Correct: \n* Use Bash in Azure Cloud Shell.\n* Use PowerShell in Azure Cloud Shell.\n* Use the Azure portal.\n\nIncorrect: \n* Use the PowerApps portal.\n* Use the Security & Compliance admin center.\n* Use the Settings app.\n\nNote: The Android tablet device will have a web browser (Chrome). That’s enough to connect to the Azure portal.\n\nThe Azure portal offers three ways to create a VM:\nUsing the graphical portal.\nUsing the Azure Cloud Shell using Bash.\nUsing the Azure Cloud Shell using PowerShell.","ref":"https://learn.microsoft.com/en-us/azure/virtual-machines/overview","imgs":[],"eimgs":[],"t":"mc"},{"q":"Select the answer that correctly completes the sentence.","opts":[],"cor":[],"exp":"Box: any two virtual networks\nVirtual network peering can be configured between ________.\n\nVirtual network peering enables you to seamlessly connect two or more Virtual Networks in Azure. The virtual networks appear as one for connectivity purposes. The traffic between virtual machines in peered virtual networks uses the Microsoft backbone infrastructure. Like traffic between virtual machines in the same network, traffic is routed through Microsoft's private network only.\n\nAzure supports the following types of peering:\n\n* Virtual network peering: Connecting virtual networks within the same Azure region.\n\n* Global virtual network peering: Connecting virtual networks across Azure regions.\n\nThe benefits of using virtual network peering, whether local or global, include:\n* The ability to transfer data between virtual networks across Azure subscriptions, Microsoft Entra tenants, deployment models, and Azure regions.\n\n* Etc.","ref":"https://learn.microsoft.com/en-us/azure/virtual-network/virtual-network-peering-overview","imgs":["https://free-braindumps.com/images/exam-prep/AZ-900/0190cedc-98c0-4792-9d9d-b218ab4e4dc4.jpg"],"eimgs":["https://free-braindumps.com/images/exam-prep/AZ-900/44ecfce7-a620-4e8d-9c81-e28a16241830.jpg"],"t":"img"},{"q":"Select the answer that correctly completes the sentence.","opts":[],"cor":[],"exp":"Box: region\nMany Azure resources require you to specify a _______ to which they should be deployed.","ref":"","imgs":["https://free-braindumps.com/images/exam-prep/AZ-900/7f7136e7-cef7-4306-b619-583eda93bc9a.jpg"],"eimgs":["https://free-braindumps.com/images/exam-prep/AZ-900/31fd1d01-4146-4de7-9c46-01acb774c1f5.jpg"],"t":"img"},{"q":"Match the Azure compute services to the appropriate descriptions.\n\nTo answer, drag the appropriate compute service from the column on the left to its description on the right. Each service may be used once, more than once, or not at all.\n\nNOTE: Each correct match is worth one point.","opts":[],"cor":[],"exp":"Box 1: ExpressRoute\nA dedicated private connection that does not traverse the internet.\n\nBox 2: Virtual Private Network (VPN)\n\nBox 3: Azure Virtual Desktop","ref":"","imgs":["https://free-braindumps.com/images/exam-prep/AZ-900/f8800ed6-5a7d-4368-bf6c-3b5ad0e9aef6.jpg"],"eimgs":["https://free-braindumps.com/images/exam-prep/AZ-900/894d5c8b-e86b-41b7-b259-783aa772ca6d.jpg"],"t":"img"},{"q":"For each of the following statements, select Yes if the statement is true. Otherwise, select No.\n\nNOTE: Each correct selection is worth one point.","opts":[],"cor":[],"exp":"Box 1: No\n\nBox 2: Yes\nYes - Microsoft Purview provides data discovery.\n\nMicrosoft Purview automates data discovery by providing data scanning and classification for assets across your data estate. Metadata and descriptions of discovered data assets are integrated into a holistic map of your data estate. Microsoft Purview Data Map provides the foundation for data discovery and data governance.\n\nBox 3: Yes\nYes - Microsoft Purview provides data classification.","ref":"https://learn.microsoft.com/en-us/purview/governance-solutions-overview","imgs":["https://free-braindumps.com/images/exam-prep/AZ-900/b5b5136c-f770-4096-a116-630194d93b94.jpg"],"eimgs":["https://free-braindumps.com/images/exam-prep/AZ-900/fc9f0580-36ed-4cc3-8c76-935d7cb3d396.jpg"],"t":"img"},{"q":"For each of the following statements, select Yes if the statement is true. Otherwise, select No.\n\nNOTE: Each correct selection is worth one point.","opts":[],"cor":[],"exp":"Box 1: No\nNo - Azure DNS only supports public DNS domain names.\n\nAzure DNS not only supports internet-facing DNS domains, but it also supports private DNS zones. Azure Private DNS provides a reliable and secure DNS service for your virtual networks.\n\nBox 2: Yes\nYes - Azure virtual machines can register names in Azure DNS automatically.\n\nTo resolve the records of a private DNS zone from your virtual network, you must link the virtual network with the zone. Linked virtual networks have full access and can resolve all DNS records published in the private zone. You can also enable autoregistration on a virtual network link. When you enable autoregistration on a virtual network link, the DNS records for the virtual machines in that virtual network are registered in the private zone. When autoregistration gets enabled, Azure DNS will update the zone record whenever a virtual machine gets created, changes its' IP address, or gets deleted.\n\nBox 3: Yes\n\nYou can configure Azure DNS to host a custom domain for your web apps. For example, you can create an Azure web app and have your users access it using either www.contoso.com or contoso.com as a fully qualified domain name (FQDN).","ref":"https://learn.microsoft.com/en-us/azure/dns/private-dns-overview\nhttps://learn.microsoft.com/en-us/azure/dns/dns-web-sites-custom-domain","imgs":["https://free-braindumps.com/images/exam-prep/AZ-900/315f5204-c04b-405f-96f0-e658fc24a5e3.jpg"],"eimgs":["https://free-braindumps.com/images/exam-prep/AZ-900/33408f78-32d0-48d8-a2dd-52ff0dff9200.jpg"],"t":"img"},{"q":"For each of the following statements, select Yes if the statement is true. Otherwise, select No.\n\nNOTE: Each correct selection is worth one point.","opts":[],"cor":[],"exp":"The Cold access tier in Azure Storage is optimized for at least 90 days of data storage – No.\nAzure Storage doesn't have a \"Cold\" access tier. It has \"Hot,\" \"Cool,\" and \"Archive\" tiers. The \"Cool\" access tier is designed for infrequent access but for at least 30 days, not 90 days.\n\nThe Cool access tier in Azure Storage is optimized for at least 90 days of data storage – No\nThe \"Cool\" access tier is optimized for data that is infrequently accessed and needs to be stored for at least 30 days, not 90 days.\n\nThe Archive access tier in Azure Storage is optimized for at least 180 days of data storage – Yes\nThe Archive access tier is designed for data that is rarely accessed and is intended for long-term storage, typically optimized for data held for at least 180 days.","ref":"","imgs":["https://free-braindumps.com/images/exam-prep/AZ-900/bdb64107-c155-4b70-9a12-fbb465b137d8.jpg"],"eimgs":["https://free-braindumps.com/images/exam-prep/AZ-900/814f9c21-3f67-413a-9afc-814c26724b26.jpg"],"t":"img"},{"q":"How many data copies are stored in gee-zone-redundant storage (GZRS)?","opts":["2","3","6","12"],"cor":[2],"exp":"Geo-zone-redundant storage (GZRS) replicates data both within a single region and across different regions, ensuring high availability. It combines zone-redundant storage (ZRS), which stores three copies of data across different availability zones in the primary region, with geo-replication, which stores another three copies of the data in a secondary region.\n\nIn total, GZRS stores 6 copies of your data (3 in the primary region across availability zones and 3 in the secondary region).","ref":"","imgs":[],"eimgs":[],"t":"mc"},{"q":"Select the answer that correctly completes the sentence.","opts":[],"cor":[],"exp":"Availability\n\nA cloud service provider's Service-Level Agreement (SLA) typically defines the availability of the service, which is often expressed as a percentage of uptime over a specified period (such as a year). For example, an SLA might guarantee 99.9% availability, meaning the service is expected to be operational for 99.9% of the time.","ref":"","imgs":["https://free-braindumps.com/images/exam-prep/AZ-900/6e2d09f3-b585-4ba6-816c-06077551329f.jpg"],"eimgs":["https://free-braindumps.com/images/exam-prep/AZ-900/e3d536e0-632d-4a3a-917f-e929fb7f228c.jpg"],"t":"img"},{"q":"You have an on-premises application that sends email notifications automatically based on a rule.\nYou plan to migrate the application to Azure.\nYou need to recommend a serverless computing solution for the application.\nWhat should you include in the recommendation?","opts":["a web app","a server image in Azure Marketplace","a logic app","an API app"],"cor":[2],"exp":"Azure Logic Apps is a cloud service that helps you schedule, automate, and orchestrate tasks, business processes, and workflows when you need to integrate apps, data, systems, and services across enterprises or organizations. Logic Apps simplifies how you design and build scalable solutions for app integration, data integration, system integration, enterprise application integration (EAI), and business-to-business (B2B) communication, whether in the cloud, on premises, or both.\n\nFor example, here are just a few workloads you can automate with logic apps:\n-Process and route orders across on-premises systems and cloud services.\n-Send email notifications with Office 365 when events happen in various systems, apps, and services.\n-Move uploaded files from an SFTP or FTP server to Azure Storage.\n-Monitor tweets for a specific subject, analyze the sentiment, and create alerts or tasks for items that need review.","ref":"https://docs.microsoft.com/en-us/azure/logic-apps/logic-apps-overview","imgs":[],"eimgs":[],"t":"mc"},{"q":"You plan to deploy a website to Azure. The website will be accessed by users worldwide and will host large video files.\n\nYou need to recommend which Azure feature must be used to provide the best video playback experience.\n\nWhat should you recommend?","opts":["an application gateway","an Azure ExpressRoute circuit","a content delivery network (CDN)","an Azure Traffic Manager profile"],"cor":[2],"exp":"The question states that users are located worldwide and will be downloading large video files. The video playback experience would be improved if they can download the video from servers in the same region as the users. We can achieve this by using a content deliver network.\n\nA content delivery network (CDN) is a distributed network of servers that can efficiently deliver web content to users. CDNs store cached content on edge servers in point-of-presence (POP) locations that are close to end users, to minimize latency.\n\nAzure Content Delivery Network (CDN) offers developers a global solution for rapidly delivering high-bandwidth content to users by caching their content at strategically placed physical nodes across the world. Azure CDN can also accelerate dynamic content, which cannot be cached, by leveraging various network optimizations using CDN POPs. For example, route optimization to bypass Border Gateway Protocol (BGP).\n\nThe benefits of using Azure CDN to deliver web site assets include:\n\n-Better performance and improved user experience for end users, especially when using applications in which multiple round-trips are re

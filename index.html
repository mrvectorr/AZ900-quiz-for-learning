<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AZ-900 Quiz</title>
<style>
:root{--bg:#f5f6f8;--card:#fff;--tx:#1b1f24;--mu:#5f6b7a;--bd:#d8dde4;--ac:#0b6bcb;--ok:#1a7f37;--okb:#e6f6ea;--no:#c62828;--nob:#fdecec}
@media(prefers-color-scheme:dark){:root{--bg:#14171b;--card:#1d2227;--tx:#e8ebef;--mu:#9aa6b4;--bd:#323a43;--ac:#4aa3ff;--ok:#5fd07a;--okb:#16301e;--no:#ff7b7b;--nob:#3a1b1b}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,sans-serif}
main{max-width:760px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:16px;margin:12px 0}
h1{font-size:1.5rem;margin:8px 0}h2{font-size:1.1rem;margin:0 0 8px}
button{font:inherit;padding:10px 16px;border-radius:8px;border:1px solid var(--ac);background:var(--ac);color:#fff;cursor:pointer;margin:4px 4px 4px 0}
button.sec{background:transparent;color:var(--ac)}button:disabled{opacity:.4;cursor:default}
.opt{display:flex;gap:10px;align-items:flex-start;padding:10px;border:1px solid var(--bd);border-radius:8px;margin:6px 0;cursor:pointer}
.opt.sel{border-color:var(--ac)}.opt.ok{background:var(--okb);border-color:var(--ok)}.opt.bad{background:var(--nob);border-color:var(--no)}
.opt input{margin-top:5px}.mu{color:var(--mu);font-size:.9rem}
.q{white-space:pre-wrap;margin:6px 0 10px}.exp{white-space:pre-wrap;font-size:.95rem;border-top:1px dashed var(--bd);margin-top:10px;padding-top:10px}
img{max-width:100%;height:auto;display:block;margin:8px 0;background:#fff;border-radius:6px}
input[type=search]{width:100%;padding:10px;font:inherit;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--tx)}
.bar{height:6px;background:var(--bd);border-radius:3px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ac)}
.tag{font-size:.75rem;border:1px solid var(--bd);border-radius:10px;padding:1px 8px;color:var(--mu)}
</style></head><body><main id="app"></main>
<script>
const Q=[{"q":"To transition a large capital expenditure (CapEx) to an operational expenditure (OpEx), Contoso's CIO has suggested to the board that the organization move their virtual machine (IaaS) workloads to Azure. The CFO argues that this will result in unpredictable OpEx spending. In this case, what pricing option is available to reduce costs and making predicting future spending easier?","opts":["Azure Reservations","Pay-as-you-go (PAYG)","Azure VM Scale Sets","Azure in CSP"],"cor":[0],"exp":"","ref":"","imgs":[],"eimgs":[],"t":"mc"},{"q":"Tailspin Toys, a small startup, is choosing their initial services architecture. They choose to rely on Office 365 and Microsoft Azure for all services. Which of the following best describes the cloud model they have chosen?","opts":["Private Cloud","Public Cloud","Hybrid Cloud","Government Cloud"],"cor":[1],"exp":"","ref":"","imgs":[],"eimgs":[],"t":"mc"},{"q":"Which of the following statements are true of a Software as a Service solution?","opts":["You are responsible for maintaining the solution infrastructure","You are responsible for deploying updates to the solution","You are responsible for solution availability and scalability","You are responsible for configuring the solution features"],"cor":[3],"exp":"","ref":"","imgs":[],"eimgs":[],"t":"mc"},{"q":"Contoso is planning to move to Azure, but currently hosts business applications in a shared virtualization infrastructure on-premises, utilizing Hyper-V. This is an example of which cloud computing model?","opts":["Hybrid Cloud","Private Cloud","Public Cloud","Government Cloud"],"cor":[1],"exp":"","ref":"","imgs":[],"eimgs":[],"t":"mc"},{"q":"Azure SQL Database and an on-premises SQL cluster represent a(n) ___ expense and a(n) ____ expense, respectively.","opts":["Capital, Capital","Capital, Operational","Operational, Operational","Operational, Capital"],"cor":[3],"exp":"","ref":"","imgs":[],"eimgs":[],"t":"mc"},{"q":"In Azure, you are charged only for what you use. This is known as a","opts":["Fixed-price model","Consumption based model"],"cor":[1],"exp":"","ref":"","imgs":[],"eimgs":[],"t":"mc"},{"q":"Contoso runs several business applications in Azure VMs. Which cloud computing model best categorizes Azure VMs?","opts":["Software  as a service (SaaS)","Platform  as a service (PaaS)","Infrastructure  as a service (IaaS)","Function as a service (FaaS)"],"cor":[2],"exp":"","ref":"","imgs":[],"eimgs":[],"t":"mc"},{"q":"Azure App Service, Azure SQL Database, and Cosmos DB are examples of which category of cloud computing service?","opts":["Function as a Service (FaaS)","Software as a Service (SaaS)","Platform as a Service (PaaS)","Infrastructure as a Service (IaaS)"],"cor":[2],"exp":"","ref":"","imgs":[],"eimgs":[],"t":"mc"},{"q":"You need to provide additional capacity than what is currently available in your on-premises datacenter. The solution must minimize capital expense (CapEx) and operational expense (OpEx). Which solution should you recommend?","opts":["Migration to public cloud","A private cloud","A hybrid cloud","Additional on-premises servers"],"cor":[2],"exp":"","ref":"","imgs":[],"eimgs":[],"t":"mc"},{"q":"Office 365, Azure VMs, and Event Grid represent, ______, ______, and ______, respectively.","opts":["1)SaaS 2) PaaS 3) IaaS","1) PaaS 2) IaaS 3) SaaS","1) SaaS 2) IaaS 3) PaaS"],"cor":[2],"exp":"","ref":"","imgs":[],"eimgs":[],"t":"mc"},{"q":"Contoso host databases for customer-facing web applications in Azure MySQL Database. Which cloud computing model best categorizes this service?","opts":["Software  as a service (SaaS)","Platform  as a service (PaaS)","infrastructure  as a service (IaaS)","Function as a service (FaaS)"],"cor":[1],"exp":"","ref":"","imgs":[],"eimgs":[],"t":"mc"},{"q":"Contoso hosts a legacy CRM application that runs on an Azure VM scale set. The application runs at a steady state of around 30% resource utilization. However, during month end closing activities, the application spikes to 90% resource utilization for extended periods during the last week of the month. Azure allows Contoso IT to meet these spikes in resource demand at the push of a button, paying for the additional capacity only when needed. This is an example of:","opts":["Scalability","Elasticity","Fault Tolerance","High Availability"],"cor":[1],"exp":"","ref":"","imgs":[],"eimgs":[],"t":"mc"},{"q":"Contoso plans to migrate their existing on-premises SQL VMs to Azure. Which expenditure model does this implement?","opts":["Capital (CAPEX)","Operational (OPEX)","Subscription","Elastic"],"cor":[1],"exp":"","ref":"","imgs":[],"eimgs":[],"t":"mc"},{"q":"A financial analysis of migration of on-premises files to Azure Storage at Contoso showed that storing 2TB of archived data in Azure would be less expensive than hosting this data on-premises. The report also showed unit cost in Azure would decrease even further as the data archive grows. This is an example of cloud","opts":["Elasticity","Economies of scale","Scalability","High Availability"],"cor":[1],"exp":"","ref":"","imgs":[],"eimgs":[],"t":"mc"},{"q":"The Contoso Corp Financial Services team needs to automate several business processes. They need to create workflows in a low-code environment with a visual interface. The service must have built-in connectivity to their existing platforms, like SalesForce and SAP. The members working on the project are only lightly technical (citizen developers). Which Microsoft service will best fit their use case?","opts":["Power Automate","Logic Apps","Azure Automation","Azure Functions"],"cor":[0],"exp":"","ref":"","imgs":[],"eimgs":[],"t":"mc"},{"q":"Kelly, who works in IT Operations, wants to automate a task using a script she wrote. She wants to do this with a minimum of expense and maintenance effort. She selected Azure Functions to host the job, instead of Azure Virtual Machines (IaaS). Does this service meet the solution criteria?","opts":["YES","NO"],"cor":[0],"exp":"","ref":"","imgs":[],"eimgs":[],"t":"mc"},{"q":"Contoso has a line-of-business application that requires access to a file share. You need to host this share in Azure with a minimum of cost and administration effort. Which service would best fulfill this requirement?","opts":["Azure Files","Azure Blob Storage","Azure VMs","VM Scale Sets"],"cor":[0],"exp":"","ref":"","imgs":[],"eimgs":[],"t":"mc"},{"q":"Contoso IT needs to ensure deployments of like Azure resources are the same for every deployment. Which of the following could be used to automate resource deployment?","opts":["Azure API Management","Management Groups","Azure Resource Manager (ARM) templates","Azure Synapse"],"cor":[2],"exp":"","ref":"","imgs":[],"eimgs":[],"t":"mc"},{"q":"You are testing new software in an Azure VM. When you are done testing, you shut down the VM, which shows a state of \"Stopped\" in the Azure portal. Will you incur additional costs while the VM is in this state?","opts":["YES","NO"],"cor":[0],"exp":"Cost will still be incurred for some resources, such as Azure storage consumed by VMs disks.","ref":"","imgs":[],"eimgs":[],"t":"mc"},{"q":"You are deploying multiple instances of a custom Contoso web application. The application instances share a common management lifecycle, but will be located in different Azure regions. Can you deploy resources across multiple Azure regions in a single resource group?","opts":["YES","NO"],"cor":[0],"exp":"","ref":"","imgs":[],"eimgs":[],"t":"mc"},{"q":"You are responsible for recommending infrastructure architectures for applications at Contoso. Which solution would you recommend for on-demand execution of automated tasks in Python for minimum of expense?","opts":["Azure Monitor","Azure Cloud Shell","Azure Automation","Azure Functions"],"cor":[3],"exp":"Azure Functions enables automation of tasks in a variety of programming languages, billed on a per-execution model. This eliminates the need for polling and scheduled execution in other solutions, which would be billed by the hour, and likely more expensive.","ref":"","imgs":[],"eimgs":[],"t":"mc"},{"q":"Which Azure service would you use to correlate events from multiple Azure resources in a central repository? (choose the best answer)","opts":["Azure Data Lake","Azure Log Analytics","Azure Event Grid","Azure Event Hub"],"cor":[1],"exp":"","ref":"","imgs":[],"eimgs":[],"t":"mc"},{"q":"An ______ protects against datacenter-level failures.","opts":["Availability Set","Availability Zone","VM scale set","Azure VM"],"cor":[1],"exp":"","ref":"","imgs":[],"eimgs":[],"t":"mc"},{"q":"Contoso has messages from a variety of sources (many Azure services) that need to be relayed to an application. Which Azure service would be best suited to the task?","opts":["Azure Functions","Azure Event Grid","Azure IoT Hub","Azure Service Bus"],"cor":[1],"exp":"","ref":"","imgs":[],"eimgs":[],"t":"mc"},{"q":"You can monitor health and availability of your Azure Kubernetes Service (AKS) cluster with:","opts":["Azure Monitor","Azure App Insights","Microsoft Sentinel","Microsoft Defender for Cloud"],"cor":[0],"exp":"","ref":"","imgs":[],"eimgs":[],"t":"mc"},{"q":"Which storage tier in Azure Storage delivers the highest cost of data storage?","opts":["Hot","Cool","Cold","Archive"],"cor":[0],"exp":"","ref":"","imgs":[],"eimgs":[],"t":"mc"},{"q":"To retire some aging on-premises servers, Contoso is planning to move several SQL databases to Azure SQL Database. The CIO has asked for a tool to estimate the cost of hosting these resources in Azure. Sally suggests using the Azure Pricing Calculator to estimate costs prior to migration. Does Sally's solution meet the solution criteria?","opts":["YES","NO"],"cor":[0],"exp":"","ref":"","imgs":[],"eimgs":[],"t":"mc"},{"q":"Which storage tier in Azure Storage delivers the lowest cost of data storage?","opts":["Hot","Cool","Cold","Archive"],"cor":[3],"exp":"","ref":"","imgs":[],"eimgs":[],"t":"mc"},{"q":"You have a mobile application that exchanges large numbers of messages with customer devices. Which type of Azure storage is optimized for storing large numbers of messages, accessible from anywhere via authenticated HTTP or HTTPS calls?","opts":["Blob Storage","Queue Storage","Table Storage","File Storage"],"cor":[1],"exp":"","ref":"","imgs":[],"eimgs":[],"t":"mc"},{"q":"Contoso's Security team wants to apply policy-based configuration across deployments in multiple Azure subscriptions. Which of the following can help achieve this requirement?","opts":["Resource Groups","Management Groups","Role Based Access Control (RBAC)","Access Policies"],"cor":[1],"exp":"","ref":"","imgs":[],"eimgs":[],"t":"mc"},{"q":"Contoso plans to implement a hybrid cloud architecture utilizing Azure. They need to connect on-premises application resources. The solution should minimize latency and maximize security. Which option should they choose?","opts":["Point-to-Site VPN","Site-to-Site VPN","ExpressRoute","Azure Application Gateway"],"cor":[2],"exp":"","ref":"","imgs":[],"eimgs":[],"t":"mc"},{"q":"As part of a hybrid cloud deployment at Contoso, you need to connect Contoso's on-premises datacenter to Azure. The solution you choose should minimize expense during the low-scale pilot deployment. Which option will you choose?","opts":["Point-to-Site VPN","Site-to-Site VPN","ExpressRoute","Azure Application Gateway"],"cor":[1],"exp":"","ref":"","imgs":[],"eimgs":[],"t":"mc"},{"q":"For regulatory compliance, you need to ensure Contoso's corporate web apps use TLS 1.2 for encryption. Does Azure App Service support enforcing this specific requirement?","opts":["YES","NO"],"cor":[0],"exp":"","ref":"","imgs":[],"eimgs":[],"t":"mc"},{"q":"Contoso wants to migrate a legacy application to Azure that requires an file share accessible on a UNC path. You need to provide an SMB file share and secure access. The solution should minimize administrative effort. Which service will you use?","opts":["OneDrive","SharePoint","Azure VM with a file share","Azure Files"],"cor":[3],"exp":"","ref":"","imgs":[],"eimgs":[],"t":"mc"},{"q":"Storage for Azure VMs is hosted in which Azure Storage type?","opts":["File","Table","Disk","Blob"],"cor":[2],"exp":"","ref":"","imgs":[],"eimgs":[],"t":"mc"},{"q":"Contoso IT wants to configure separate Azure subscriptions for different environments (production, development, test) and products. Can they associate multiple Azure subscriptions to the same Entra ID tenant?","opts":["YES","NO"],"cor":[0],"exp":"","ref":"","imgs":[],"eimgs":[],"t":"mc"},{"q":"Contoso Financial Services regularly creates documents containing sensitive customer data, including personally identifiable information. You need to ensure access is restricted to finance personnel, regardless of where the document travels. Which service should you use to classify and protect these documents?","opts":["Microsoft Defender for Cloud Apps","Microsoft Defender for Endpoint","Microsoft Purview","Entra ID Conditional Access"],"cor":[2],"exp":"","ref":"","imgs":[],"eimgs":[],"t":"mc"},{"q":"An Azure ______ is a set of datacenters deployed within a latency-defined perimeter and connected through a dedicated regional low-latency network.","opts":["Availability Zone","Region","Geography","Datacenter"],"cor":[1],"exp":"","ref":"","imgs":[],"eimgs":[],"t":"mc"},{"q":"Which Azure storage redundancy option does Microsoft recommend for maximum redundancy and recoverability?","opts":["Locally Redundant Storage (LRS)","Geo-Redundant Storage (GRS)","Zone Redundant Storage (ZRS)","Geo Zone Redundant Storage (GZRS)"],"cor":[3],"exp":"","ref":"","imgs":[],"eimgs":[],"t":"mc"},{"q":"An ______ protects against VM failures due to failures in updates, power, or network connectivity.","opts":["Availability Set","Availability Zone","VM scale set","Azure VM"],"cor":[0],"exp":"","ref":"","imgs":[],"eimgs":[],"t":"mc"},{"q":"You need to manage your Azure VMs using the Azure portal. Which URL would you use to manage the Azure VMs?","opts":["https://portal.azurewebsites.net","https://portal.microsoft.com","https://portal.azure.microsoft.com","https://portal.azure.com"],"cor":[3],"exp":"","ref":"","imgs":[],"eimgs":[],"t":"mc"},{"q":"Contoso IT wants to develop modern application components using a serverless architecture. Which Azure service is best for hosting code as part of a services infrastructure?","opts":["Azure Logic Apps","Azure Functions","Azure Service Bus","Azure Automation"],"cor":[1],"exp":"","ref":"","imgs":[],"eimgs":[],"t":"mc"},{"q":"You can monitor health and performance of microservices applications running on Azure Kubernetes Service (AKS) with:","opts":["Azure Monitor","Azure App Insights","Azure Sentinel","Microsoft Defender for Cloud"],"cor":[1],"exp":"","ref":"","imgs":[],"eimgs":[],"t":"mc"},{"q":"You need to store unstructured data, such as images, video files, social media posts on Azure Storage. Which type of Azure Storage is optimized for storage of large amounts of unstructured data?","opts":["Table Storage","Queue Storage","Disk Storage","Blob Storage"],"cor":[3],"exp":"","ref":"","imgs":[],"eimgs":[],"t":"mc"},{"q":"Contoso IT has deployed a group of Azure VMs for hosting production. They want best practices recommendations for high availability of their VM resources. Will the Azure Advisor tool provide recommendations for these existing resources?","opts":["YES","NO"],"cor":[0],"exp":"","ref":"","imgs":[],"eimgs":[],"t":"mc"},{"q":"The Contoso IT Operations team needs to monitor their customer-facing web apps for performance anomalies. Which Azure service will best fulfill this need?","opts":["Azure WebJobs","Azure Application Insights","Azure Automation","Azure Sentinel"],"cor":[1],"exp":"","ref":"","imgs":[],"eimgs":[],"t":"mc"},{"q":"You need to automate responses to some alerts from Azure Monitor. Which service supports automating responses and corrective actions in this scenario?","opts":["Power Automate","Azure Logic Apps","Azure Web Jobs","Azure Automation"],"cor":[3],"exp":"","ref":"","imgs":[],"eimgs":[],"t":"mc"},{"q":"The Contoso IT Operations team needs to aggregate events from a large number of resources hosted in Azure for correlation, alerting, and reporting. Which Azure service would you use to centrally collect, store, and act on events?","opts":["Azure App Insights","Azure Monitor","Azure Data Lake","Azure Event Hub"],"cor":[1],"exp":"","ref":"","imgs":[],"eimgs":[],"t":"mc"},{"q":"You need to alert on service failures in your Azure services, such as web app instances hosted in App Service, and Azure VMs that stop running for any reason. Which tool should you use?","opts":["Azure App Insights","Azure Log Analytics","Azure Monitor","Microsoft Defender for Cloud"],"cor":[2],"exp":"","ref":"","imgs":[],"eimgs":[],"t":"mc"},{"q":"You can find recommendations for security best practices security configuration for Azure Kubernetes Service (AKS) with:","opts":["Azure Monitor","Azure App Insights","Microsoft Sentinel","Microsoft Defender for Cloud"],"cor":[3],"exp":"","ref":"","imgs":[],"eimgs":[],"t":"mc"},{"q":"Azure VMs in different virtual networks can communicate by default","opts":["TRUE","FALSE"],"cor":[1],"exp":"","ref":"","imgs":[],"eimgs":[],"t":"mc"},{"q":"Which Microsoft solution provides support for passwordless authentication on Windows 10 and 11 systems?","opts":["Entra ID Conditional Access","Microsoft Authenticator","Windows Hello for Business","Microsoft Purview"],"cor":[2],"exp":"","ref":"","imgs":[],"eimgs":[],"t":"mc"},{"q":"You have deployed an Azure VM hosting a line-of-business web application. You need to provide access to the application over the Internet via HTTP/S. You add a security rule to the Network Security Group (NSG) to allow inbound traffic from the Internet. Does this solution meet the requirement?","opts":["YES","NO"],"cor":[0],"exp":"","ref":"","imgs":[],"eimgs":[],"t":"mc"},{"q":"Contoso IT has deployed multiple Azure VM across 15 virtual networks. How can you most securely limit inbound traffic and protect these VMs from unwanted inbound requests? (choose the best answer)","opts":["Create a network security group (NSG)","Deploy an Azure Firewall","Deploy an Azure Load Balancer","Deploy a  virtual network gateway"],"cor":[1],"exp":"","ref":"","imgs":[],"eimgs":[],"t":"mc"},{"q":"You need to define and enforce corporate standards for new and existing Azure resource deployments in all of Contoso's Azure subscriptions. What should you use to meet this objective?","opts":["Azure Policy","Microsoft Defender for Cloud","Microsoft Sentinel","Azure Advisor"],"cor":[0],"exp":"","ref":"","imgs":[],"eimgs":[],"t":"mc"},{"q":"Tailspin Toys relies heavily on Entra ID for cloud identity. They want to more effectively protect their identities from external threats. Which service should they choose?","opts":["Azure Identity Protection","Microsoft Defender for Endpoint","Azure DDoS","Microsoft Information Protection"],"cor":[0],"exp":"","ref":"","imgs":[],"eimgs":[],"t":"mc"},{"q":"In a Site-to-Site VPN, the____ is the cross-premises gateway that connects your Azure Virtual Network with your on-premises VPN appliances","opts":["Azure Application Gateway","Azure Virtual Network Gateway","Local Network Gateway","Private Endpoint"],"cor":[1],"exp":"","ref":"","imgs":[],"eimgs":[],"t":"mc"},{"q":"You need to prevent accidental deletion of Azure resources in your subscription. Which feature will meet this requirement? (choose the best answer)","opts":["RBAC","Resource Locks","Security groups","Azure policies"],"cor":[1],"exp":"","ref":"","imgs":[],"eimgs":[],"t":"mc"},{"q":"You are responsible for creating Azure resources at Contoso using ARM templates. You need to ensure Azure resources are only created in approved regions. What should you use to enforce this requirement","opts":["Azure locks","Azure Policy","Azure Blueprint","Microsoft Defender for Cloud"],"cor":[1],"exp":"","ref":"","imgs":[],"eimgs":[],"t":"mc"},{"q":"Contoso IT assigns permissions at the resource group level for all resources deployed to Azure. Will resources in the resource group inherit permissions assigned to the resource group?","opts":["YES","NO"],"cor":[0],"exp":"","ref":"","imgs":[],"eimgs":[],"t":"mc"},{"q":"Contoso has implemented a hybrid, synchronized identity model, consisting of on-premises Active Directory and Entra ID. They want to more effectively protect their on-premises identities from external threats. Which service should they choose?","opts":["Azure Identity Protection","Microsoft Defender for Endpoint","Azure DDoS","Microsoft Information Protection"],"cor":[1],"exp":"","ref":"","imgs":[],"eimgs":[],"t":"mc"},{"q":"You need to implement multi-factor authentication for your Entra ID users. However, you only want to prompt for an additional authentication factor when users are not in a trusted location on an unmanaged device. Which feature should you implement? (choose the best answer)","opts":["Microsoft Purview","Identity Protection","Conditional Access","Privileged Identity Management"],"cor":[2],"exp":"","ref":"","imgs":[],"eimgs":[],"t":"mc"},{"q":"The Contoso Security team has implemented a new security policy. When users connect from an outside corporate offices, they must be prompted for MFA. Which feature will you implement?","opts":["Entra ID Privileged Identity Management","One Time Passwords (OTP)","Entra ID Identity Protection","Entra ID Conditional Access"],"cor":[3],"exp":"","ref":"","imgs":[],"eimgs":[],"t":"mc"},{"q":"You need to support OATH tokens (one-time password) as a second authentication factor for Entra ID. What Microsoft solution enables use of OATH tokens for Entra ID and other identity providers?","opts":["Entra ID Identity Protection","Microsoft Authenticator","Conditional Access","Entra ID Multi-Factor Authentication"],"cor":[1],"exp":"","ref":"","imgs":[],"eimgs":[],"t":"mc"},{"q":"The Contoso Legal Department has asked Contoso IT to verify whether the Contoso's Azure environment meets regulatory requirements. Which service should you use to answer this question?","opts":["Azure Advisor","Microsoft Defender for Cloud","Microsoft Purview","Azure Policy"],"cor":[1],"exp":"","ref":"","imgs":[],"eimgs":[],"t":"mc"},{"q":"What are the three foundational principles of Zero Trust?","opts":["1) Verify explicitly 2) Use least privilege access 3) Assume breach","1) Verify explicitly 2) Use defense in depth 3) Assume breach","1) Verify explicitly 2) Trust but verify 3) Assume breach","1) Verify explicitly 2) Use least privilege access 3) Trust must be earned"],"cor":[0],"exp":"","ref":"","imgs":[],"eimgs":[],"t":"mc"},{"q":"Contoso Electronics is a global retailer. The Contoso Cloud Architecture team needs to simplify deployments of new environments in Azure, including Azure Resource Manager (ARM) templates , role-based access, and policies.\n\nWhich Azure service enables delivery of templates for repeatable deployment and configuration of new subscriptions and environments? (choose the best answer)","opts":["Azure Policy initiatives","Azure Policy","ARM templates","Azure Blueprints"],"cor":[3],"exp":"","ref":"","imgs":[],"eimgs":[],"t":"mc"},{"q":"Your company is planning to host services in Azure. You want to leverage identities in Entra ID, but still need to support on-premises identities in Active Directory. Can you support single sign-on (SSO) and multi-factor authentication for both on-premises and cloud with Entra ID?","opts":["YES","NO"],"cor":[0],"exp":"This is possible by synchronizing identities between Entra ID and on-premises Active Directory with the Entra ID Cloud Sync feature.","ref":"","imgs":[],"eimgs":[],"t":"mc"},{"q":"You need to configure access to Office 365 resources for users at Contoso. To group users for assignment of permissions, which of the following options would you use?","opts":["Microsoft 365 group","Resource group","Security group","Management group"],"cor":[2],"exp":"","ref":"","imgs":[],"eimgs":[],"t":"mc"},{"q":"Implementing Azure MFA (multi-factor authentication) will ensure we know who the user is who they claim to be. This is an example of:","opts":["Authorization","Authentication","Integrity","Confidentiality"],"cor":[1],"exp":"","ref":"","imgs":[],"eimgs":[],"t":"mc"},{"q":"You need to ensure on-premises file shares and Azure Files remain in sync in both directions, regardless of where the file was changed. Which tool or service would you choose? (choose the best answer)","opts":["AzCopy","Azure Storage Explorer","Azure File Sync","Azure Data Box"],"cor":[2],"exp":"","ref":"","imgs":[],"eimgs":[],"t":"mc"},{"q":"Contoso's Security team wants to implement selective use of multi-factor authentication (MFA) based on multiple factors related to the authentication request, such as device health and sign-in risk. Which services should they implement?","opts":["Conditional Access and Identity Protection","Identity Protection and Entitlement Management","Multi-Factor Authentication (MFA) and Identity Protection","Windows Hello for Business and Conditional Access"],"cor":[0],"exp":"","ref":"","imgs":[],"eimgs":[],"t":"mc"},{"q":"Contoso has deployed resources across multiple Azure regions for multiple business units. They have a requirement to generate cost and chargeback reporting to track the Azure costs to be charged back to each business unit. Which Azure feature should they use to simplify this task?","opts":["Tags","Resource Locks","Resource Groups","Management Groups"],"cor":[0],"exp":"","ref":"","imgs":[],"eimgs":[],"t":"mc"},{"q":"You need to identify and enforce Contoso's corporate standards across new and existing Azure deployments. Which service would you choose to achieve this requirement? (choose the best answer)","opts":["Azure Blueprints","Azure Policy","Azure Resource Manager (ARM) templates","Azure Automation"],"cor":[1],"exp":"","ref":"","imgs":[],"eimgs":[],"t":"mc"},{"q":"Using role based access control (RBAC) in Azure, we can determine which resources and services a user has access to. This is an example of:","opts":["Authorization","Authentication","Integrity","Confidentiality"],"cor":[0],"exp":"","ref":"","imgs":[],"eimgs":[],"t":"mc"},{"q":"Azure China and Azure Government are examples of:","opts":["Private clouds","Sovereign regions","Azure geographies","Management groups"],"cor":[1],"exp":"","ref":"","imgs":[],"eimgs":[],"t":"mc"},{"q":"You need to ensure no one (including administrators) can create additional resources in a Azure resource group. What will you do to achieve this objective?","opts":["Azure Policy","Role based access control (RBAC)","Resource locks","Microsoft Defender for Cloud"],"cor":[2],"exp":"","ref":"","imgs":[],"eimgs":[],"t":"mc"},{"q":"Which of the following describes authentication?","opts":["Determines which resources you can access","Defines the services and regions you can access","Validates that a user is who they claim to be","Establishes your resource access"],"cor":[2],"exp":"","ref":"","imgs":[],"eimgs":[],"t":"mc"},{"q":"You need to track resource consumption by application and department for cost tracking and chargeback. Which of the following will enable this capability.","opts":["Azure Monitor","Tags","Azure","Management Groups"],"cor":[1],"exp":"","ref":"","imgs":[],"eimgs":[],"t":"mc"},{"q":"You need to automate movement of multiple files to a storage account. What command line tool can you use to script copying blobs or files to or from your storage account? (choose the best answer)","opts":["Azure File Sync","Azure Storage Explorer","AzCopy","Azure Data Box"],"cor":[2],"exp":"","ref":"","imgs":[],"eimgs":[],"t":"mc"},{"q":"Which Azure storage redundancy option would you select for development workloads where minimizing expense is the highest priority?","opts":["Zone Redundant Storage (ZRS)","Geo-Redundant Storage (GRS)","Geo-Zone Redundant Storage (GZRS)","Locally Redundant Storage (LRS)"],"cor":[3],"exp":"","ref":"","imgs":[],"eimgs":[],"t":"mc"},{"q":"Contoso needs Azure capacity to support spikes in request traffic to their load-balanced web farm during the holiday shopping season. A consultant recommends deploying the website to a virtual machine scale set in Azure. Will this meet the requirement?","opts":["YES","NO"],"cor":[0],"exp":"Virtual machine scale sets allow you to create and manage a group of identical, load-balanced VMs. The number of VM instances can automatically increase or decrease in response to demand or based on a schedule.","ref":"","imgs":[],"eimgs":[],"t":"mc"},{"q":"Which type of Azure storage stores NoSQL data in Azure, including a schemaless key/attribute store?","opts":["Queue Storage","Table Storage","Blob Storage","File Storage"],"cor":[1],"exp":"","ref":"","imgs":[],"eimgs":[],"t":"mc"},{"q":"You need to identify deviations from Microsoft security best practices in your Azure cloud infrastructure. Which service should you use?","opts":["Azure Advisor","Microsoft Defender for Cloud","Azure Monitor","Azure Key Vault"],"cor":[1],"exp":"","ref":"","imgs":[],"eimgs":[],"t":"mc"},{"q":"Contoso IT is planning to migrate all on-premises data to Azure. The Legal Department has asked for verification that Azure complies with Contoso's regulatory obligations, such as HIPAA and PCI DSS. Which Azure service can be used to monitor for regulatory compliance?","opts":["Azure App Insights","Azure Advisor","Azure Monitor","Microsoft Defender for Cloud"],"cor":[3],"exp":"Microsoft Defender for Cloud includes baselines for a large number of regulatory compliance standards, including HIPAA and PCI DSS.","ref":"","imgs":[],"eimgs":[],"t":"mc"},{"q":"You need to calculate the estimated cost of a set of Azure resources before you deploy them. Which service or tool will you use?","opts":["Azure Advisor","Azure Pricing Calculator","Azure Cost Management","Azure TCO Calculator"],"cor":[1],"exp":"","ref":"","imgs":[],"eimgs":[],"t":"mc"},{"q":"As part of a migration of on-premises VM workloads to Azure VMs, Contoso wants to minimize costs. Since the VMs will be running in Azure for an extended period of time (years), what option should they consider to reduce hosting costs?","opts":["Azure Cost Management","Azure Reservations","Azure Advisor","VM Scale Sets"],"cor":[1],"exp":"","ref":"","imgs":[],"eimgs":[],"t":"mc"},{"q":"A ______ is a virtual network gateway that sends encrypted traffic between an Azure VNET and an on-premises location over the Internet","opts":["App gateway","Web proxy","VPN gateway","Private endpoint"],"cor":[2],"exp":"","ref":"","imgs":[],"eimgs":[],"t":"mc"},{"q":"Contoso IT Operations has been tasked with providing recommendations on how to reducing cost of running Azure VMs. Which service should they use to gather recommendations?","opts":["Microsoft Defender for Cloud","Azure Advisor","Azure Monitor","Azure App Insights"],"cor":[1],"exp":"","ref":"","imgs":[],"eimgs":[],"t":"mc"},{"q":"Contoso is planning to move several on-premises services to Azure PaaS and IaaS solutions. The CIO has asked for a tool to estimate the cost of hosting these resources in Azure. Tom suggests Azure Cost Management to estimate costs prior to migration. Does Tom's solution meet the solution criteria?","opts":["YES","NO"],"cor":[1],"exp":"","ref":"","imgs":[],"eimgs":[],"t":"mc"},{"q":"To manage service lifecycle with more granularity, Contoso cloud architects have designed a model that involves a large number of resource groups. Will Contoso incur additional costs for the resources groups?","opts":["YES","NO"],"cor":[1],"exp":"","ref":"","imgs":[],"eimgs":[],"t":"mc"},{"q":"You plan to deploy several Azure VMs. The applications running on these VMs should remain available if a single Azure datacenter fails. You opt to deploy VMs to multiple availability zones. Does your solution meet the solution criteria?","opts":["YES","NO"],"cor":[0],"exp":"","ref":"","imgs":[],"eimgs":[],"t":"mc"},{"q":"Contoso IT has deployed a group of VMs in Azure. They want to identify recommendations on how to reduce the cost of running these VMs. Which tool should they use? (choose the best answer)","opts":["Azure Price Calculator","Azure Advisor","Azure Cost Management","Microsoft Defender for Cloud"],"cor":[1],"exp":"","ref":"","imgs":[],"eimgs":[],"t":"mc"},{"q":"Azure App Service supports which of the following application type(s)?","opts":["Web apps","Mobile apps","API apps","All the above"],"cor":[3],"exp":"","ref":"","imgs":[],"eimgs":[],"t":"mc"},{"q":"Which virtual machine configuration supports a more resilient, highly available environment by staggering VM updates and ensuring varied power and network connectivity?","opts":["Virtual machine scale sets","Virtual machine availability sets","virtual cluster","Azure Virtual Desktop"],"cor":[1],"exp":"","ref":"","imgs":[],"eimgs":[],"t":"mc"},{"q":"Tailspin Toys uses a pay-as-you-go (PAYG) subscription in Azure. PAYG generally provides lowest cost over time, but least flexibility in terms of shifting consumption to new services.","opts":["TRUE","FALSE"],"cor":[1],"exp":"","ref":"","imgs":[],"eimgs":[],"t":"mc"},{"q":"Azure Container Instances enable running containers without host servers to manage.","opts":["YES","NO"],"cor":[0],"exp":"","ref":"","imgs":[],"eimgs":[],"t":"mc"},{"q":"Azure Container Instances enable elastic bursting  for Azure Kubernetes Service","opts":["YES","NO"],"cor":[0],"exp":"","ref":"","imgs":[],"eimgs":[],"t":"mc"},{"q":"Azure VMs in different subnets in the same virtual network can communicate by default","opts":["YES","NO"],"cor":[0],"exp":"","ref":"","imgs":[],"eimgs":[],"t":"mc"},{"q":"Azure DDoS, which protects your Azure resources against distributed denial of services attacks, includes both a Basic and Standard tiers.","opts":["YES","NO"],"cor":[0],"exp":"","ref":"","imgs":[],"eimgs":[],"t":"mc"},{"q":"Your company intends to subscribe to an Azure support plan.\nThe support plan must allow for new support requests to be opened.\n\nWhich of the following are support plans that will allow this? Answer by dragging the correct option from the list to the answer area.","opts":[],"cor":[],"exp":"","ref":"https://azure.microsoft.com/en-us/support/plans/","imgs":["https://free-braindumps.com/images/exam-prep/AZ-900/f5c6534b-44fa-4fc2-8c2a-08bdbc5e2474.jpg"],"eimgs":["https://free-braindumps.com/images/exam-prep/AZ-900/c2918640-8668-465c-ab03-6653ac0ba0ee.jpg"],"t":"img"},{"q":"Your company has datacenters in Los Angeles and New York. The company has a Microsoft Azure subscription.\n\nYou are configuring the two datacenters as geo-clustered sites for site resiliency. You need to recommend an Azure storage redundancy option.\nYou have the following data storage requirements:\n\n-Data must be stored on multiple nodes.\n-Data must be stored on nodes in separate geographic locations.\n-Data can be read from the secondary location as well as from the primary location \n\nWhich of the following Azure stored redundancy options should you recommend?","opts":["Geo-redundant storage","Read-only geo-redundant storage","Zone-redundant storage","Locally redundant storage"],"cor":[1],"exp":"RA-GRS allows you to have higher read availability for your storage account by providing “read only” access to the data replicated to the secondary location. Once you enable this feature, the secondary location may be used to achieve higher availability in the event the data is not available in the primary region. This is an “opt-in” feature which requires the storage account be geo-replicated.","ref":"https://docs.microsoft.com/en-us/azure/storage/common/storage-redundancy\nhttps://docs.microsoft.com/en-us/azure/storage/common/storage-redundancy-grs#read-access-geo-redundant-storage","imgs":[],"eimgs":[],"t":"mc"},{"q":"Your company’s Azure subscription includes a Basic support plan.\nThey would like to request an assessment of an Azure environment’s design from Microsoft. This is, however, not supported by the existing plan.\n\nYou want to make sure that the company subscribes to a support plan that allows this functionality, while keeping expenses to a minimum.\n\nSolution: You recommend that the company subscribes to the Premier support plan. Does the solution meet the goal?","opts":["Yes","No"],"cor":[1],"exp":"","ref":"https://azure.microsoft.com/en-gb/support/plans/","imgs":[],"eimgs":[],"t":"mc"},{"q":"You are tasked with deploying Azure virtual machines for your company. You need to make use of the appropriate cloud deployment solution.\n\nSolution: You should make use of Software as a Service (SaaS). \nDoes the solution meet the goal?","opts":["Yes","No"],"cor":[1],"exp":"","ref":"","imgs":[],"eimgs":[],"t":"mc"},{"q":"Your developers have created 10 web applications that must be host on Azure.\nYou need to determine which Azure web tier plan to host the web apps. The web tier plan must meet the following requirements:\n\n-The web apps will use custom domains.\n-The web apps each require 10 GB of storage.\n-The web apps must each run in dedicated compute instances. \n-Load balancing between instances must be included.\n-Costs must be minimized.\n\nWhich web tier plan should you use?","opts":["Standard","Basic","Free","Shared"],"cor":[0],"exp":"","ref":"","imgs":[],"eimgs":[],"t":"mc"},{"q":"You are planning to migrate a company to Azure. Each of the company’s numerous divisions will have an administrator in place to manage the Azure resources used by their respective division.\n\nYou want to make sure that the Azure deployment you employ allows for Azure to be segmented for the divisions, while keeping administrative effort to a minimum.\n\nSolution: You plan to make use of several Azure Active Directory (Azure AD) directories. Does the solution meet the goal?","opts":["Yes","No"],"cor":[1],"exp":"","ref":"","imgs":[],"eimgs":[],"t":"mc"},{"q":"Your developers have created a portal web app for users in the Miami branch office. The web app will be publicly accessible and used by the Miami users to retrieve customer and product information. The web app is currently running in an on-premises test environment.\n\nYou plan to host the web app on Azure.\n\nYou need to determine which Azure web tier plan to host the web app. The web tier plan must meet the following requirements:\n\nThe website will use the miami.weyland.com URL. The website will be deployed to two instances.\nSSL support must be included.\nThe website requires 12 GB of storage. Costs must be minimized.\n\nWhich web tier plan should you use?","opts":["Standard","Basic","Free","Shared"],"cor":[0],"exp":"","ref":"http://azure.microsoft.com/en-us/documentation/articles/azure-subscription-service-limits/","imgs":[],"eimgs":[],"t":"mc"},{"q":"Your company is planning to migrate all their virtual machines to an Azure pay-as-you-go subscription. The virtual machines are currently hosted on the Hyper-V hosts in a data center.\n\nYou are required make sure that the intended Azure solution uses the correct expenditure model. Solution: You should recommend the use of the elastic expenditure model.\nDoes the solution meet the goal?","opts":["Yes","No"],"cor":[1],"exp":"","ref":"","imgs":[],"eimgs":[],"t":"mc"},{"q":"You are required to deploy an Artificial Intelligence (AI) solution in Azure.\nYou want to make sure that you are able to build, test, and deploy predictive analytics for the solution. \n\nSolution: You should make use of Azure Cosmos DB. \nDoes the solution meet the goal?","opts":["Yes","No"],"cor":[1],"exp":"","ref":"","imgs":[],"eimgs":[],"t":"mc"},{"q":"Your company’s Active Directory forest includes thousands of user accounts.\nYou have been informed that all network resources will be migrated to Azure. Thereafter, the on-premises data center will be retired.\n\nYou are required to employ a strategy that reduces the effect on users, once the planned migration has been completed.\n\nSolution: You plan to sync all the Active Directory user accounts to Azure Active Directory (Azure AD). Does the solution meet the goal?","opts":["Yes","No"],"cor":[0],"exp":"","ref":"","imgs":[],"eimgs":[],"t":"mc"},{"q":"Your company’s infrastructure includes a number of business units that each need a large number of various Azure resources for everyday operation.\n\nThe resources required by each business unit are identical.\nYou are required to sanction a strategy to create Azure resources automatically.\n\nSolution: You recommend that the Azure API Management service be included in the strategy. Does the solution meet the goal?","opts":["Yes","No"],"cor":[1],"exp":"","ref":"","imgs":[],"eimgs":[],"t":"mc"},{"q":"You are tasked with deploying a critical LOB application, which will be installed on a virtual machine, to Azure.\n\nYou are informed that the application deployment strategy should allow for a guaranteed availability of 99.99 percent. You need to make sure that the strategy requires as little virtual machines and availability zones as possible.\n\nSolution: You include two virtual machines and one availability zone in your strategy. Does the solution meet the goal?","opts":["Yes","No"],"cor":[1],"exp":"","ref":"https://docs.microsoft.com/en-us/azure/availability-zones/az-overview","imgs":[],"eimgs":[],"t":"mc"},{"q":"Your company’s developers intend to deploy a large number of custom virtual machines on a weekly basis. They will also be removing these virtual machines during the same week it was deployed. Sixty percent of the virtual machines have Windows Server 2016 installed, while the other forty percent has Ubuntu Linux installed.\n\nYou are required to make sure that the administrative effort, needed for this process, is reduced by employing a suitable Azure service.\n\nSolution: you recommend the use of Microsoft Managed Desktop. Does the solution meet the goal?","opts":["Yes","No"],"cor":[1],"exp":"","ref":"","imgs":[],"eimgs":[],"t":"mc"},{"q":"Your company has virtual machines (VMs) hosted in Microsoft Azure. The VMs are located in a single Azure virtual network named VNet1.\n\nThe company has users that work remotely. The remote workers require access to the VMs on VNet1. You need to provide access for the remote workers. \nWhat should you do?","opts":["Configure a Site-to-Site (S2S) VPN.","Configure a VNet-toVNet VPN.","Configure a Point-to-Site (P2S) VPN.","Configure DirectAccess on a Windows Server 2012 server VM.","Configure a Multi-Site VPN"],"cor":[2],"exp":"A Point-to-Site (P2S) VPN gateway connection lets you create a secure connection to your virtual network from an individual client computer.","ref":"https://docs.microsoft.com/en-us/azure/vpn-gateway/vpn-gateway-about-vpngateways","imgs":[],"eimgs":[],"t":"mc"},{"q":"You have been informed by your superiors of the company’s intentions to automate server deployment to Azure. There is, however, some concern that administrative credentials could be uncovered during this process.\n\nYou are required to make sure that during the deployment, the administrative credentials are encrypted using a suitable Azure solution.\n\nSolution: You recommend the use of Azure Information Protection. Does the solution meet the goal?","opts":["Yes","No"],"cor":[1],"exp":"","ref":"","imgs":[],"eimgs":[],"t":"mc"},{"q":"The company would like to develop a cloud solution by making use of Azure Government. Azure Government can only be used by certain types of clients to develop cloud solutions.\n\nWhich of the following are the types of customers that can make use of Azure Government in this situation? Answer by dragging the correct option from the list to the answer area.","opts":[],"cor":[],"exp":"","ref":"https://docs.microsoft.com/en-us/learn/modules/intro-to-azure-government/2-what-is-azure-government","imgs":["https://free-braindumps.com/images/exam-prep/AZ-900/a243847f-ade0-404e-ab9b-b88f30eabd6f.jpg"],"eimgs":["https://free-braindumps.com/images/exam-prep/AZ-900/148f001b-3284-495b-bc3c-10d43fbef2e7.jpg"],"t":"img"},{"q":"Your company has an Azure Active Directory (Azure AD) environment. Users occasionally connect to Azure AD via the Internet.\n\nYou have been tasked with making sure that users who connect to Azure AD via the internet from an unidentified IP address, are automatically encouraged to change passwords.\n\nSolution: You configure the use of Azure AD Identity Protection.\nDoes the solution meet the goal?","opts":["Yes","No"],"cor":[0],"exp":"","ref":"https://docs.microsoft.com/en-us/azure/active-directory/identity-protection/howto-sign-in-risk-policy","imgs":[],"eimgs":[],"t":"mc"},{"q":"You are planning a strategy to deploy numerous web servers and database servers to Azure.\nThis strategy should allow for connection types between the web servers and database servers to be controlled.\n\nSolution: You include network security groups (NSGs) in your strategy. Does the solution meet the goal?","opts":["Yes","No"],"cor":[0],"exp":"","ref":"","imgs":[],"eimgs":[],"t":"mc"},{"q":"For each of the following statements, select Yes if the statement is true. Otherwise, select No.\nNOTE: Each correct selection is worth one point.\nHot Area:","opts":[],"cor":[],"exp":"Box 1: No\nA PaaS solution does not provide access to the operating system. The Azure Web Apps service provides an environment for you to host your web applications. Behind the scenes, the web apps are hosted on virtual machines running IIS. However, you have no direct access to the virtual machine, the operating system or IIS.\n\nBox 2: Yes\nA PaaS solution that hosts web apps in Azure does provide the ability to scale the platform automatically. This is known as autoscaling. Behind the scenes, the web apps are hosted on virtual machines running IIS.\nAutoscaling means adding more load balanced virtual machines to host the web apps.\n\nBox 3: Yes\nPaaS provides a framework that developers can build upon to develop or customize cloud-based applications.\nPaaS development tools can cut the time it takes to code new apps with pre-coded application components built into the platform, such as workflow, directory services, security features, search and so on.","ref":"https://azure.microsoft.com/en-gb/overview/what-is-paas/","imgs":["https://free-braindumps.com/images/exam-prep/AZ-900/f9327374-5054-410a-a412-98eff3d21f21.jpg"],"eimgs":["https://free-braindumps.com/images/exam-prep/AZ-900/8ac41d5b-8f02-4000-b0d2-baea74ca3727.jpg"],"t":"img"},{"q":"For each of the following statements, select Yes if the statement is true. Otherwise, select No.\nNOTE: Each correct selection is worth one point.\nHot Area:","opts":[],"cor":[],"exp":"Box 1: Yes\nTraditionally, IT expenses have been considered a Capital Expenditure (CapEx). Today, with the move to thecloud and the pay-as-you-go model, organizations have the ability to stretch their budgets and are shifting theirIT CapEx costs to Operating Expenditures (OpEx) instead. This flexibility, in accounting terms, is now an optiondue to the “as a Service” model of purchasing software, cloud storage and other IT related resources.\n\nBox 2: No\nTwo virtual machines using the same size could have different disk configurations. Therefore, the monthlycosts could be different.\n\nBox 3: Yes\nWhen an Azure virtual machine is stopped, you don’t pay for the virtual machine. However, you do still pay forthe storage costs associated to the virtual machine. The most common storage costs are for the disksattached to the virtual machines. There are also other storage costs associated with a virtual machine such asstorage for diagnostic data and virtual machine backups.","ref":"https://meritsolutions.com/capex-vs-opex-cloud-computing-blog/","imgs":["https://free-braindumps.com/images/exam-prep/AZ-900/d10ef2b4-dd49-4b77-acb4-ac8f7b290e36.jpg"],"eimgs":["https://free-braindumps.com/images/exam-prep/AZ-900/cac0b993-dddb-4f0d-8898-53518f075ecd.jpg"],"t":"img"},{"q":"To complete the sentence, select the appropriate option in the answer area.","opts":[],"cor":[],"exp":"When you are implementing a Software as a Service (SaaS) solution, you are responsible for configuring the SaaS solution. Everything else is managed by the cloud provider.\n\nSaaS requires the least amount of management. The cloud provider is responsible for managing everything, and the end user just uses the software.\n\nSoftware as a service (SaaS) allows users to connect to and use cloud-based apps over the Internet. Common examples are email, calendaring and office tools (such as Microsoft Office 365).\n\nSaaS provides a complete software solution which you purchase on a pay-as-you-go basis from a cloud service provider. You rent the use of an app for your organization and your users connect to it over the Internet, usually with a web browser. All of the underlying infrastructure, middleware, app software and app data are located in the service provider’s data center. The service provider manages the hardware and software and with the appropriate service agreement, will ensure the availability and the security of the app and your data as well.","ref":"https://azure.microsoft.com/en-in/overview/what-is-saas/\nhttps://docs.microsoft.com/en-gb/learn/modules/principles-cloud-computing/5-types-of-cloud-services","imgs":["https://free-braindumps.com/images/exam-prep/AZ-900/9bd014ad-0a2e-4f28-a5a8-9250a098b91e.jpg"],"eimgs":["https://free-braindumps.com/images/exam-prep/AZ-900/e6ea3094-ea09-4584-8683-52ca7b9f0c6d.jpg"],"t":"img"},{"q":"You have an on-premises network that contains several servers. \nYou plan to migrate all the servers to Azure.\nYou need to recommend a solution to ensure that some of the servers are available if a single Azure data center goes offline for an extended period. What should you include in the recommendation?","opts":["fault tolerance","elasticity","scalability","low latency"],"cor":[0],"exp":"Fault tolerance is the ability of a system to continue to function in the event of a failure of some of its components.\nIn this question, you could have servers that are replicated across datacenters.\n\nAvailability zones expand the level of control you have to maintain the availability of the applications and data on your VMs. Availability Zones are unique physical locations within an Azure region. Each zone is made up of one or more datacenters equipped with independent power, cooling, and networking. To ensure resiliency, there are a minimum of three separate zones in all enabled regions. The physical separation of Availability Zones within a region protects applications and data from datacenter failures.\nWith Availability Zones, Azure offers industry best 99.99% VM uptime SLA. By architecting your solutions to use replicated VMs in zones, you can protect your applications and data from the loss of a datacenter. If one zone is compromised, then replicated apps and data are instantly available in another zone.","ref":"https://docs.microsoft.com/en-us/azure/virtual-machines/windows/manage-availability","imgs":[],"eimgs":[],"t":"mc"},{"q":"To complete the sentence, select the appropriate option in the answer area.","opts":[],"cor":[],"exp":"A private cloud is hosted in your datacenter. Therefore, you cannot close your datacenter if you are using a private cloud.\nA public cloud is hosted externally, for example, in Microsoft Azure. An organization that hosts its infrastructure in a public cloud can close its data center.\n\nPublic cloud is the most common deployment model. In this case, you have no local hardware to manage or keep up-to-date – everything runs on your cloud provider's hardware. \nMicrosoft Azure is an example of a public cloud provider.\n\nIn a private cloud, you create a cloud environment in your own datacenter and provide self-service access to compute resources to users in your organization. This offers a simulation of a public cloud to your users, but you remain completely responsible for the purchase and maintenance of the hardware and software services you provide.","ref":"https://docs.microsoft.com/en-gb/learn/modules/principles-cloud-computing/4-cloud-deployment-models","imgs":["https://free-braindumps.com/images/exam-prep/AZ-900/128c9408-ebb7-40ac-8176-5d7d372abef8.jpg"],"eimgs":["https://free-braindumps.com/images/exam-prep/AZ-900/0bf563a2-7644-4e04-b5bb-742f428b3b24.jpg"],"t":"img"},{"q":"What are two characteristics of the public cloud? Each correct answer presents a complete solution.\nNOTE: Each correct selection is worth one point.","opts":["dedicated hardware","unsecured connections","limited storage","metered pricing","self-service management"],"cor":[3,4],"exp":"With the public cloud, you get pay-as-you-go pricing – you pay only for what you use, no CapEx costs.\nWith the public cloud, you have self-service management. You are responsible for the deployment and configuration of the cloud resources such as virtual machines or web sites. The underlying hardware that hosts the cloud resources is managed by the cloud provider.\n\nIncorrect Answers:\nA: You don’t have dedicated hardware. The underlying hardware is shared so you could have multiple customers using cloud resources hosted on the same physical hardware.\nB: Connections to the public cloud are secure.\nC: Storage is not limited. You can have as much storage as you like.","ref":"https://docs.microsoft.com/en-gb/learn/modules/principles-cloud-computing/4-cloud-deployment-models","imgs":[],"eimgs":[],"t":"mc"},{"q":"To complete the sentence, select the appropriate option in the answer area.","opts":[],"cor":[],"exp":"When planning to migrate a public website to Azure, you must plan to pay monthly usage costs. This is because Azure uses the pay-as-you-go model.","ref":"","imgs":["https://free-braindumps.com/images/exam-prep/AZ-900/64e093b8-ac17-4d94-b768-777bdbe58dd5.jpg"],"eimgs":["https://free-braindumps.com/images/exam-prep/AZ-900/0e091a74-1a40-423e-9066-b9c8cf662111.jpg"],"t":"img"},{"q":"Note: This question is part of a series of questions that present the same scenario. Each question in the series contains a unique solution that might meet the stated goals. Some question sets might have more than one correct solution, while others might not have a correct solution.\n\nAfter you answer a question in this section, you will NOT be able to return to it. As a result, these questions will not appear in the review screen.\nYour company plans to migrate all its data and resources to Azure.\n\nThe company’s migration plan states that only platform as a service (PaaS) solutions must be used in Azure. You need to deploy an Azure environment that supports the planned migration.\nSolution: You create an Azure App Service and Azure SQL databases. Does this meet the goal?","opts":["Yes","No"],"cor":[0],"exp":"Azure App Service and Azure SQL databases are examples of Azure PaaS solutions. Therefore, this solution does meet the goal.","ref":"","imgs":[],"eimgs":[],"t":"mc"},{"q":"Your company hosts an accounting named App1 that is used by all the customers of the company. \nApp1 has low usage during the first three weeks of each month and very high usage during the last week of each month. Which benefit of Azure Cloud Services supports cost management for this type of usage pattern?","opts":["high availability","high latency","elasticity","load balancing"],"cor":[2],"exp":"Elasticity in this case is the ability to provide additional compute resource when needed and reduce the compute resource when not needed to reduce costs. Autoscaling is an example of elasticity.\nElastic computing is the ability to quickly expand or decrease computer processing, memory and storage resources to meet changing demands without worrying about capacity planning and engineering for peak usage. Typically controlled by system monitoring tools, elastic computing matches the amount of resources allocated to the amount of resources actually needed without disrupting operations. With cloud elasticity, a company avoids paying for unused capacity or idle resources and doesn’t have to worry about investing in the purchase or maintenance of additional resources and equipment.","ref":"https://azure.microsoft.com/en-gb/overview/what-is-elastic-computing/","imgs":[],"eimgs":[],"t":"mc"},{"q":"You plan to migrate a web application to Azure. The web application is accessed by external users.\nYou need to recommend a cloud deployment solution to minimize the amount of administrative effort used to manage the web application. What should you include in the recommendation?","opts":["software as a service (SaaS)","platform as a service (PaaS)","infrastructure as a service (IaaS)","database as a service (DaaS)"],"cor":[1],"exp":"Azure App Service is a platform-as-a-service (PaaS) offering that lets you create web and mobile apps for any platform or device and connect to data anywhere, in the cloud or on-premises. App Service includes the web and mobile capabilities that were previously delivered separately as Azure Websites and Azure Mobile Services.","ref":"https://docs.microsoft.com/en-us/azure/security/fundamentals/paas-applications-using-app-services","imgs":[],"eimgs":[],"t":"mc"},{"q":"Which cloud deployment solution is used for Azure virtual machines and Azure SQL databases? To answer, select the appropriate options in the answer area.\nNOTE: Each correct selection is worth one point.\nHot Area:","opts":[],"cor":[],"exp":"","ref":"","imgs":["https://free-braindumps.com/images/exam-prep/AZ-900/a3af9626-4c4d-45d2-9800-df555932f96e.jpg"],"eimgs":["https://free-braindumps.com/images/exam-prep/AZ-900/93d4a680-f07f-4d29-bace-3d27ee4322e0.jpg"],"t":"img"},{"q":"You have an on-premises network that contains 100 servers.\nYou need to recommend a solution that provides additional resources to your users. The solution must minimize capital and operational expenditure costs.\nWhat should you include in the recommendation?","opts":["a complete migration to the public cloud","an additional data center","a private cloud","a hybrid cloud"],"cor":[3],"exp":"A hybrid cloud is a combination of a private cloud and a public cloud.\nCapital expenditure is the spending of money up-front for infrastructure such as new servers.\n\nWith a hybrid cloud, you can continue to use the on-premises servers while adding new servers in the public cloud (Azure for example). Adding new servers in Azure minimizes the capital expenditure costs as you are not paying for new servers as you would if you deployed new server on-premises.\n\nIncorrect Answers:\nA: A complete migration of 100 servers to the public cloud would involve a lot of operational expenditure (the cost of migrating all the servers).\nB: An additional data center would involve a lot of capital expenditure (the cost of the new infrastructure).\nC: A private cloud is hosted on on-premises servers to this would involve a lot of capital expenditure (the cost of the new infrastructure to host the private cloud).","ref":"https://docs.microsoft.com/en-gb/learn/modules/principles-cloud-computing/4-cloud-deployment-models","imgs":[],"eimgs":[],"t":"mc"},{"q":"For each of the following statements, select Yes if the statement is true. Otherwise, select No.\nNOTE: Each correct selection is worth one point.\nHot Area:","opts":[],"cor":[],"exp":"Box 1: No\nIt is not true that a company must always migrate from a private cloud model to implement a hybrid cloud. You could start with a public cloud and then combine that with an on-premise infrastructure to implement a hybrid cloud.\n\nBox 2: Yes\nA company can extend the capacity of its internal network by using the public cloud. This is very common. When you need more capacity, rather than pay out for new on-premises infrastructure, you can configure a cloud environment and connect your on-premises network to the cloud environment by using a VPN.\n\nBox 3: No\nIt is not true that only guest users can access cloud resources. You can give anyone with an account in Azure Active Directory access to the cloud resources. There are many authentication scenarios but a common one is to replicate your on-premises Active Directory accounts to Azure Active Directory and provide access to the Azure Active Directory accounts. Another commonly used authentication method is ‘Federation’ where authentication for access to cloud resources is passed to another authentication provider such as an on-premises Active Directory.","ref":"https://azure.microsoft.com/en-gb/overview/what-is-hybrid-cloud-computing/","imgs":["https://free-braindumps.com/images/exam-prep/AZ-900/61f02bf6-e85c-4fad-b4d7-eecfd73d8556.jpg"],"eimgs":["https://free-braindumps.com/images/exam-prep/AZ-900/d5c1028e-4854-41e7-8e90-2f71728e2810.jpg"],"t":"img"},{"q":"You plan to migrate several servers from an on-premises network to Azure.\nYou need to identify the primary benefit of using a public cloud service for the servers. What should you identify?","opts":["The public cloud is owned by the public, NOT a private corporation","The public cloud is a crowd-sourcing solution that provides corporations with the ability to enhance the cloud","All public cloud resources can be freely accessed by every member of the public","The public cloud is a shared entity whereby multiple corporations each use a portion of the resources in the cloud"],"cor":[3],"exp":"The public cloud is a shared entity whereby multiple corporations each use a portion of the resources in the cloud. The hardware resources (servers, infrastructure etc.) are managed by the cloud provider. Multiple companies create resources such as virtual machines and virtual networks on the hardware resources.\n\nIncorrect Answers:\nA: The public cloud is not owned by the public. In the case of Microsoft Azure, the cloud is owned by Microsoft.\nB: The public cloud is a not crowd-sourcing solution. In the case of Microsoft Azure, the cloud is owned by Microsoft.\nC: It is not true that public cloud resources can be freely accessed by every member of the public. You pay for a cloud subscription and create accounts for your users to access your cloud resources. No one can access your cloud resources until you create user accounts and provide the appropriate access permissions.","ref":"","imgs":[],"eimgs":[],"t":"mc"},{"q":"To complete the sentence, select the appropriate option in the answer area.\nHot Area:","opts":[],"cor":[],"exp":"Azure Site Recovery helps ensure business continuity by keeping business apps and workloads running during outages. Site Recovery replicates workloads running on physical and virtual machines (VMs) from a primary site to a secondary location.","ref":"https://docs.microsoft.com/en-us/azure/site-recovery/site-recovery-overview","imgs":["https://free-braindumps.com/images/exam-prep/AZ-900/393d2bd4-7ae6-4095-8ed5-2555ac9466a9.jpg"],"eimgs":["https://free-braindumps.com/images/exam-prep/AZ-900/731cb468-a55f-435d-8bfb-42afd8bdb529.jpg"],"t":"img"},{"q":"In which type of cloud model are all the hardware resources owned by a third-party and shared between multiple tenants?","opts":["private","hybrid","public"],"cor":[2],"exp":"Microsoft Azure, Amazon Web Services and Google Cloud are three examples of public cloud services. Microsoft, Amazon and Google own the hardware. The tenants are the customers who use the public cloud services.","ref":"","imgs":[],"eimgs":[],"t":"mc"},{"q":"You have 1,000 virtual machines hosted on the Hyper-V hosts in a data center.\nYou plan to migrate all the virtual machines to an Azure pay-as-you-go subscription. \nYou need to identify which expenditure model to use for the planned Azure solution. \nWhich expenditure model should you identify?","opts":["operational","elastic","capital","scalable"],"cor":[0],"exp":"One of the major changes that you will face when you move from on-premises cloud to the public cloud is the switch from capital expenditure (buying hardware) to operating expenditure (paying for service as you use it). This switch also requires more careful management of your costs. The benefit of the cloud is that you can fundamentally and positively affect the cost of a service you use by merely shutting down or resizing it when it's not needed.","ref":"https://docs.microsoft.com/en-us/azure/architecture/cloud-adoption/appendix/azure-scaffold","imgs":[],"eimgs":[],"t":"mc"},{"q":"Match the Azure Cloud Services benefit to the correct description.\n\nInstructions: To answer, drag the appropriate benefit from the column on the left to its description on the right. Each benefit may be used once, more than once, or not at all.\n\nNOTE: Each correct match is worth one point.\nSelect and Place:","opts":[],"cor":[],"exp":"Box 1:\nFault tolerance is the ability of a service to remain available after a failure of one of the components of the service. For example, a service running on multiple servers can withstand the failure of one of the servers.\n\nBox 2:\nDisaster recovery is the recovery of a service after a failure. For example, restoring a virtual machine from backup after a virtual machine failure.\n\nBox 3:\nDynamic scalability is the ability for compute resources to be added to a service when the service is under heavy load. For example, in a virtual machine scale set, additional instances of the virtual machine are added when the existing virtual machines are under heavy load.\n\nBox 4:\nLatency is the time a service to respond to requests. For example, the time it takes for a web page to be returned from a web server. Low latency means low response time which means a quicker response.","ref":"https://msdn.microsoft.com/en-us/magazine/mt422582.aspx\nhttps://searchdisasterrecovery.techtarget.com/definition/cloud-disaster-recovery-cloud-DR\nhttp://www.siasmsp.com/the-benefit-of-scalability-in-cloud-computing-2/\nhttps://azure.microsoft.com/en-in/overview/what-is-cloud-computing/","imgs":["https://free-braindumps.com/images/exam-prep/AZ-900/c2961fcf-7176-4d66-a1bb-a8eb74d55689.jpg"],"eimgs":["https://free-braindumps.com/images/exam-prep/AZ-900/9f163218-1a75-40b3-b65e-6b13b599a597.jpg"],"t":"img"},{"q":"For each of the following statements, select Yes if the statement is true. Otherwise, select No.\nNOTE: Each correct selection is worth one point.\nHot Area:","opts":[],"cor":[],"exp":"Box 1: No\nIt is not true that a company must always migrate from a private cloud model to implement a hybrid cloud. You could start with a public cloud and then combine that with an on-premise infrastructure to implement a hybrid cloud.\n\nBox 2: Yes\nA company can extend the computing resources of its internal network by using the public cloud. This is very common. When you need more resources, rather than pay out for new on-premises infrastructure, you can configure a cloud environment and connect your on-premises network to the cloud environment by using a VPN.\n\nBox 3: No\nIt is not true that only guest users can access cloud resources. You can give anyone with an account in Azure Active Directory access to the cloud resources. There are many authentication scenarios but a common one is to replicate your on-premises Active Directory accounts to Azure Active Directory and provide access to the Azure Active Directory accounts. Another commonly used authentication method is ‘Federation’ where authentication for access to cloud resources is passed to another authentication provider such as an on-premises Active Directory.","ref":"https://azure.microsoft.com/en-gb/overview/what-is-hybrid-cloud-computing/","imgs":["https://free-braindumps.com/images/exam-prep/AZ-900/c43707f6-1ba1-4c5a-b592-f298d912fca5.jpg"],"eimgs":["https://free-braindumps.com/images/exam-prep/AZ-900/4f22d805-6f34-4cc2-8126-1fe074fb8330.jpg"],"t":"img"},{"q":"For each of the following statements, select Yes if the statement is true. Otherwise, select No.\nNOTE: Each correct selection is worth one point.\nHot Area:","opts":[],"cor":[],"exp":"","ref":"","imgs":["https://free-braindumps.com/images/exam-prep/AZ-900/a55a912d-c777-41dd-afc7-811d820d6192.jpg"],"eimgs":["https://free-braindumps.com/images/exam-prep/AZ-900/95abb850-9601-4e24-9fe7-faeccfe1f1bc.jpg"],"t":"img"},{"q":"Your company has an on-premises network that contains multiple servers.\n\nThe company plans to reduce the following administrative responsibilities:\n-Backing up application data\n-Replacing failed server hardware\n-Managing physical server security\n-Updating server operating systems\n-Managing permissions to shared documents\n\nThe company plans to migrate servers to Azure virtual machines.\nYou need to identify which administrative responsibilities will be eliminated after the planned migration.\n\nWhich two responsibilities should you identify? Each correct answer presents a complete solution.\nNOTE: Each correct selection is worth one point.","opts":["Replacing failed server hardware","Backing up application data","Managing physical server security","Updating server operating systems","Managing permissions to shared documents"],"cor":[0,2],"exp":"Azure virtual machines run on Hyper-V physical servers. The physical servers are owned and managed by Microsoft. As an Azure customer, you have no access to the physical servers. Microsoft manage the replacement of failed server hardware and the security of the physical servers so you don’t need to.\n\nIncorrect Answers:\nB: Microsoft have no control over the applications you run on the virtual machines. Therefore, it is your responsibility to ensure that application data is backed up.\nD: Microsoft do not manage the operating systems you run on the virtual machines. Therefore, it is your responsibility to ensure that the operating systems are updated.\nE: Microsoft have no control over the shared folders you host on the virtual machines. Therefore, it is your responsibility to ensure that folder permissions are configured appropriately.","ref":"","imgs":[],"eimgs":[],"t":"mc"},{"q":"For each of the following statements, select Yes if the statement is true. Otherwise, select No.\nNOTE: Each correct selection is worth one point.\nHot Area:","opts":[],"cor":[],"exp":"One of the major changes that you will face when you move from on-premises cloud to the public cloud is the switch from capital expenditure (buying hardware) to operating expenditure (paying for service as you use it).\n\nBox 1: No\nWith the pay-as-go model, you pay for services as you use them. This is Opex (Operational Expenditure), not CapEx (Captial Expenditure). CapEx is where you pay for something upfront. For example, buying a new physical server.\n\nBox 2: No\nPaying for electricity for your own datacenter will be classed as CapEx, not OpEx. \n\nBox 3: Yes\nDeploying your own datacenter is an example of CapEx. This is because you need to purchase all the infrastructure upfront before you can use it.","ref":"https://docs.microsoft.com/en-us/azure/architecture/cloud-adoption/appendix/azure-scaffold","imgs":["https://free-braindumps.com/images/exam-prep/AZ-900/1c8e0a66-e7a5-4c08-833f-848cd39aec04.jpg"],"eimgs":["https://free-braindumps.com/images/exam-prep/AZ-900/16f8c200-7ea7-49c7-a8aa-e0b8f7d8f93d.jpg"],"t":"img"},{"q":"You plan to provision Infrastructure as a Service (IaaS) resources in Azure.\nWhich resource is an example of IaaS?","opts":["an Azure web app","an Azure virtual machine","an Azure logic app","an Azure SQL database"],"cor":[1],"exp":"An Azure virtual machine is an example of Infrastructure as a Service (IaaS).\nAzure web app, Azure logic app and Azure SQL database are all examples of Platform as a Service (Paas).","ref":"https://azure.microsoft.com/en-gb/overview/what-is-iaas/\nhttps://azure.microsoft.com/en-gb/overview/what-is-paas/","imgs":[],"eimgs":[],"t":"mc"},{"q":"To which cloud models can you deploy physical servers?","opts":["private cloud and hybrid cloud only","private cloud only","private cloud, hybrid cloud and public cloud","hybrid cloud only"],"cor":[0],"exp":"A private cloud is on-premises so you can deploy physical servers.\nA hybrid cloud is a mix of on-premise and public cloud resources. You can deploy physical servers on- premises.","ref":"https://azure.microsoft.com/en-gb/overview/what-is-hybrid-cloud-computing/","imgs":[],"eimgs":[],"t":"mc"},{"q":"Match the cloud model to the correct advantage.\n\nInstructions: To answer, drag the appropriate cloud model from the column on the left to its advantage on the right. Each cloud model may be used once, more than once, or not at all.\nNOTE: Each correct match is worth one point\nSelect and Place:","opts":[],"cor":[],"exp":"Box 1: Public Cloud\nWith a public cloud, there is no capital expenditure on server hardware etc. You only pay for cloud resources that you use as you use them.\n\nBox 2: Private Cloud\nA private cloud exists on premises, so you have complete control over security.\n\nBox 3: Hybrid Cloud\nA hybrid cloud is a mix of public cloud resources and on-premises resources. Therefore, you have a choice to use either.","ref":"","imgs":["https://free-braindumps.com/images/exam-prep/AZ-900/c633a65a-f6e1-4bce-ae21-f00930fe9b53.jpg"],"eimgs":["https://free-braindumps.com/images/exam-prep/AZ-900/905ad023-12f0-4966-8d09-2bf714f5108e.jpg"],"t":"img"},{"q":"For each of the following statements, select Yes if the statement is true. Otherwise, select No.\nNOTE: Each correct selection is worth one point.\nHot Area:","opts":[],"cor":[],"exp":"Box 1: No\nYou cannot add physical servers to the public cloud. You can only deploy virtual servers in the public cloud.\nYou can extend a private cloud by deploying virtual servers in a public cloud. This would create a hybrid cloud.\n\nBox 2: Yes\nA hybrid cloud is a combination of a private cloud and public cloud. Therefore, to create a hybrid cloud, you must deploy resources to a public cloud.\n\nBox 3: No.\nIt is not true that a private cloud must be disconnected from the Internet. Private clouds can be and most commonly are connected to the Internet. “Private cloud” means that the physical servers are managed by you. It does not mean that it is disconnected from the Internet.","ref":"https://azure.microsoft.com/en-gb/overview/what-are-private-public-hybrid-clouds/","imgs":["https://free-braindumps.com/images/exam-prep/AZ-900/2007ba92-9933-4ddc-8cff-ce078a1026c0.jpg"],"eimgs":["https://free-braindumps.com/images/exam-prep/AZ-900/d84ac57a-daa0-4503-8b45-1d207d4aa66a.jpg"],"t":"img"},{"q":"You have 50 virtual machines hosted on-premises and 50 virtual machines hosted in Azure. The on-premises virtual machines and the Azure virtual machines connect to each other. \n\nWhich type of cloud model is this?","opts":["hybrid","private","public"],"cor":[0],"exp":"","ref":"https://azure.microsoft.com/en-gb/overview/what-is-hybrid-cloud-computing/","imgs":[],"eimgs":[],"t":"mc"},{"q":"For each of the following statements, select Yes if the statement is true. Otherwise, select No.\nNOTE: Each correct selection is worth one point.\nHot Area:","opts":[],"cor":[],"exp":"Box 1: No\nA PaaS solution does not provide access to the operating system. The Azure Web Apps service provides an environment for you to host your web applications. Behind the scenes, the web apps are hosted on virtual machines running IIS. However, you have no direct access to the virtual machine, the operating system or IIS.\nBox 2: Yes\nBox 3: Yes\nA PaaS solution that hosts web apps in Azure does provide the ability to scale the platform automatically. This is known as autoscaling. Behind the scenes, the web apps are hosted on virtual machines running IIS. Autoscaling means adding more load balanced virtual machines to host the web apps.","ref":"https://azure.microsoft.com/en-gb/overview/what-is-paas/","imgs":["https://free-braindumps.com/images/exam-prep/AZ-900/126a708e-afec-4ac4-8cd2-56630938165f.jpg"],"eimgs":["https://free-braindumps.com/images/exam-prep/AZ-900/d784882e-f19b-4ad9-bbfd-54f6254073cc.jpg"],"t":"img"},{"q":"Your company plans to deploy several custom applications to Azure. The applications will provide invoicing services to the customers of the company. Each application will have several prerequisite applications and services installed.\nYou need to recommend a cloud deployment solution for all the applications.\

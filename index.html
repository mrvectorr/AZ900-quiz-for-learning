quired to load content.\n-Large scaling to better handle instantaneous high loads, such as the start of a product launch event.\n-Distribution of user requests and serving of content directly from edge servers so that less traffic is sent to the origin server.","ref":"https://docs.microsoft.com/en-us/azure/cdn/cdn-overview","imgs":[],"eimgs":[],"t":"mc"},{"q":"Your company plans to deploy several million sensors that will upload data to Azure.\nYou need to identify which Azure resources must be created to support the planned solution.\nWhich two Azure resources should you identify? Each correct answer presents part of the solution.\nNOTE: Each correct selection is worth one point.","opts":["Azure Data Lake","Azure Queue storage","Azure File Storage","Azure IoT Hub","Azure Notification Hubs"],"cor":[0,3],"exp":"IoT Hub (Internet of things Hub) provides data from millions of sensors.\n\nIoT Hub is a managed service, hosted in the cloud, that acts as a central message hub for bi-directional communication between your IoT application and the devices it manages. You can use Azure IoT Hub to build IoT solutions with reliable and secure communications between millions of IoT devices and a cloud-hosted solution backend. You can connect virtually any device to IoT Hub.\n\nThere are two storage services IoT Hub can route messages to -- Azure Blob Storage and Azure Data Lake Storage Gen2 (ADLS Gen2) accounts. Azure Data Lake Storage accounts are hierarchical namespace-enabled storage accounts built on top of blob storage. Both of these use blobs for their storage.","ref":"https://docs.microsoft.com/en-us/azure/iot-hub/about-iot-hub\nhttps://docs.microsoft.com/en-us/azure/iot-hub/iot-hub-devguide-messages-d2c","imgs":[],"eimgs":[],"t":"mc"},{"q":"You have an Azure web app.\nYou need to manage the settings of the web app from an iPhone.\nWhat are two Azure management tools that you can use? Each correct answer presents a complete solution.\nNOTE: Each correct selection is worth one point.","opts":["Azure CLI","the Azure portal","Azure Cloud Shell","Windows PowerShell","Azure Storage Explorer"],"cor":[1,2],"exp":"The Azure portal is the web-based portal for managing Azure. Being web-based, you can use the Azure portal on an iPhone.\n\nAzure Cloud Shell is a web-based command line for managing Azure. You access the Azure Cloud Shell from the Azure portal. Being web-based, you can use the Azure Cloud Shell on an iPhone.\n\nIncorrect Answers:\nA: Azure CLI can be installed on MacOS but it cannot be installed on an iPhone.\nD: Windows PowerShell can be installed on MacOS but it cannot be installed on an iPhone.\nE: Azure Storage Explorer is not used to manage Azure web apps.","ref":"http://www.deployazure.com/management/managing-azure-from-ipad/","imgs":[],"eimgs":[],"t":"mc"},{"q":"Your company plans to deploy an Artificial Intelligence (AI) solution in Azure.\nWhat should the company use to build, test, and deploy predictive analytics solutions?","opts":["Azure Logic Apps","Azure Machine Learning Designer","Azure Batch","Azure Cosmos B"],"cor":[1],"exp":"Azure Machine Learning designer lets you visually connect datasets and modules on an interactive canvas to create machine learning models.","ref":"https://docs.microsoft.com/en-us/azure/machine-learning/concept-designer","imgs":[],"eimgs":[],"t":"mc"},{"q":"For each of the following statements, select Yes if the statement is true. Otherwise, select No.\nNOTE: Each correct selection is worth one point.\nHot Area:","opts":[],"cor":[],"exp":"Box 1: No\nAzure Advisor does not generate a list of virtual machines that ARE protected by Azure Backup. Azure Advisor does however, generate a list of virtual that ARE NOT protected by Azure Backup. You can view a list of virtual machines that are protected by Azure Backup by viewing the Protected Items in the Azure Recovery Services Vault.\n\nBox 2: No\nIf you implement the security recommendations, you company’s score will increase, not decrease.\n\nBox 3: No\nThere is no requirement to implement the security recommendations provided by Azure Advisor. The recommendations are just that, ‘recommendations’. They are not ‘requirements’.","ref":"https://azure.microsoft.com/en-gb/blog/advisor-backup-recommendations/\nhttps://docs.microsoft.com/en-us/azure/advisor/advisor-overview\nhttps://microsoft.github.io/AzureTipsAndTricks/blog/tip173.html","imgs":["https://free-braindumps.com/images/exam-prep/AZ-900/5204b8b0-3b85-4639-bb02-00f12ad24677.jpg"],"eimgs":["https://free-braindumps.com/images/exam-prep/AZ-900/2ee24dae-66c4-45ff-91a7-1eb442c752ef.jpg"],"t":"img"},{"q":"What can you use to automatically send an alert if an administrator stops an Azure virtual machine?","opts":["Azure Advisor","Azure Service Health","Azure Monitor","Azure Network Watcher"],"cor":[2],"exp":"","ref":"https://docs.microsoft.com/en-us/azure/azure-monitor/insights/vminsights-alerts","imgs":[],"eimgs":[],"t":"mc"},{"q":"Match the Azure services to the correct descriptions.\n\nInstructions: To answer, drag the appropriate Azure service from the column on the left to its description on the right. Each service may be used once, more than once, or not at all.\nNOTE: Each correct match is worth one point\nSelect and Place:","opts":[],"cor":[],"exp":"Box 1: Azure SQL Synapse Analytics\nAzure SQL Synapse Analytics (previously called Data Warehouse) is a cloud-based Platform-as-a-Service (PaaS) offering from Microsoft. It is a large-scale, distributed, MPP (massively parallel processing) relational database technology in the same class of competitors as Amazon Redshift or Snowflake. Azure SQL Synapse Analytics is an important component of the Modern Data Warehouse multi-platform architecture. Because Azure SQL Synapse Analytics is an MPP system with a shared-nothing architecture across distributions, it is meant for large-scale analytical workloads which can take advantage of parallelism.\n\nBox 2:\nAzure Machine Learning uses past trainings to provide predictions that have high probability.\nMachine learning is a data science technique that allows computers to use existing data to forecast future behaviors, outcomes, and trends. By using machine learning, computers learn without being explicitly programmed.\nForecasts or predictions from machine learning can make apps and devices smarter. For example, when you shop online, machine learning helps recommend other products you might want based on what you've bought.\n\nBox 3:\nAzure Functions provides serverless computing functionalities.\nAzure Functions is a serverless compute service that lets you run event-triggered code without having to explicitly provision or manage infrastructure.\n\nBox 4:\nIoT Hub (Internet of things Hub) provides data from millions of sensors.\nIoT Hub is a managed service, hosted in the cloud, that acts as a central message hub for bi-directional communication between your IoT application and the devices it manages. You can use Azure IoT Hub to build IoT solutions with reliable and secure communications between millions of IoT devices and a cloud-hosted solution backend. You can connect virtually any device to IoT Hub.","ref":"https://azure.microsoft.com/en-gb/services/synapse-analytics/ \nhttps://docs.microsoft.com/en-us/azure/machine-learning/overview-what-is-azure-ml \nhttps://docs.microsoft.com/en-us/azure/iot-hub/about-iot-hub \nhttps://docs.microsoft.com/en-us/azure/azure-functions/functions-overview","imgs":["https://free-braindumps.com/images/exam-prep/AZ-900/5b6d66b4-f323-4f85-88b0-a329d7794907.jpg"],"eimgs":["https://free-braindumps.com/images/exam-prep/AZ-900/6dd47c5d-b250-4294-bf75-458d7e0bffb6.jpg"],"t":"img"},{"q":"A team of developers at your company plans to deploy, and then remove, 50 virtual machines each week. All the virtual machines are configured by using Azure Resource Manager templates.\nYou need to recommend which Azure service will minimize the administrative effort required to deploy and remove the virtual machines.\nWhat should you recommend?","opts":["Azure Reserved Virtual Machine (VM) Instances","Azure DevTest Labs","Azure virtual machine scale sets","Microsoft Managed Desktop"],"cor":[1],"exp":"DevTest Labs creates labs consisting of pre-configured bases or Azure Resource Manager templates.\nBy using DevTest Labs, you can test the latest versions of your applications by doing the following tasks:\n-Quickly provision Windows and Linux environments by using reusable templates and artifacts.\n-Easily integrate your deployment pipeline with DevTest Labs to provision on-demand environments.\n-Scale up your load testing by provisioning multiple test agents and create pre-provisioned environments for training and demos.","ref":"https://docs.microsoft.com/en-us/azure/lab-services/devtest-lab-overview","imgs":[],"eimgs":[],"t":"mc"},{"q":"For each of the following statements, select Yes if the statement is true. Otherwise, select No.\nNOTE: Each correct selection is worth one point.\nHot Area:","opts":[],"cor":[],"exp":"Box 1: No\nAzure Advisor provides you with a consistent, consolidated view of recommendations for all your Azure resources. It integrates with Azure Security Center to bring you security recommendations. You can get security recommendations from the Security tab on the Advisor dashboard. Examples of recommendations include restricting access to virtual machines by configuring Network Security Groups, enabling storage encryption, installing vulnerability assessment solutions.\n\nHowever, Azure Advisor does not provide recommendations on how to improve the security of an Azure AD environment.\n\nBox 2: Yes\nAdvisor helps you optimize and reduce your overall Azure spend by identifying idle and underutilized resources.\nYou can get cost recommendations from the Cost tab on the Advisor dashboard.\n\nBox 3: No.\nAzure Advisor does not provide recommendations on how to configure network settings on Azure virtual machines.","ref":"https://docs.microsoft.com/en-us/azure/advisor/advisor-security-recommendations\nhttps://docs.microsoft.com/en-us/azure/advisor/advisor-cost-recommendations","imgs":["https://free-braindumps.com/images/exam-prep/AZ-900/33f80256-38f1-467d-a368-d18840cdc551.jpg"],"eimgs":["https://free-braindumps.com/images/exam-prep/AZ-900/03142bb2-5ad9-44e6-8d34-0a275b9c212f.jpg"],"t":"img"},{"q":"Several support engineers plan to manage Azure by using the computers shown in the following table:\n\nYou need to identify which Azure management tools can be used from each computer.\nWhat should you identify for each computer? To answer, select the appropriate options in the answer area.\n\nNOTE: Each correct selection is worth one point.\nHot Area:","opts":[],"cor":[],"exp":"Previously, the Azure CLI (or x-plat CLI) was the only option for managing Azure subscriptions and resources from the command-line on Linux and macOS. Now with the open source and cross-platform release of PowerShell, you’ll be able to manage all your Azure resources from Windows, Linux and macOS using your tool of choice, either the Azure CLI or Azure PowerShell cmdlets.\nThe Azure portal runs in a web browser so can be used in either operating system.","ref":"https://buildazure.com/2016/08/18/powershell-now-open-source-and-cross-platform-linux-macos-windows/","imgs":["https://free-braindumps.com/images/exam-prep/AZ-900/5b764074-2c47-4896-acc3-be93084614d8.jpg","https://free-braindumps.com/images/exam-prep/AZ-900/27ac9a45-1f4d-451e-a85f-06382ab2a7a0.jpg"],"eimgs":["https://free-braindumps.com/images/exam-prep/AZ-900/e85b58b0-f5ac-4ee2-8b6c-c93e366605ed.jpg"],"t":"img"},{"q":"To complete the sentence, select the appropriate option in the answer area.","opts":[],"cor":[],"exp":"","ref":"","imgs":["https://free-braindumps.com/images/exam-prep/AZ-900/e1a5370d-5a1f-4061-8085-b9b832831706.jpg"],"eimgs":["https://free-braindumps.com/images/exam-prep/AZ-900/be351646-9041-49d6-8b8c-f030311d4aba.jpg"],"t":"img"},{"q":"To complete the sentence, select the appropriate option in the answer area.\nHot Area:","opts":[],"cor":[],"exp":"Azure Resource Manager templates provides a common platform for deploying objects to a cloud infrastructure and for implementing consistency across the Azure environment.\n\nAzure policies are used to define rules for what can be deployed and how it should be deployed. Whilst this can help in ensuring consistency, Azure policies do not provide the common platform for deploying objects to a cloud infrastructure.","ref":"https://docs.microsoft.com/en-us/azure/governance/policy/overview","imgs":["https://free-braindumps.com/images/exam-prep/AZ-900/84f43f33-5190-4eab-bbef-b23ed4110a8d.jpg"],"eimgs":["https://free-braindumps.com/images/exam-prep/AZ-900/799a0b82-a528-45d7-aef9-7680d7785dd2.jpg"],"t":"img"},{"q":"Match the Azure service to the correct description.\n\nInstructions: To answer, drag the appropriate Azure service from the column on the left to its description on the right. Each service may be used once, more than once, or not at all.\n\nNOTE: Each correct selection is worth one point.\nSelect and Place:","opts":[],"cor":[],"exp":"Box 1:\nAzure Bot Services provides a digital online assistant that provides speech support.\n\nBots provide an experience that feels less like using a computer and more like dealing with a person - or at least an intelligent robot. They can be used to shift simple, repetitive tasks, such as taking a dinner reservation or gathering profile information, on to automated systems that may no longer require direct human intervention. Users converse with a bot using text, interactive cards, and speech. A bot interaction can be a quick question and answer, or it can be a sophisticated conversation that intelligently provides access to services.\n\nBox 2:\nAzure Machine Learning uses past trainings to provide predictions that have high probability.\n\nMachine learning is a data science technique that allows computers to use existing data to forecast future behaviors, outcomes, and trends. By using machine learning, computers learn without being explicitly programmed.\n\nForecasts or predictions from machine learning can make apps and devices smarter. For example, when you shop online, machine learning helps recommend other products you might want based on what you've bought.\n\nBox 3:\nAzure Functions provides serverless computing functionalities.\n\nAzure Functions is a serverless compute service that lets you run event-triggered code without having to explicitly provision or manage infrastructure.\n\nBox 4:\nIoT Hub (Internet of things Hub) provides data from millions of sensors.\nIoT Hub is a managed service, hosted in the cloud, that acts as a central message hub for bi-directional communication between your IoT application and the devices it manages. You can use Azure IoT Hub to build\n\nIoT solutions with reliable and secure communications between millions of IoT devices and a cloud-hosted solution backend. You can connect virtually any device to IoT Hub.","ref":"https://docs.microsoft.com/en-us/azure/bot-service/bot-service-overview-introduction?view=azure-bot-service-4.0\nhttps://docs.microsoft.com/en-us/azure/machine-learning/overview-what-is-azure-ml\nhttps://docs.microsoft.com/en-us/azure/azure-functions/\nhttps://docs.microsoft.com/en-us/azure/iot-hub/about-iot-hub","imgs":["https://free-braindumps.com/images/exam-prep/AZ-900/52805762-9017-45f5-9a4a-bf0b32c82946.jpg"],"eimgs":["https://free-braindumps.com/images/exam-prep/AZ-900/3fbf4147-ed25-4ae2-aeac-89dd3313457a.jpg"],"t":"img"},{"q":"Match the Azure service to the correct description.\n\nInstructions: To answer, drag the appropriate Azure service from the column on the left to its description on the right. Each service may be used once, more than once, or not at all.\n\nNOTE: Each correct selection is worth one point. \nSelect and Place:","opts":[],"cor":[],"exp":"Box 1:\nAzure virtual machines provide operation system virtualization.\nAzure Virtual Machines (VM) is one of several types of on-demand, scalable computing resources that Azure offers. Typically, you choose a VM when you need more control over the computing environment than the other choices offer.\n\nBox 2:\nAzure Container Instances provide portable environments for virtualized applications.\nContainers are becoming the preferred way to package, deploy, and manage cloud applications. Azure Container Instances offers the fastest and simplest way to run a container in Azure, without having to manage any virtual machines and without having to adopt a higher-level service.\n\nContainers offer significant startup benefits over virtual machines (VMs). Azure Container Instances can start containers in Azure in seconds, without the need to provision and manage VMs.\n\nBox 3:\nAzure App Service is used to build, deploy and scale web apps.\nAzure App Service is a platform-as-a-service (PaaS) offering that lets you create web and mobile apps for any platform or device and connect to data anywhere, in the cloud or on-premises. App Service includes the web and mobile capabilities that were previously delivered separately as Azure Websites and Azure Mobile Services.\n\nBox 4:\nAzure Functions provide a platform for serverless code.\nAzure Functions is a serverless compute service that lets you run event-triggered code without having to explicitly provision or manage infrastructure.","ref":"https://docs.microsoft.com/en-us/azure/virtual-machines/windows/overview\nhttps://docs.microsoft.com/en-us/azure/security/fundamentals/paas-applications-using-app-services \nhttps://docs.microsoft.com/en-us/azure/azure-functions/\nhttps://docs.microsoft.com/en-us/azure/container-instances/container-instances-overview","imgs":["https://free-braindumps.com/images/exam-prep/AZ-900/83399942-9214-4675-8cb1-dd969ee68660.jpg"],"eimgs":["https://free-braindumps.com/images/exam-prep/AZ-900/f2e793e6-0254-4a7c-83fa-9dcac88dc9d9.jpg"],"t":"img"},{"q":"Which service provides serverless computing in Azure?","opts":["Azure Virtual Machines","Azure Functions","Azure storage account","Azure Container Instances"],"cor":[1],"exp":"Azure Functions provide a platform for serverless code.\nAzure Functions is a serverless compute service that lets you run event-triggered code without having to explicitly provision or manage infrastructure.","ref":"https://docs.microsoft.com/en-us/azure/azure-functions/","imgs":[],"eimgs":[],"t":"mc"},{"q":"Your company has several business units.\n\nEach business unit requires 20 different Azure resources for daily operation. All the business units require the same type of Azure resources.\n\nYou need to recommend a solution to automate the creation of the Azure resources.\nWhat should you include in the recommendations?","opts":["Azure Resource Manager templates","virtual machine scale sets","the Azure API Management service","management groups"],"cor":[0],"exp":"You can use Azure Resource Manager templates to automate the creation of the Azure resources. Deploying resource through templates is known as ‘Infrastructure as code’.\n\nTo implement infrastructure as code for your Azure solutions, use Azure Resource Manager templates. The template is a JavaScript Object Notation (JSON) file that defines the infrastructure and configuration for your project. The template uses declarative syntax, which lets you state what you intend to deploy without having to write the sequence of programming commands to create it. In the template, you specify the resources to deploy and the properties for those resources.","ref":"https://docs.microsoft.com/en-us/azure/azure-resource-manager/templates/overview","imgs":[],"eimgs":[],"t":"mc"},{"q":"For each of the following statements, select Yes if the statement is true. Otherwise, select No.\nNOTE: Each correct selection is worth one point.","opts":[],"cor":[],"exp":"","ref":"https://docs.microsoft.com/en-us/azure/cost-management-billing/costs/quick-acm-cost-analysis\nhttps://docs.microsoft.com/en-us/azure/cost-management-billing/costs/cost-analysis-common-uses","imgs":["https://free-braindumps.com/images/exam-prep/AZ-900/715e66b5-41a0-47be-ad29-7bc4de900e38.jpg"],"eimgs":["https://free-braindumps.com/images/exam-prep/AZ-900/69bfa025-574d-4d52-ae91-3874a777a670.jpg"],"t":"img"}];

const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const imgs=a=>(a||[]).map(u=>`<img loading="lazy" src="${esc(u)}" alt="">`).join('');
const expHtml=q=>(q.eimgs&&q.eimgs.length?imgs(q.eimgs):'')+(q.exp||q.ref?`<div class="exp">${esc(q.exp||'')}${q.ref?`\n\nReference: ${esc(q.ref)}`:''}</div>`:'');

function home(){
 app.innerHTML=`<h1>AZ-900 Quiz</h1><p class="mu">${Q.length} questions total, ${MC.length} with answer options.</p>
 <div class="card"><h2>Learn</h2><p class="mu">Go through all ${Q.length} questions. Pick an answer and see right or wrong with the explanation.</p><button id="l">Start learning</button></div>
 <div class="card"><h2>Quiz</h2><p class="mu">20 random questions with instant right or wrong feedback. Summary at the end, then retake only the ones you got wrong.</p><button id="z">Start quiz</button></div>`;
 $('#l').onclick=()=>learn();$('#z').onclick=()=>quiz(shuffle(MC).slice(0,20),0);
}

function learn(){
 app.innerHTML=`<button class="sec" id="h">Home</button><input type="search" id="s" placeholder="Search questions..."><p class="mu" id="c"></p><div id="list"></div>`;
 $('#h').onclick=home;
 const draw=()=>{
  const t=$('#s').value.toLowerCase();
  const r=Q.map((q,i)=>[q,i]).filter(([q])=>!t||(q.q+q.opts.join(' ')+q.exp).toLowerCase().includes(t));
  $('#c').textContent=r.length+' questions';
  const list=$('#list');list.innerHTML='';
  r.forEach(([q,i])=>list.appendChild(card(q,i)));
 };
 $('#s').oninput=draw;draw();
}
function card(q,i){
 const el=document.createElement('div');el.className='card';
 const multi=q.cor.length>1,sel=new Set();let done=false;
 const paint=()=>{
  const ok=q.cor.length===sel.size&&q.cor.every(c=>sel.has(c));
  el.innerHTML=`<span class="tag">#${i+1}${multi?' - select '+q.cor.length:''}</span>
  <div class="q">${esc(q.q)}</div>${imgs(q.imgs)}
  ${q.t==='mc'?q.opts.map((o,k)=>{
    let c='';if(done)c=q.cor.includes(k)?'ok':sel.has(k)?'bad':'';else if(sel.has(k))c='sel';
    return `<div class="opt ${c}" data-k="${k}"><b>${L[k]}</b><span>${esc(o)}</span></div>`}).join(''):''}
  ${done&&q.t==='mc'?`<p><b style="color:var(--${ok?'ok':'no'})">${ok?'Correct!':'Wrong'}</b></p>`:''}
  ${q.t==='mc'&&!done&&(multi||false)?`<button data-a="chk" ${sel.size?'':'disabled'}>Check</button>`:''}
  ${q.t==='img'&&!done?`<button data-a="show">Show answer</button>`:''}
  ${done?expHtml(q)+`<button class="sec" data-a="reset">Try again</button>`:''}`;
 };
 el.onclick=e=>{
  const o=e.target.closest('.opt'),b=e.target.closest('button');
  if(o&&!done&&q.t==='mc'){
   const k=+o.dataset.k;
   if(multi){sel.has(k)?sel.delete(k):sel.add(k)}else{sel.add(k);done=true}
   paint();
  }else if(b){
   const a=b.dataset.a;
   if(a==='chk'||a==='show')done=true;
   if(a==='reset'){done=false;sel.clear()}
   paint();
  }
 };
 paint();return el;
}

function quiz(set,round){
 let i=0;const ans=[],lock=[];
 const show=()=>{
  const q=set[i],multi=q.cor.length>1;ans[i]=ans[i]||new Set();const L_=lock[i];
  const ok=q.cor.length===ans[i].size&&q.cor.every(c=>ans[i].has(c));
  app.innerHTML=`<div class="bar"><i style="width:${i/set.length*100}%"></i></div>
  <p class="mu">${round?'Retake - ':''}Question ${i+1} of ${set.length}</p>
  <div class="card"><div class="q">${esc(q.q)}</div>${imgs(q.imgs)}
  ${multi?`<p class="mu">Select ${q.cor.length}</p>`:''}
  ${q.opts.map((o,k)=>{let c='';if(L_)c=q.cor.includes(k)?'ok':ans[i].has(k)?'bad':'';else if(ans[i].has(k))c='sel';
   return `<div class="opt ${c}" data-k="${k}"><b>${L[k]}</b><span>${esc(o)}</span></div>`}).join('')}
  ${L_?`<p><b style="color:var(--${ok?'ok':'no'})">${ok?'Correct!':'Wrong'}</b></p>${expHtml(q)}`:''}
  ${!L_&&multi?`<button id="c" ${ans[i].size?'':'disabled'}>Check</button>`:''}</div>
  <button class="sec" id="p" ${i?'':'disabled'}>Back</button><button id="n" ${L_?'':'disabled'}>${i==set.length-1?'Finish':'Next'}</button>`;
  document.querySelectorAll('.opt').forEach(e=>e.onclick=()=>{
   if(lock[i])return;const k=+e.dataset.k;
   if(multi){ans[i].has(k)?ans[i].delete(k):ans[i].add(k)}else{ans[i].add(k);lock[i]=true}
   show();});
  if($('#c'))$('#c').onclick=()=>{lock[i]=true;show()};
  $('#p').onclick=()=>{i--;show()};
  $('#n').onclick=()=>{i<set.length-1?(i++,show()):done()};
 };
 const done=()=>{
  const res=set.map((q,k)=>{const a=ans[k]||new Set();return {q,a,ok:a.size===q.cor.length&&q.cor.every(c=>a.has(c))}});
  const wrong=res.filter(r=>!r.ok),score=res.length-wrong.length;
  app.innerHTML=`<h1>Result: ${score} / ${res.length} (${Math.round(score/res.length*100)}%)</h1>
  ${wrong.length?`<button id="r">Retake ${wrong.length} wrong</button>`:'<p>All correct!</p>'}<button class="sec" id="a">New quiz</button><button class="sec" id="h">Home</button>
  <h2 style="margin-top:16px">Review</h2>
  ${res.map((r,k)=>`<div class="card"><span class="tag">${r.ok?'correct':'wrong'}</span><div class="q">${k+1}. ${esc(r.q.q)}</div>
   ${r.q.opts.map((o,j)=>{const c=r.q.cor.includes(j),s=r.a.has(j);return `<div class="opt ${c?'ok':s?'bad':''}"><b>${L[j]}</b><span>${esc(o)}${s?' (your answer)':''}</span></div>`}).join('')}
   ${expHtml(r.q)}</div>`).join('')}`;
  if(wrong.length)$('#r').onclick=()=>quiz(shuffle(wrong.map(r=>r.q)),round+1);
  $('#a').onclick=()=>quiz(shuffle(MC).slice(0,20),0);$('#h').onclick=home;
 };
 show();
}
home();
</script></body></html>
